name: Set up repository toolchain
description: Install the pinned Node, pnpm, optional Go toolchain, and frozen dependencies.

inputs:
  install-dependencies:
    description: Install the frozen pnpm dependency graph.
    required: false
    default: "true"
  install-go:
    description: Install the Go toolchain declared by apps/api/go.mod.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        cache: true
        cache_dependency_path: pnpm-lock.yaml
        run_install: false

    - name: Set up pinned Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Set up pinned Go
      if: inputs.install-go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: true
        go-version-file: apps/api/go.mod

    - name: Install frozen dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
