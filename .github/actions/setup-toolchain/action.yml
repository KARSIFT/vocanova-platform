name: Set up repository toolchain
description: Install the pinned Node/pnpm toolchain and frozen dependencies.

inputs:
  install-dependencies:
    description: Install the frozen pnpm dependency graph.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        cache: true
        cache_dependency_path: pnpm-lock.yaml
        run_install: false

    - name: Set up pinned Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Install frozen dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
