name: diag-cf-raw
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for m in "@cf/meta/llama-3.3-70b-instruct-fp8-fast" "@cf/meta/llama-3.1-8b-instruct-fp8-fast" "@cf/meta/llama-3.1-8b-instruct-fast" "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"; do
            echo "=== $m ==="
            start=$(date +%s.%N)
            curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
              -X POST \
              --max-time 15 \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/${m}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"messages":[{"role":"user","content":"Say PASS"}]}'
            end=$(date +%s.%N)
            echo "elapsed: $(echo "$end - $start" | bc)s"
            echo
          done
