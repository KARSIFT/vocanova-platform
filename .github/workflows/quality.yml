name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Quality scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect web and package changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/quality-paths"
          if grep -zEq '^(apps/web/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/actions/setup-toolchain/|\.github/workflows/quality\.yml$)' "$RUNNER_TEMP/quality-paths"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  accessibility:
    name: Accessibility
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Build shared packages
        run: pnpm run build:packages
      - name: Build web application
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @vocanova/web build
      - name: Install Chromium
        run: pnpm --filter @vocanova/web exec playwright install chromium
      - name: Run accessibility suite
        env:
          CI: "1"
        run: pnpm --filter @vocanova/web test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  lighthouse:
    name: Lighthouse
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Build shared packages
        run: pnpm run build:packages
      - name: Build web application
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @vocanova/web build
      - name: Install Chromium
        run: pnpm --filter @vocanova/web exec playwright install chromium
      - name: Start local test servers
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: |
          node apps/web/tests/e2e/mock-api-server.mjs &
          echo $! > "$RUNNER_TEMP/mock-api.pid"
          pnpm --filter @vocanova/web start --port 3000 &
          echo $! > "$RUNNER_TEMP/web.pid"
      - name: Run Lighthouse suite
        env:
          CI: "1"
          LIGHTHOUSE_URL_PREFIX: http://127.0.0.1:3000
        run: |
          mapfile -t chrome_candidates < <(
            find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f -print
          )
          if [[ "${#chrome_candidates[@]}" -ne 1 ]]; then
            echo "Expected exactly one Playwright Chrome binary; found ${#chrome_candidates[@]}." >&2
            exit 1
          fi
          export LIGHTHOUSE_CHROME_PATH="${chrome_candidates[0]}"
          pnpm --filter @vocanova/web test:lighthouse
      - name: Stop local test servers
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/mock-api.pid" || kill "$(cat "$RUNNER_TEMP/mock-api.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-lighthouse-reports
          path: apps/web/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 3
