name: Quality

# Browser-heavy accessibility and Lighthouse checks run only when web-facing
# source, shared packages, their locked dependencies, or this workflow changes.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/quality.yml

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Build web application
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @vocanova/web build

      - name: Install Chromium
        # ubuntu-24.04 already carries the browser system libraries. Avoid
        # re-running apt here: the browser binary remains pinned by Playwright.
        run: pnpm --filter @vocanova/web exec playwright install chromium

      - name: Run accessibility suite
        env:
          CI: "1"
        run: pnpm --filter @vocanova/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-playwright-results
          path: apps/web/test-results/
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Build web application
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @vocanova/web build

      - name: Install Chromium
        # ubuntu-24.04 already carries the browser system libraries. Avoid
        # re-running apt here: the browser binary remains pinned by Playwright.
        run: pnpm --filter @vocanova/web exec playwright install chromium

      - name: Start local test servers
        env:
          API_BASE_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: |
          node apps/web/tests/e2e/mock-api-server.mjs &
          echo $! > "$RUNNER_TEMP/mock-api.pid"
          pnpm --filter @vocanova/web start --port 3000 &
          echo $! > "$RUNNER_TEMP/web.pid"

      - name: Run Lighthouse suite
        env:
          CI: "1"
          LIGHTHOUSE_URL_PREFIX: http://127.0.0.1:3000
        run: |
          export LIGHTHOUSE_CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux/chrome' -type f | head -1)"
          test -n "$LIGHTHOUSE_CHROME_PATH"
          pnpm --filter @vocanova/web test:lighthouse

      - name: Stop local test servers
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/mock-api.pid" || kill "$(cat "$RUNNER_TEMP/mock-api.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-lighthouse-reports
          path: apps/web/lighthouse-reports/
          retention-days: 7
