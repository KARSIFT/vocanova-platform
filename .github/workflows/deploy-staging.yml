name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact revision
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Validate repository
        run: pnpm validate
      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level high

  deploy:
    name: Deploy staging
    needs: validate
    environment:
      name: staging
      url: https://stag.vocanova.site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Build API Worker
        run: pnpm run build:worker-api
      - name: Build web Worker
        run: pnpm --filter @vocanova/web cloudflare:build
        env:
          API_BASE_URL: https://api-stag.vocanova.site
          NEXT_PUBLIC_API_BASE_URL: https://api-stag.vocanova.site
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: staging
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @vocanova/api-worker exec wrangler d1 migrations apply DB
          --remote --env staging
      - name: Deploy API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @vocanova/api-worker exec wrangler deploy
          --env staging --strict
          --experimental-provision=false --experimental-auto-create=false
          --tag sha-${GITHUB_SHA} --message "GitHub ${GITHUB_SHA}"
          --var RELEASE:${GITHUB_SHA}
      - name: Deploy web Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @vocanova/web exec wrangler deploy
          --env staging --strict
          --experimental-provision=false --experimental-auto-create=false
          --tag sha-${GITHUB_SHA} --message "GitHub ${GITHUB_SHA}"
      - name: Verify staging release
        run: node scripts/foundation/smoke-staging.mjs "$GITHUB_SHA"
