name: debug-fetch-production-logs

# One-off, read-only diagnostic workflow for VOC-038-T03: real Google
# sign-in still loops back to /signin after Google auth completes, despite
# VOC-039's fixes (Node runtime middleware, structured auth-check-failure
# logging in apps/web/src/middleware.ts) being live in production. No
# product code path is touched by this workflow - SSH + `docker compose
# logs` only, gated by the same `environment: production` approval as
# deploy-production.yml since it reads the same PRODUCTION_SSH_* secrets.
#
# Version history (manually bumped - this file has no other versioning):
#   v1 (2026-08-06T11:32Z) - web + api logs, --since=15m. Came back empty;
#     the founder's sign-in attempt predated the window.
#   v2 (2026-08-06T12:35Z) - widened to --since=3h. Still only showed
#     container boot lines - apps/web and apps/api don't log routine
#     per-request activity by default, only T02's structured failure
#     lines (which never fired), so this couldn't tell us whether the
#     OAuth callback request even reached the server.
#   v3 (2026-08-06T12:39Z) - added nginx access logs (infra/docker-
#     compose.yml's `nginx` service fronts every request over TLS at
#     the network edge, so it logs regardless of what the app containers
#     log) filtered to oauth/callback/signin/me paths, plus an
#     unfiltered tail as a fallback.
#
# Delete this file once VOC-038-T03's real sign-in bug is root-caused -
# it's diagnostic scaffolding, not a permanent part of the pipeline.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch recent nginx + api + web logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/vocanova/production
            echo "===== nginx (last 3h, oauth/callback/signin/me related) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=3h nginx \
              | grep -iE "oauth|callback|/api/v1/me|signin|/onboarding|/home" | tail -300 || echo "(no matching nginx lines)"
            echo "===== nginx (last 3h, unfiltered tail) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=3h nginx | tail -100
            echo "===== web (last 3h) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=3h web | tail -300
            echo "===== api (last 3h) ====="
            docker compose -f docker-compose.production.yml -p vocanova-production logs --no-color --since=3h api | tail -300
