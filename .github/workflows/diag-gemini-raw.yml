name: diag-gemini-raw
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          curl -sS "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            -H "x-goog-api-key: $GEMINI_API_KEY" > /tmp/models.json
          jq -r '.models[] | select(.supportedGenerationMethods[]? == "generateContent") | "\(.name) | \(.displayName)"' /tmp/models.json
