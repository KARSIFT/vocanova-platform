name: diag-gemini-raw
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          for m in gemini-flash-latest gemini-2.0-flash gemini-2.5-flash-lite gemini-3.5-flash; do
            echo "=== $m ==="
            curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -d '{"contents":[{"role":"user","parts":[{"text":"Say PASS"}]}]}'
            echo
          done
