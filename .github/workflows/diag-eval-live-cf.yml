name: diag-eval-live-cf
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Run live Cloudflare Workers AI evaluation
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          go run ./cmd/eval-live \
            --provider cloudflare \
            --api-key "$CLOUDFLARE_API_TOKEN" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --model "@cf/meta/llama-3.1-8b-instruct-fp8-fast" \
            --request-interval 1s \
            --cost-ceiling 0.25 \
            --notes "VOC-036-T03 live evaluation, model overridden to the smaller 8B variant after the 70B default hit the 8s timeout on real-size prompts (fix already in PR #253; this is a model-selection follow-up, not a bug)" \
            > /tmp/eval-live-report.txt 2>&1
          code=$?
          echo "=== report ==="
          cat /tmp/eval-live-report.txt
          echo "=== exit code: $code ==="
