name: CI
run-name: >-
  CI ${{ github.event.inputs.delivery_environment || github.event_name }}
  authority=${{ github.event.inputs.action_authority_sha256 || 'none' }}-${{ github.event.inputs.dispatch_nonce || 'none' }}

# Deterministic repository validation. Commands remain in package scripts so the
# same validation can be run locally without reproducing CI-only logic.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      delivery_environment:
        description: Held target; the reviewed manifest and named action hold must authorize it
        required: true
        type: choice
        options: [staging, production]
      reviewed_sha:
        description: Exact independently reviewed 40-character revision
        required: true
        type: string
      action_authority_url:
        description: Exact canonical VOC-094 ACT-04 authority comment
        required: true
        type: string
      action_authority_sha256:
        description: Exact ACT-04 raw-body SHA-256
        required: true
        type: string
      act03_evidence_url:
        description: Exact canonical VOC-094 ACT-03 comment
        required: true
        type: string
      act03_evidence_sha256:
        description: Exact ACT-03 raw-body SHA-256
        required: true
        type: string
      pr2_review_url:
        description: Exact merged-PR2 independent-review comment
        required: true
        type: string
      pr2_review_sha256:
        description: Exact merged-PR2 review raw-body SHA-256
        required: true
        type: string
      binder_review_url:
        description: Exact post-authority binder-review comment
        required: true
        type: string
      binder_review_sha256:
        description: Exact binder-review raw-body SHA-256
        required: true
        type: string
      dispatch_nonce:
        description: Exact one-use 128-bit-or-stronger ACT-04 nonce
        required: true
        type: string
      estimated_cost_cents:
        description: Release cost estimate checked against the reviewed ceiling
        required: true
        default: "0"
        type: string
      previous_api_version_id:
        description: Exact last-known-good API Worker version UUID for rollback
        required: true
        type: string
      previous_web_version_id:
        description: Exact last-known-good web Worker version UUID for rollback
        required: true
        type: string
      staging_evidence_url:
        description: Production-only exact staging/soak evidence from the reviewed manifest
        required: false
        type: string
      backup_evidence_url:
        description: Production-only D1 backup/Time Travel evidence from the reviewed manifest
        required: false
        type: string
      confirmation:
        description: Exact `DEPLOY <environment> <sha>` acknowledgement
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.delivery_environment || 'validation' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate foundation
        run: pnpm run ci:foundation

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate shared packages
        run: pnpm run ci:packages

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate web application
        run: pnpm run ci:web

  worker-api:
    name: worker api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate Worker API and local D1
        run: pnpm run ci:worker-api

  local-stack:
    name: local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate disposable local Workers stack
        run: pnpm run ci:local-stack

  cloudflare-delivery-policy:
    name: cloudflare delivery policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact delivery policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: "false"

      - name: Validate held delivery state machine
        run: pnpm run ci:delivery

  required:
    name: ci required
    if: always()
    needs:
      [
        foundation,
        packages,
        web,
        worker-api,
        local-stack,
        cloudflare-delivery-policy,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out aggregate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every subsystem
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WORKER_API_RESULT: ${{ needs.worker-api.result }}
          LOCAL_STACK_RESULT: ${{ needs.local-stack.result }}
          DELIVERY_POLICY_RESULT: ${{ needs.cloudflare-delivery-policy.result }}
        run: >-
          bash scripts/foundation/require-successful-jobs.sh
          "cloudflare-delivery-policy=$DELIVERY_POLICY_RESULT"
          "foundation=$FOUNDATION_RESULT"
          "local-stack=$LOCAL_STACK_RESULT"
          "packages=$PACKAGES_RESULT"
          "web=$WEB_RESULT"
          "worker-api=$WORKER_API_RESULT"

  delivery-gate:
    name: cloudflare delivery gate
    if: github.event_name == 'workflow_dispatch'
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      api_url: ${{ steps.gate.outputs.api_url }}
      web_url: ${{ steps.gate.outputs.web_url }}
      max_smoke_attempts: ${{ steps.gate.outputs.max_smoke_attempts }}
      max_smoke_seconds: ${{ steps.gate.outputs.max_smoke_seconds }}
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: "false"

      - name: Enforce exact SHA and live runtime binder
        id: gate
        run: >-
          node scripts/foundation/cloudflare-delivery-policy.mjs
          --event-path "$GITHUB_EVENT_PATH"

  cloudflare-staging:
    name: cloudflare staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.delivery-gate.result == 'success' &&
      needs.delivery-gate.outputs.environment == 'staging'
    needs: [required, delivery-gate]
    environment: cloudflare-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build exact API and web releases without credentials
        run: pnpm run build:packages && pnpm run build:worker-api && pnpm --filter @vocanova/web cloudflare:build

      - name: Recheck live runtime binder before any secret-bearing step
        id: pre-secret-recheck
        run: >-
          node scripts/foundation/cloudflare-delivery-policy.mjs
          --event-path "$GITHUB_EVENT_PATH"
          --pre-secret-recheck

      - name: Apply ordered compatible staging D1 migrations
        id: migrate
        env:
          ACT04_EXPIRES_AT: ${{ steps.pre-secret-recheck.outputs.act04_expires_at }}
          PHASE4_TOKEN_EXPIRES_AT: ${{ steps.pre-secret-recheck.outputs.phase4_token_expires_at }}
          SECRET_DEADLINE_BINDING_SHA256: ${{ steps.pre-secret-recheck.outputs.secret_deadline_binding_sha256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secret_step_started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          SECRET_STEP_STARTED_AT="$secret_step_started_at" \
            node scripts/foundation/cloudflare-delivery-policy.mjs \
              --verify-secret-step-start \
              --event-path "$GITHUB_EVENT_PATH"
          echo "Staging secret-bearing sequence started at ${secret_step_started_at}."
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm --filter @vocanova/api-worker exec wrangler d1 migrations apply DB --remote --env staging --experimental-provision=false --experimental-auto-create=false

      - name: Upload immutable staging Worker versions
        id: versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tag="sha-${GITHUB_SHA}"
          pnpm --filter @vocanova/api-worker exec wrangler versions upload --env staging --strict --experimental-provision=false --experimental-auto-create=false --tag "$tag" --message "VocaNova staging API ${GITHUB_SHA}" --var "RELEASE:${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler versions upload --env staging --strict --experimental-provision=false --experimental-auto-create=false --tag "$tag" --message "VocaNova staging web ${GITHUB_SHA}"
          api_version_id="$(pnpm --filter @vocanova/api-worker exec wrangler versions list --env staging --json | node scripts/foundation/cloudflare-delivery-policy.mjs --resolve-version-tag "$tag")"
          web_version_id="$(pnpm --filter @vocanova/web exec wrangler versions list --env staging --json | node scripts/foundation/cloudflare-delivery-policy.mjs --resolve-version-tag "$tag")"
          echo "api_version_id=$api_version_id" >> "$GITHUB_OUTPUT"
          echo "web_version_id=$web_version_id" >> "$GITHUB_OUTPUT"

      - name: Promote exact staging Worker versions
        id: promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @vocanova/api-worker exec wrangler versions deploy "${{ steps.versions.outputs.api_version_id }}@100%" --env staging --yes --message "Promote reviewed API ${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler versions deploy "${{ steps.versions.outputs.web_version_id }}@100%" --env staging --yes --message "Promote reviewed web ${GITHUB_SHA}"

      - name: Smoke exact promoted versions
        id: smoke
        run: >-
          node scripts/foundation/cloudflare-delivery-smoke.mjs
          --environment staging
          --release "$GITHUB_SHA"
          --api-url "${{ needs.delivery-gate.outputs.api_url }}"
          --web-url "${{ needs.delivery-gate.outputs.web_url }}"
          --attempts "${{ needs.delivery-gate.outputs.max_smoke_attempts }}"
          --timeout-seconds "${{ needs.delivery-gate.outputs.max_smoke_seconds }}"

      - name: Roll back exact staging Worker versions after promotion failure
        if: failure() && steps.promote.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @vocanova/api-worker exec wrangler rollback "${{ github.event.inputs.previous_api_version_id }}" --env staging --message "Rollback failed staging API ${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler rollback "${{ github.event.inputs.previous_web_version_id }}" --env staging --message "Rollback failed staging web ${GITHUB_SHA}"

      - name: Record delivery outcome
        if: always()
        run: |
          {
            echo "## Cloudflare staging delivery"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- API version: ${{ steps.versions.outputs.api_version_id }}"
            echo "- Web version: ${{ steps.versions.outputs.web_version_id }}"
            echo "- Migration: ${{ steps.migrate.outcome }}"
            echo "- Promotion: ${{ steps.promote.outcome }}"
            echo "- Smoke: ${{ steps.smoke.outcome }}"
            echo "- Hold: VOC-080-HOLD-00"
          } >> "$GITHUB_STEP_SUMMARY"

  cloudflare-production:
    name: cloudflare production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.delivery-gate.result == 'success' &&
      needs.delivery-gate.outputs.environment == 'production'
    needs: [required, delivery-gate]
    environment: cloudflare-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build exact API and web releases without credentials
        run: pnpm run build:packages && pnpm run build:worker-api && pnpm --filter @vocanova/web cloudflare:build

      - name: Apply ordered compatible production D1 migrations
        id: migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm --filter @vocanova/api-worker exec wrangler d1 migrations apply DB --remote --env production --experimental-provision=false --experimental-auto-create=false

      - name: Upload immutable production Worker versions
        id: versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tag="sha-${GITHUB_SHA}"
          pnpm --filter @vocanova/api-worker exec wrangler versions upload --env production --strict --experimental-provision=false --experimental-auto-create=false --tag "$tag" --message "VocaNova production API ${GITHUB_SHA}" --var "RELEASE:${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler versions upload --env production --strict --experimental-provision=false --experimental-auto-create=false --tag "$tag" --message "VocaNova production web ${GITHUB_SHA}"
          api_version_id="$(pnpm --filter @vocanova/api-worker exec wrangler versions list --env production --json | node scripts/foundation/cloudflare-delivery-policy.mjs --resolve-version-tag "$tag")"
          web_version_id="$(pnpm --filter @vocanova/web exec wrangler versions list --env production --json | node scripts/foundation/cloudflare-delivery-policy.mjs --resolve-version-tag "$tag")"
          echo "api_version_id=$api_version_id" >> "$GITHUB_OUTPUT"
          echo "web_version_id=$web_version_id" >> "$GITHUB_OUTPUT"

      - name: Promote exact production Worker versions
        id: promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @vocanova/api-worker exec wrangler versions deploy "${{ steps.versions.outputs.api_version_id }}@100%" --env production --yes --message "Promote reviewed API ${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler versions deploy "${{ steps.versions.outputs.web_version_id }}@100%" --env production --yes --message "Promote reviewed web ${GITHUB_SHA}"

      - name: Smoke exact promoted versions
        id: smoke
        run: >-
          node scripts/foundation/cloudflare-delivery-smoke.mjs
          --environment production
          --release "$GITHUB_SHA"
          --api-url "${{ needs.delivery-gate.outputs.api_url }}"
          --web-url "${{ needs.delivery-gate.outputs.web_url }}"
          --attempts "${{ needs.delivery-gate.outputs.max_smoke_attempts }}"
          --timeout-seconds "${{ needs.delivery-gate.outputs.max_smoke_seconds }}"

      - name: Roll back exact production Worker versions after promotion failure
        if: failure() && steps.promote.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @vocanova/api-worker exec wrangler rollback "${{ github.event.inputs.previous_api_version_id }}" --env production --message "Rollback failed production API ${GITHUB_SHA}"
          pnpm --filter @vocanova/web exec wrangler rollback "${{ github.event.inputs.previous_web_version_id }}" --env production --message "Rollback failed production web ${GITHUB_SHA}"

      - name: Record delivery outcome
        if: always()
        run: |
          {
            echo "## Cloudflare production delivery"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- API version: ${{ steps.versions.outputs.api_version_id }}"
            echo "- Web version: ${{ steps.versions.outputs.web_version_id }}"
            echo "- Migration: ${{ steps.migrate.outcome }}"
            echo "- Promotion: ${{ steps.promote.outcome }}"
            echo "- Smoke: ${{ steps.smoke.outcome }}"
            echo "- Hold: VOC-080-HOLD-01"
          } >> "$GITHUB_STEP_SUMMARY"
