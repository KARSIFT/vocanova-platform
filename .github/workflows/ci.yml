name: CI

# Deterministic repository validation. Commands remain in package scripts so the
# same validation can be run locally without reproducing CI-only logic.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-go: "true"

      - name: Validate foundation
        run: pnpm run ci:foundation

  packages:
    name: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate shared packages
        run: pnpm run ci:packages

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate web application
        run: pnpm run ci:web

  worker-api:
    name: worker api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Validate Worker API and local D1
        run: pnpm run ci:worker-api

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-dependencies: "false"
          install-go: "true"

      - name: Validate API reference implementation
        run: pnpm run ci:api

  required:
    name: ci required
    if: always()
    needs: [foundation, packages, web, worker-api, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out aggregate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every subsystem
        env:
          API_RESULT: ${{ needs.api.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WORKER_API_RESULT: ${{ needs.worker-api.result }}
        run: >-
          bash scripts/foundation/require-successful-jobs.sh
          "api=$API_RESULT"
          "foundation=$FOUNDATION_RESULT"
          "packages=$PACKAGES_RESULT"
          "web=$WEB_RESULT"
          "worker-api=$WORKER_API_RESULT"
