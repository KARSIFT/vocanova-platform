name: Governance

# Fail-closed repository structure and changed-path risk checks. Pull-request
# text is written to a data file and is never interpolated into shell source.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate governance structure
        run: bash scripts/governance/validate-governance.sh

      - name: Run governance unit tests
        run: python3 -m unittest discover -s tooling/governance/tests -p 'test_*.py' -v

      - name: Validate repository foundation
        run: python3 tooling/governance/validate_repository_foundation.py --repository-root .

      - name: Check governance shell syntax
        run: |
          bash -n scripts/governance/validate-governance.sh
          bash -n scripts/governance/classify-change-risk.sh

  risk:
    name: changed-path risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Record pull-request body as data
        run: jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"

      - name: Enforce path-based risk floor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/governance/classify-change-risk.sh
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --pr-body-file "$RUNNER_TEMP/pr-body.md"
          --require-declaration

  eligibility:
    name: merge eligibility
    if: github.event_name == 'pull_request'
    needs: [structure, risk]
    runs-on: ubuntu-24.04
    # The adapter may need to observe CI's full 30-minute validation contract.
    timeout-minutes: 35
    steps:
      - name: Check out reviewed revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Evaluate normalized merge evidence read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tooling/governance/merge-eligibility/github_adapter.py
          --repository-root .
          --event-path "$GITHUB_EVENT_PATH"
          --summary-path "$GITHUB_STEP_SUMMARY"
          --wait-seconds 1800
