name: diag-eval-live-gemini
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Run live Gemini evaluation
        working-directory: apps/api
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          go run ./cmd/eval-live \
            --provider gemini \
            --api-key "$GEMINI_API_KEY" \
            --cost-ceiling 0.25 \
            --notes "VOC-035-T03 live evaluation, dispatched via diagnostic workflow" \
            > /tmp/eval-live-report.txt 2>&1
          code=$?
          echo "=== report ==="
          cat /tmp/eval-live-report.txt
          echo "=== exit code: $code ==="
