name: Repository Governance

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2, verified from the official repository.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        # actions/setup-python v5.6.0, verified from the official repository.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run repository-foundation unit tests
        run: python3 -m unittest discover -s tooling/governance/tests -p 'test_*.py' -v
      - name: Validate repository foundation
        run: python3 tooling/governance/validate_repository_foundation.py --repository-root .
      - name: Check governance shell syntax
        run: |
          bash -n scripts/governance/validate-governance.sh
          bash -n scripts/governance/classify-change-risk.sh
      # Real enforcement of both scripts against the actual PR diff and body
      # already runs in governance-policy.yml (validate-governance.sh bare, plus
      # classify-change-risk.sh with --base/--head/--pr-body-file/--require-
      # declaration). Re-running validate-governance.sh here added nothing beyond
      # what that job already covers, and a bare classify-change-risk.sh call in
      # this job's clean-checkout context has no working-tree diff to classify -
      # it always reports "No changed files to classify," not a real check.
      # Removed 2026-08-14 to stop double-running the same governance check on
      # every PR; this job's own value (Python unit tests, the foundation
      # validator, and the shell-syntax check above) is unchanged.
