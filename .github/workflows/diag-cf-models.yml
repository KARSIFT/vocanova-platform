name: diag-cf-models
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List deepseek / json-schema-capable models and test latency
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== searching model catalog for deepseek ==="
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search?search=deepseek&per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[]?.name // empty'
          echo
          echo "=== timing candidates with response_format json_schema (real-ish prompt) ==="
          for m in "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b" "@cf/deepseek-ai/deepseek-r1-distill-qwen-1.5b" "@cf/deepseek-ai/deepseek-r1-distill-qwen-7b" "@cf/deepseek-ai/deepseek-v2.5" "@cf/meta/llama-3.3-70b-instruct-fp8-fast" "@cf/meta/llama-4-scout-17b-16e-instruct"; do
            echo "--- $m ---"
            start=$(date +%s.%N)
            curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
              -X POST --max-time 15 \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/${m}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "messages":[{"role":"system","content":"You are a strict grammar-review assistant."},{"role":"user","content":"Task data (JSON):\n{\"learner_sentence\":\"I go to school yesterday.\",\"target_word\":\"yesterday\",\"target_meaning\":\"the day before today\",\"learner_level\":\"beginner\",\"accepted_forms\":[\"yesterday\"]}"}],
                "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                    "type": "object",
                    "properties": {
                      "status": {"type": "string", "enum": ["correct", "needs_improvement", "incorrect"]},
                      "target_word_used_correctly": {"type": "boolean"},
                      "explanation": {"type": "string"}
                    },
                    "required": ["status", "target_word_used_correctly", "explanation"]
                  }
                }
              }' -o /tmp/resp.json
            end=$(date +%s.%N)
            echo "elapsed: $(echo "$end - $start" | bc)s"
            cat /tmp/resp.json | head -c 500
            echo
            echo
          done
