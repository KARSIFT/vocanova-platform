name: pipeline

# PR validation and merge. This file owns exactly the jobs that need to read
# each other's outputs via `needs:` (only possible within one workflow file):
# ci -> review/plan-review -> remediate -> merge-gate. Everything else that
# used to live here (plan/plan-from-issue/adopt/implement, release/
# auto-advance) has no `needs:` tie to this cluster and now lives in
# change-package.yml / package-release.yml instead - splitting those out
# shrinks the job graph GitHub shows on any single trigger (was 12 jobs on
# every pull_request event, most of them irrelevant/skipped; ci/review/
# merge-gate PRs now see only the 6 jobs that actually apply to them).
#
# `ci` is in-house (`pnpm validate`, see docs/development.md) - not a call
# into karsift-ai-infra. `review`/`plan-review`/`remediate`/`merge-gate` are
# karsift-ai-infra reusable workflows, pinned to an exact commit (not `@main`)
# so this file can't silently break when that repo's default branch moves -
# bump deliberately, verify pipeline.yml's next PR run is green, don't float.
#
# The orchestrator (`orchestrator/RUNBOOK.md`, `.claude/agents/`, see
# CONTRIBUTING.md's "Automated orchestrator PRs" section and
# docs/decisions/ADR-0001-agent-orchestration-architecture.md) is an
# additional path alongside this file, not a replacement: a live orchestrator
# session can implement and independently review a task directly. `merge-gate`
# doesn't care which one produced the verdict - it reads any PR comment
# starting "**Independent verification" with a `VERDICT:` line. An
# orchestrator-originated PR that qualifies under DOC-16's "Branch and merge
# behavior" section may also merge directly without waiting on this file at
# all, falling back to the path here otherwise.
#
# PRIVATE REPO + GitHub Free org plan: org-level secrets (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, etc.) silently do NOT reach private repos on a Free org
# plan, even when the secret's visibility is "All repositories" - jobs see an
# empty value with no error at workflow-definition time, only a runtime
# "Secret X is required, but not provided" failure. If secrets aren't
# reaching this repo, set them again at the repo level too
# (`gh secret set ANTHROPIC_API_KEY --repo OWNER/REPO`).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Floor for the reusable-workflow jobs below (review/plan-review/remediate/
# merge-gate), all called via `uses:` with `secrets: inherit` and no
# job-level `permissions:` of their own - a reusable workflow call can never
# get MORE access than its caller has. `ci` narrows this back down to
# `contents: read` for itself below, since it only checks out and runs local
# commands.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  # In-house deterministic checks: `pnpm validate` (workspace, format,
  # lint/vet, type, test, build - see docs/development.md's "Root commands"
  # table). Mirrors the actions/checkout + actions/setup-node +
  # actions/setup-go + corepack pattern already used by
  # accessibility.yml/lighthouse.yml/deploy-staging.yml in this repo.
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2, pinned to the immutable commit documented at
      # https://github.com/actions/checkout/releases/tag/v4.2.2
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v7.0.0, pinned to the immutable commit documented
      # at https://github.com/actions/setup-node/releases/tag/v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"

      # actions/setup-go v7.0.0, pinned to the immutable commit documented at
      # https://github.com/actions/setup-go/releases/tag/v7.0.0. Needed here
      # (unlike lighthouse.yml/accessibility.yml) because pnpm validate's
      # lint:api/test:api/build:api steps shell out to go vet/go test/go build.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "apps/api/go.mod"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.14.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

  # Parses "Package path: `...`" from the PR body for `review`/`remediate`
  # below. Only implementation PRs (head branch prefixed "agent/" by
  # implement.yml, or by an orchestrator session) carry that line - planning
  # PRs (`plan/`) get their own path resolution inside plan-review.yml
  # instead, so this job is scoped to `agent/` only.
  extract-package-path:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    outputs:
      package_path: ${{ steps.extract.outputs.package_path }}
    steps:
      # PR_BODY goes through env:, never ${{ }}-interpolated directly into
      # the script: a PR body is attacker-controlled text, and splicing it
      # raw into a bash source before bash parses it is a script-injection
      # vector (a body containing a backtick is enough).
      - name: Parse package path from PR body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          path=$(echo "$PR_BODY" | grep -oP '(?<=Package path: `)[^`]+')
          if [ -z "$path" ]; then
            echo "No 'Package path: \`...\`' line found in the PR body - review cannot run without it." >&2
            exit 1
          fi
          echo "package_path=$path" >> "$GITHUB_OUTPUT"

  # Independent review for an implementation PR (head branch prefixed
  # "agent/"). Mutually exclusive with `plan-review` below (never both - the
  # two jobs' `if` conditions are on opposite head_ref prefixes).
  review:
    needs: [ci, extract-package-path]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/review.yml@9dd5185954175f12601cce10be3f84ac158f44c4
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop"
    secrets: inherit

  # Independent review for a DRAFT change-package proposal (head branch
  # prefixed "plan/", opened by plan.yml / change-package.yml). Posts the
  # same "**Independent verification - bound to commit ...**" / "VERDICT:
  # ..." comment shape as `review` above, so merge-gate's verdict-parsing
  # picks it up either way. `needs: ci` only (not extract-package-path): a
  # plan PR has no "Package path:" line - plan-review.yml resolves the
  # package path itself from the PR body's "New package directory: `...`"
  # line instead.
  plan-review:
    needs: ci
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'plan/')
    uses: KARSIFT/karsift-ai-infra/.github/workflows/plan-review.yml@9dd5185954175f12601cce10be3f84ac158f44c4
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  # No-op unless ci failed outright or the review verdict is FAIL - then
  # either re-dispatches change-package.yml's `implement` job once (via
  # workflow_dispatch, with failure details attached) or, if that retry
  # already happened, escalates to the authority issue instead of a third
  # attempt. See remediate.yml for the exact rule.
  #
  # `needs: [ci, review, ...]` + `always()`: review.yml never runs at all
  # when ci fails (its own `needs: [ci, ...]` has no always() guard), so
  # without depending on ci directly and forcing this job to run regardless,
  # a plain CI failure (no reviewer verdict ever produced) would leave a PR
  # permanently stuck with no automatic retry.
  remediate:
    needs: [ci, review, extract-package-path]
    if: |
      always() &&
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/') &&
      needs.extract-package-path.result == 'success' &&
      needs.ci.result != 'skipped' && needs.ci.result != 'cancelled'
    uses: KARSIFT/karsift-ai-infra/.github/workflows/remediate.yml@9dd5185954175f12601cce10be3f84ac158f44c4
    with:
      pr_number: ${{ github.event.pull_request.number }}
      package_path: ${{ needs.extract-package-path.outputs.package_path }}
      integration_branch: "develop"
      ci_failed: ${{ needs.ci.result == 'failure' }}
      review_job_failed: ${{ needs.review.result == 'failure' }}
    secrets: inherit

  # `needs: [review, plan-review]` + `always()`: on a plain `pull_request`
  # event this job must not evaluate in parallel with (rather than after)
  # review/plan-review, or merge-gate's report-status can capture a stale
  # PENDING verdict before either one has posted anything (no further
  # `pull_request` event fires unless something pushes a new commit).
  # `always()` is required because a job depending on a *skipped* job is by
  # default also skipped - and exactly one of review/plan-review runs per
  # event (agent/ vs plan/ head_ref) while the other is always skipped, and
  # both are skipped entirely on `issue_comment` events (the human-"approved"
  # merge path) - all of that must still reach merge-gate so its status
  # comment actually posts, rather than requiring either job's specific
  # 'success' result.
  merge-gate:
    needs: [review, plan-review]
    if: |
      always() &&
      (
        github.event_name == 'issue_comment' ||
        (github.event_name == 'pull_request' && (needs.review.result == 'success' || needs.review.result == 'skipped') && (needs.plan-review.result == 'success' || needs.plan-review.result == 'skipped'))
      )
    uses: KARSIFT/karsift-ai-infra/.github/workflows/merge-gate.yml@9dd5185954175f12601cce10be3f84ac158f44c4
    with:
      founder_username: "m-e-h-r-d-a-a-d"   # deprecated compatibility input - founder comments are not merge authority, see merge-gate.yml's own header
      auto_merge_enabled: "true"      # proven live on this repo (VOC-012, VOC-014) for this project's loop
    secrets: inherit
