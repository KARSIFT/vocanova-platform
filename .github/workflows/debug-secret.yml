name: debug-secret
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APP_ID: ${{ secrets.KARSIFT_BOT_APP_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN length: ${#TOKEN}"
          echo "KARSIFT_BOT_APP_ID value: $APP_ID"
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC}"
