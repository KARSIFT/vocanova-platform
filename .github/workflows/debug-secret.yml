name: debug-secret
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "SECRET IS PRESENT (length: ${#TOKEN})"
          else
            echo "SECRET IS EMPTY/MISSING"
          fi
