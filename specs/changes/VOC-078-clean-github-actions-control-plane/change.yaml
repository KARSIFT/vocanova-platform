schema_version: 1
id: VOC-078
slug: clean-github-actions-control-plane
title: Clean GitHub Actions control plane and pause server-bound automation
type: governance-and-ci-reconstruction
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 by semantic consequence. The implementation changes .github/workflows, governance
  enforcement, agent authority, automatic merge/release behavior, and the production
  deployment trigger. Path classification alone yields at least R3, but retiring the active
  release/deployment authority model is a consequential governance decision requiring R4.
canonical_path: specs/changes/VOC-078-clean-github-actions-control-plane
authority_model: a003-active
requirement_source: >-
  GitHub issue #69 plus the founder's 2026-08-19 clarification that the server may change,
  deployment/server-health automation should not be reconstructed now, and GitHub Actions
  should become clean and understandable. The clarification remains planning input until
  this package is adopted.
requirement_approval_status: not-approved
base_branch: develop
base_sha: bca98d6692424b58ca627d3207f30f9bcac03953
target_branch: develop
approved_candidate_sha: null
owners:
  decision: founder
  package_preparation: Codex (drafting only)
  implementation: unassigned
  independent_verification: unassigned
approval_status: not-approved
implementation_authorized: false
automatic_merge_allowed: false
production_impact: >-
  Existing production runtime remains untouched, but repository-driven automatic release,
  production deployment, staging deployment, and scheduled error-to-issue automation are
  suspended. No new server is configured and no live environment is mutated by this package.
rollback_required: true
artifacts:
  readme: README.md
  specification: specification.md
  acceptance_criteria: acceptance-criteria.md
  impact_analysis: impact-analysis.md
  implementation_plan: implementation-plan.md
  tasks: tasks.md
  test_plan: test-plan.md
  release_plan: release-plan.md
dependencies:
  - id: VOC-078-DEP-00
    status: >-
      Founder adoption must explicitly accept the temporary loss of repository-driven
      staging/production deployment and automatic production release. Runtime services are
      not stopped; only future workflow-triggered changes are paused.
  - id: VOC-078-DEP-01
    status: >-
      GitHub Free private-repository branch protection and rulesets are unavailable. The
      package must not claim that required checks or human review are technically enforced
      when the hosting plan cannot provide that enforcement.
  - id: VOC-078-DEP-02
    status: >-
      A future server/deployment package is required before automated deployment returns.
      It must be based on the selected hosting architecture rather than copying current SSH,
      Docker Compose, Cloudflare, or health-probe assumptions.
