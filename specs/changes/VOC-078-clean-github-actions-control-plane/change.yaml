dependencies:
  - id: VOC-078-DEP-00
    status: >-
      Resolved by founder approval of exact package revision
      fc7f1e82cc06a21278605e52741738d6fdb45fca and adoption through PR #71. The
      temporary loss of repository-driven staging/production deployment and automatic
      production release is accepted. Runtime services are not stopped; only future
      workflow-triggered changes are paused.
  - id: VOC-078-DEP-01
    status: >-
      Accepted constraint. GitHub Free private-repository branch protection and rulesets
      are unavailable. Implementation must not claim that required checks or human review
      are technically enforced when the hosting plan cannot provide that enforcement.
  - id: VOC-078-DEP-02
    status: >-
      Accepted deferral. A future server/deployment package is required before automated
      deployment returns. It must be based on the selected hosting architecture rather than
      copying current SSH, Docker Compose, Cloudflare, or health-probe assumptions.
