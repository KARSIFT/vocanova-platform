dependencies:
  - id: VOC-084-DEP-00
    status: satisfied-exact-candidate-review-and-adoption-decision
    description: >-
      A different-role reviewer must verify the complete plan candidate and the evidence
      sources before adoption. The package cannot approve its own reconciliation rules.
  - id: VOC-084-DEP-01
    status: implementation-precondition
    description: >-
      Each completed task and criterion may be marked complete only from an exact merged
      head, merge commit, independent verdict, hosted result, rollback record, and relevant
      post-merge result already present in the canonical GitHub or repository evidence.
  - id: VOC-084-DEP-02
    status: accepted-boundary
    description: >-
      Current GitHub issue https://github.com/KARSIFT/vocanova-platform/issues/119,
      created 2026-08-23 with no pull_request field, owns public-repository
      settings/documentation drift. VOC-084 must not change repository settings or
      absorb that unrelated scope. Historical commit-message references carrying the
      same number do not supersede the canonical current API object.
  - id: VOC-084-DEP-03
    status: implementation-precondition
    description: >-
      The T00 inventory must enumerate every committed file in each VOC-080 through
      VOC-083 package directory and classify it exactly once as active-claim,
      historical, or prospective. Validation must fail on omissions, duplicate or
      invalid classifications, and classification/content contradictions.
  - id: VOC-084-DEP-04
    status: accepted-evidence-source
    description: >-
      Current GitHub API issue objects define the identities of issues #118 and #119.
      Number-like references in historical imported or reconstructed commit subjects
      do not supersede those canonical current objects.

