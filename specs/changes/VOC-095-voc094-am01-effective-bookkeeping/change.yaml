requirements:
  - id: VOC-095-D00
    statement: >-
      Use one task and one minimum-sufficient repository-only implementation PR into
      develop. Do not edit VOC-094 or any living document in this plan PR; the later
      implementation PR must edit only the enumerated reconciliation surfaces.
  - id: VOC-095-D01
    statement: >-
      Preserve VOC-094's original approved candidate/adoption and AM-01 approved
      candidate, all historic PASS/FAIL reviews, ACT-00 inventory and credential
      closure, and the ACT-01 sequencing/D1 evidence as immutable historical facts.
  - id: VOC-095-D02
    statement: >-
      In the later implementation PR, update VOC-094 change.yaml's AM-01
      adoption_bookkeeping_gate with the exact bookkeeping SHA, final independent
      review, genuine eligible=true/reasons=[], normal non-author merge SHA, and all
      three successful post-merge run binders. Set only the AM-01 effectiveness and
      implementation bookkeeping fields that those facts establish to effective.
  - id: VOC-095-D03
    statement: >-
      Reconcile VOC-094 README, tasks, specification, acceptance, impact,
      implementation, test, and release documents so they no longer claim that
      AM-01's exact review, eligibility, PR-160 merge, or post-merge checks are
      pending. Keep implementation execution, ACT-02, ACT-03, ACT-04, and ACT-05
      separately held until their own exact action records pass.
  - id: VOC-095-D04
    statement: >-
      Audit all other living repository claims for this VOC-094 AM-01 state. Change
      only a direct stale contradiction, record the audit and justified exclusions in
      the implementation PR, and do not broaden the package into a general document
      refresh.
  - id: VOC-095-D05
    statement: >-
      The correction itself grants no Cloudflare, DNS, GitHub settings/environment,
      secret, deployment, migration, traffic, spending, production-data, production,
      public-launch, or main-promotion authority. ACT-02 remains held pending the
      corrected merged SHA, fresh exact overlay/resource review, current Free/$0
      evidence, and a fresh exact ACT-02 action-authority record.
  - id: VOC-095-D06
    statement: >-
      Record the ACT-01 sequencing incident and staging D1 UUID as preserved
      non-secret evidence only. Do not delete, migrate, query, attach, or otherwise
      mutate that D1 under this package; do not claim that ACT-01 evidence makes
      ACT-02 eligible.
  - id: VOC-095-D07
    statement: >-
      Run governance validation, risk classification, git diff --check, applicable
      hosted checks, and exact-revision independent R4 verification. The later
      implementation PR must use one current-head merge-eligibility binder, and its
      implementation authority becomes effective only after that PR's own exact
      review, genuine eligible result, normal non-author merge, and post-merge checks.
  - id: VOC-095-D08
    statement: >-
      automatic_merge_allowed remains true as read-only package metadata. It is not a
      merge executor, approval, authority grant, or bypass for exact review,
      eligibility, action-specific authority, or external holds.

