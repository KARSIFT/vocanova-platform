rollback:
  trigger: >-
    required checks fail to report, native settings do not match policy, ordinary
    PRs cannot merge safely, protected controls are lost, or active history is
    incomplete
  mechanism: >-
    Before settings action A, revert PR1/PR2. After action A, restore its captured
    merge-compatible settings snapshot and protected refs. After final action B,
    restore phase A, recreate develop at the recorded SHA, and revert the failing
    cleanup through the protected branch. Never delete protected transition/rollback
    refs until PR5 exact old-authority acceptance completes.
  owner: founder-repository-owner

