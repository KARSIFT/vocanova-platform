rollback:
  trigger: >-
    required checks fail to report, native settings do not match policy, ordinary
    PRs cannot merge safely, protected controls are lost, or active history is
    incomplete
  mechanism: >-
    Before activation, revert PR1. After activation, restore the captured settings
    snapshot and rollback ref, re-enable the dual-compatible workflow, and revert
    the failing cleanup revision through protected main. Never delete the rollback
    ref until post-cutover verification completes.
  owner: founder-repository-owner

