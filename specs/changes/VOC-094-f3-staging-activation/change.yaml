action_specific_holds:
  - id: VOC-094-ACT-00
    action: phase1-read-only-account-zone-inventory-and-residual-scope-decision
    status: held
    accountable_role: cloudflare-account-owner-or-explicitly-delegated-phase1-operator
    required_evidence: >-
      Exact selected account ID and zone ID/name, vocanova.site Active readback, Workers
      Free and zero-paid-spend readback, complete Workers/D1/Custom-Domain inventory,
      a distinct secure local/interactive read-only credential/session with no write
      permission and no value disclosure, permission-group readback, and either no
      production Workers/D1 in that account or explicit operator acceptance of the
      residual account-wide Workers Scripts/D1 scope. Revoke/expire the read-only
      credential after the decision and before any Phase1 write token is issued.
    completion_or_expiry: expires on account, zone, inventory, plan, permission, billing, read-only credential, or scope drift and before Phase1 write-token issuance
  - id: VOC-094-ACT-01
    action: phase1-provision-staging-D1-and-authorize-exact-Worker-and-Custom-Domain-resource-set
    status: held-by-VOC-080-HOLD-00
    accountable_role: explicitly-authorized-cloudflare-staging-resource-operator
    required_evidence: >-
      Adopted exact resource manifest, clean exact reviewed repository SHA, final
      pre-action review, successful applicable hosted CI/Governance/Quality/Security
      and local validation/dry-run evidence bound to that SHA, strict USD 0 ceiling,
      ACT-00 pass, no collision, D1 eeur location-hint request with no jurisdiction,
      real D1 UUID/readback, exact reviewed Worker/domain resource set, a separately
      issued short-lived Phase1 write token, and bounded partial-failure cleanup authority.
    completion_or_expiry: one Phase1 provisioning window; expires on revision, manifest, dependency/lock/workflow, local-or-hosted-check result, resource, hostname, D1 schema, account, zone, plan, credential, cost, or authority drift
  - id: VOC-094-ACT-02
    action: phase1-bootstrap-real-last-known-good-staging-baseline-and-rehearse-Worker-rollback
    status: held-by-VOC-080-HOLD-00
    accountable_role: explicitly-authorized-cloudflare-staging-baseline-operator
    required_evidence: >-
      Separate exact action record; clean exact reviewed repository SHA; hashed,
      sanitized, untracked route-free overlay containing only reviewed non-secret
      bindings/vars and secure write auth outside it; credential-free local/schema/
      dry-run checks and exact overlay/resource-manifest review; ordered migrations; locked
      Wrangler 4.125.0 first-creation exception using route-free wrangler deploy for API
      then web/service binding; real baseline UUID readbacks; separately hashed/reviewed
      route-bearing overlay applied only afterward with wrangler triggers deploy for
      exact Custom Domains and ownership/cert/DNS readback; smoke; and, if claimed,
      versions upload/deploy of a newer probe only after scripts exist, followed by
      Worker rollback to baseline and unchanged-D1 proof. Delete overlays only after
      evidence capture and revoke/expire the Phase1 write token; repository sentinels
      remain unchanged.
    completion_or_expiry: one Phase1 baseline window; expires on revision, manifest, either overlay hash, dependency/lock/workflow, local-or-hosted-check result, binding, migration, domain, resource, version, smoke, credential, or authority drift
  - id: VOC-094-ACT-03
    action: phase4-create-cloudflare-staging-GitHub-environment-and-enter-two-secrets
    status: held-by-VOC-085-HOLD-00
    accountable_role: explicitly-authorized-GitHub-settings-and-secret-operator
    required_evidence: >-
      Exact scoped VOC-085-HOLD-00 authority naming the settings operator, merged
      develop SHA, GitHub environment pre-state, exact environment/secret-name payload,
      rollback payload, immediate living-document reconciliation already present in
      the merged implementation, cloudflare-staging post-state readback, exactly
      CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secret names with no values
      disclosed, a third distinct short-lived Phase4 token, no variables or production
      mutation, and exact authority expiry/drift conditions.
    completion_or_expiry: discharges VOC-085-HOLD-00 only for this one post-merge Phase4 environment-and-two-secret settings action; expires on payload, environment, secret-name, merged revision, credential, authority, or pre/post-state drift; VOC-085-HOLD-00 remains held for every other settings action
  - id: VOC-094-ACT-04
    action: dispatch-one-ordinary-staging-delivery-and-bounded-soak
    status: held-by-VOC-080-HOLD-00
    accountable_role: explicitly-authorized-non-Ruflo-workflow-dispatch-operator
    required_evidence: >-
      Exact reviewed develop SHA, matching manifest/action URLs and expiry, zero-cent
      estimate, real last-known-good UUIDs, exact confirmation, successful migration,
      immutable uploads, exact 100 percent promotions, smoke, readback, soak, and outcome.
    completion_or_expiry: one staging workflow_dispatch; expires on SHA, manifest, authority, cost, baseline, secret, resource, route, migration, smoke, or time-window drift
  - id: VOC-094-ACT-05
    action: phase4-revoke-token-and-clean-only-explicit-disposable-or-failed-staging-state
    status: held
    accountable_role: operator-named-in-the-exact-cleanup-record
    required_evidence: >-
      Exact created-resource IDs, success-or-failure state, ordered cleanup payload,
      Distinct Phase4 token revocation/expiry, disposable Ruflo paths, preservation
      list, and pre/post readbacks. ACT-00 read-only credential cleanup and ACT-02
      Phase1 write-token/overlay cleanup evidence are not reissued or reused.
    completion_or_expiry: cleanup is limited to the named Phase4 token, disposable Ruflo state, or resources created in the failed action; no successful staging resource is deleted without new authority

