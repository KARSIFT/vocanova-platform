production_impact: prohibited
rollback_required: true
implementation_pull_request_count: 2
multiple_pull_request_rationale: >-
  Two implementation PRs are required by the hard external-settings/truth boundary:
  PR1 must merge while cloudflare-staging is still absent, held, and planned, and
  ACT-03 cannot mutate settings before PR1. After ACT-03, PR2 immediately reconciles
  the observed sanitized settings record before dispatch. The partial states are
  explicit: PR1 makes repository delivery ready but ineligible; ACT-03 creates only
  the environment/two secrets while dispatch stays held; PR2 makes living truth match
  the readback and its reviewed merge SHA becomes dispatchable. Rollback of repository
  changes never silently rolls back settings, and ACT-03 rollback requires a truthful
  PR2/correction. This boundary adds an extra branch/PR, hosted and local checks,
  exact reviews, merge/source-head evidence, elapsed time, coordination, context, and
  bookkeeping; that overhead is necessary because preclaiming post-state is forbidden
  and the settings action cannot precede PR1.

