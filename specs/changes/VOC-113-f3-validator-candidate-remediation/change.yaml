id: VOC-113
slug: f3-validator-candidate-remediation
title: Close F3 validator and candidate-identity gaps
type: milestone-evidence-validator-and-candidate-remediation
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 because the corrected validator and evidence binder protect the exact current F3
  milestone decision and later dependency ordering. A false negative blocks an
  adopted outcome; a false positive can present prohibited disclosure, live authority,
  or a later milestone as current truth. The implementation remains repository-only.
canonical_path: specs/changes/VOC-113-f3-validator-candidate-remediation
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/211
related_pull_request: https://github.com/KARSIFT/vocanova-platform/pull/209
related_adopted_packages:
  - VOC-105
  - VOC-110
  - VOC-111
base_branch: develop
base_sha: 533084432f0672dbf25c402e96209120a8ad50cf
plan_branch: plan/voc-113-f3-validator-candidate-remediation
target_branch: develop
approved_candidate_sha: pending-independent-exact-revision-review-and-adoption
approval_status: pending-independent-exact-revision-review-and-adoption
implementation_authorized: false
implementation_authority_status: >-
  prohibited-until-exact-plan-specialist-and-independent-R4-reviews-accountable-
  adoption-complete-bookkeeping-and-normal-non-author-plan-merge; issue-211-and-PR-209-
  grant-no-authority
implementation_pull_request_count: 1
implementation_pull_request: https://github.com/KARSIFT/vocanova-platform/pull/209
multiple_pull_request_rationale: >-
  One corrected revision of the existing draft VOC-105 PR is the minimum coherent
  implementation boundary. The validator and test files are new in that PR and do not
  exist on develop, so a separate correction PR would duplicate the full VOC-105 diff
  or create an intermediate-branch merge that separates code, evidence, exact identity,
  review, and rollback. Amendment after adoption keeps the complete milestone outcome
  in one reviewable and reversible PR.
automatic_merge_allowed: true
production_impact: prohibited-and-held
rollback_required: true

objective: >-
  Replace the drifted VOC-105 candidate identity through an explicit governed refresh,
  make its network-free validator enforce the adopted fail-closed contract on every
  designated current-truth file, complete the negative matrix, and obtain fresh exact-
  revision evidence before PR #209 can merge.

requirements:
  - id: VOC-113-D00
    statement: >-
      Treat issue #211, reviewed PR #209 head 841d263c6a4fd92f0f553e0d1f2fd75bd13b1a1a,
      its canonical digest 903e7f80bf0f9f955fe30b8dbd91ec186d979c65c37a9d46de3e0a55ff09b7b6,
      and both blocking reviewer findings as intake only. Preserve VOC-111's former
      7205f4856b2839f7302ab9a9fd9fbac57ee69942723f283241ac2970bb147e43
      observation as historical evidence; do not relabel either digest.
  - id: VOC-113-D01
    statement: >-
      After adoption, amend draft PR #209 in place by changing exactly the existing
      VOC-105 validator and focused test. Once content is stable, bind the replacement
      exact PR head and its 12 blob OIDs to the unchanged lexicographically sorted
      VOC-111 path-NUL-blob-OID-without-LF-NUL SHA-256 algorithm. Record the replacement
      digest immediately before and after all bounded observation commands; any change
      stops merge and requires a new governed candidate/review cycle.
  - id: VOC-113-D02
    statement: >-
      Define the designated current-truth corpus as the nine VOC-105 document/evidence
      files listed in candidate_observation.designated_surfaces. Apply every cross-
      cutting disclosure, vocabulary, live-action, later-boundary, and history/current
      rule independently to every file, with a path-specific diagnostic.
  - id: VOC-113-D03
    statement: >-
      Reject credential/token/secret values, immutable Worker-version UUIDs, and any
      credential-like uppercase name outside the exact allowed vocabulary
      CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN on every designated surface.
      Names may be cited only without values; tests use inert synthetic placeholders.
  - id: VOC-113-D04
    statement: >-
      Reject direct instructions to dispatch, deploy, migrate, promote, rotate/install
      credentials, mutate settings/resources/traffic/DNS, or launch; reject positive or
      authorized claims for A1/P1+, later milestones, product acceptance, production
      readiness/traffic/deployment, live activation/service, public launch, and learner-
      data access on every designated surface. Exact held/unresolved and historical
      descriptions remain allowed.
  - id: VOC-113-D05
    statement: >-
      Reject VOC-094 through VOC-104 prospective pending/held language when presented
      as current truth. Allow it only as explicitly historical/immutable context that
      also preserves later-evidence supersession and the current VOC-105 boundary.
  - id: VOC-113-D06
    statement: >-
      Enforce exact own-key sets, types, values, identifiers, URLs, arrays, gate-item
      inventory, delivery-event fields, every required job and step status, production
      held status, rollback baseline/rehearsal evidence, and skipped-expected rollback
      outcome. Reject every missing, extra, renamed, duplicate, wrong-type, failed,
      skipped, unknown, or otherwise noncanonical mutation with a specific diagnostic.
  - id: VOC-113-D07
    statement: >-
      Complete one-at-a-time positives and negatives for every rule/surface/status,
      retain all 26 existing focused cases unchanged in effect, prove fixture setup
      changes exactly the intended file/field, run focused/full/hosted validation, and
      rehearse full PR #209 rollback to base 533084432f0672dbf25c402e96209120a8ad50cf.
  - id: VOC-113-D08
    statement: >-
      Require fresh exact-head canonical-documentation/milestone-evidence specialist
      and independent cross-model R4 PASS reviews after the correction, zero blockers,
      truthful PR evidence, hosted required checks, and a separate non-author merge.
      Prior PR #209 findings/reviews cannot approve the replacement SHA.
  - id: VOC-113-D09
    statement: >-
      Perform no application, runtime, workflow, package-script, historical-package,
      infrastructure, setting, secret, Cloudflare, dispatch/deployment, D1, traffic/DNS,
      production/data, spending, launch, main-promotion, or issue-closure action.

