schema_version: 1

id: VOC-111
slug: transition-stable-f2-tests
title: Make F2 policy tests stable across the VOC-105 profile transition
type: foundation-policy-test-defect-remediation
status: draft
risk: R3
planned_implementation_risk_floor: >-
  R3 because the sole changed file is the focused verifier for a fail-closed
  foundation policy protecting immutable F2 evidence, current milestone profiles, and
  the VOC-109 command chain. Runtime policy and external state do not change, so the
  protected verification consequence does not rise to R4.
canonical_path: specs/changes/VOC-111-transition-stable-f2-tests
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/206
related_adopted_packages:
  - VOC-105
  - VOC-110
  - VOC-109
base_branch: develop
base_sha: c94444bc74d3ed1b5ca0aca65141d0532f70fa11
plan_branch: plan/voc-111-transition-stable-f2-tests
target_branch: develop
approval_status: not-approved
implementation_authorized: false
implementation_authority_status: >-
  not-authorized-until-this-exact-package-receives-distinct-foundation-policy-test-
  specialist-review-independent-cross-model-R3-review-accountable-adoption-and-
  normal-non-author-plan-merge; issue-206-and-adopted-VOC-105-or-VOC-110-do-not-
  authorize-the-test-edit
implementation_pull_request_count: 1
multiple_pull_request_rationale: >-
  One test-file correction is the minimum coherent boundary: live-profile selection,
  duplicate-key construction, explicit pre-profile fixtures, transition positives,
  hybrid negatives, and regression proof must land and roll back together. Splitting
  would add branch, coordination, elapsed-time, repeated-check, exact-review, and
  bookkeeping overhead without an independently releasable or rollback-safe state.
automatic_merge_allowed: true
production_impact: none-repository-only
rollback_required: true

objective: >-
  Make the VOC-081 focused verifier pass and preserve its full fail-closed evidence
  contract regardless of whether repositoryRoot is the exact pre-VOC-105 profile or
  the exact adopted VOC-105 profile.

requirements:
  - id: VOC-111-D00
    statement: >-
      Treat issue #206 and preserved-candidate results as intake/reproduction evidence
      only. Bind exact base c94444bc74d3ed1b5ca0aca65141d0532f70fa11,
      reviewed VOC-110 implementation 66928cb432ace3440990514526cc3afc6262d3de,
      canonical current candidate manifest digest
      7205f4856b2839f7302ab9a9fd9fbac57ee69942723f283241ac2970bb147e43 under
      VOC-111-CANDIDATE-MANIFEST-00, passing runtime validators, and focused 24/27 /
      ci:foundation 179/182 results with exactly the same three failures. Record
      8efd149c... only as the superseded pre-format historical fingerprint. No
      implementation starts before reviewed adoption and plan merge.
  - id: VOC-111-D01
    statement: >-
      Determine repositoryRoot's current profile from the complete exact
      milestone_state object using plan-owned pre-voc105 and voc105 values, exact key
      sets/types, object-order-insensitive comparison, and array-order-sensitive
      comparison. Do not infer the profile from one field or default it.
  - id: VOC-111-D02
    statement: >-
      Make raw duplicate-key negatives profile-independent. Locate the selected key's
      unique raw member using the exact parsed active-profile value and JSON
      serialization, assert fixture construction changed exactly one member, and prove
      f3_staging duplicates fail in both exact profiles plus f3_current_evidence in the
      voc105 profile. Do not search for a fixed unresolved-held literal.
  - id: VOC-111-D03
    statement: >-
      Define explicit plan-owned preserved pre-profile surface fixture strings for all
      five human F2-owned surfaces. Construct both complete synthetic profiles and
      both-direction one-surface repository hybrids only from committed test literals,
      exact plan-owned milestone objects, and stable fixture support markers; never
      from mutable repositoryRoot, another branch/PR, or the dirty VOC-105 worktree.
  - id: VOC-111-D04
    statement: >-
      Retain every VOC-110 positive and negative unchanged in effect: both atomic
      profiles and object reorder positives; immutable F2/history/external-effect
      checks; all profile key/value/type/pointer and marker mutations; exact history
      isolation/normalization; every legacy/new false-claim cross; raw duplicate
      rejection; no-execution evidence; missing surfaces; and both hybrid directions.
  - id: VOC-111-D05
    statement: >-
      Retain every VOC-109 command-chain positive and negative unchanged in effect,
      including zero/one/two extensions, exact VOC-105 pair, eight-command prefix,
      terminal test, F2 direct execution, extension grammar/declaration/order/
      collision/entry-point checks, malformed input, shell controls, and sentinel.
  - id: VOC-111-D06
    statement: >-
      Implement one repository-only PR changing exactly
      scripts/foundation/voc081-f2-evidence-policy.test.mjs. Do not edit the runtime
      validator, package.json, docs/evidence, packages, workflows, applications,
      settings/secrets, resources, dispatch/deployment, D1, traffic/DNS, production or
      learner data, spending, or launch state.
  - id: VOC-111-D07
    statement: >-
      Require focused, foundation, workspace, governance, risk, path, whitespace, and
      rollback evidence, exact-SHA foundation-policy-test/CI-integrity specialist
      review, and separate independent cross-model R3 verification by distinct
      non-authors. Resolve every blocker on a new SHA; require a separate merge actor.
  - id: VOC-111-D08
    statement: >-
      The accountable owner recorded at adoption observes the first refreshed real
      VOC-105 candidate from VOC-111 implementation merge until both runtime
      validators, the VOC-081 focused suite, ci:foundation, and hosted required checks
      pass, or until a governed VOC-105 abandonment/supersession. Execute the exact
      TEST-00 canonical manifest command before and after reproduction and again before
      and after observation. Any identity drift, recurrence, false/hybrid acceptance,
      or VOC-110/VOC-109 regression stops VOC-105 merge and VOC-111 closure and routes
      linked remediation or repository revert.

candidate_manifest:
  id: VOC-111-CANDIDATE-MANIFEST-00
  base_sha: c94444bc74d3ed1b5ca0aca65141d0532f70fa11
  ordered_paths:
    - docs/README.md
    - docs/operations/README.md
    - docs/operations/cloudflare-delivery.md
    - docs/operations/voc-081-f2-evidence.json
    - docs/operations/voc-081-f2-evidence.md
    - docs/operations/voc-105-f3-evidence.json
    - docs/operations/voc-105-f3-evidence.md
    - docs/product/12-mvp-implementation-plan.md
    - docs/product/README.md
    - package.json
    - scripts/foundation/voc105-f3-evidence-policy.mjs
    - scripts/foundation/voc105-f3-evidence-policy.test.mjs
  algorithm: >-
    for-each-fixed-lexicographically-sorted-path-emit-raw-UTF-8-path-bytes-NUL-git-
    blob-OID-without-LF-NUL-then-SHA-256-the-concatenated-12-entry-stream
  command: |-
    for f in docs/README.md docs/operations/README.md docs/operations/cloudflare-delivery.md docs/operations/voc-081-f2-evidence.json docs/operations/voc-081-f2-evidence.md docs/operations/voc-105-f3-evidence.json docs/operations/voc-105-f3-evidence.md docs/product/12-mvp-implementation-plan.md docs/product/README.md package.json scripts/foundation/voc105-f3-evidence-policy.mjs scripts/foundation/voc105-f3-evidence-policy.test.mjs; do
      test -f "$f" || exit 1
      printf '%s\0' "$f"
      git hash-object "$f" | tr -d '\n'
      printf '\0'
    done | sha256sum
  expected_digest: 7205f4856b2839f7302ab9a9fd9fbac57ee69942723f283241ac2970bb147e43
  superseded_historical_pre_format_fingerprint: 8efd149cce12cbd8b20fd07c8c942faacdc028f9b316a2cdedd15768f9a28da1
  execution: >-
    TEST-00-and-EV-00-before-and-after-reproduction-and-reexecuted-by-TEST-06-before-
    and-after-observation-with-EV-06-linkage

