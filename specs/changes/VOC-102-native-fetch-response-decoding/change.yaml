objective: >-
  Make the credential-free Cloudflare delivery gate decode native Fetch Response
  JSON before validating GitHub environment protections, while preserving decoded
  test-fixture compatibility and every existing fail-closed delivery boundary.

requirements:
  - id: VOC-102-D00
    statement: >-
      Candidate e6b102441ec6fdcf6c6e9f49c6172e49d9745276 received exact
      Cloudflare/CI-security and independent R3 PASS reviews plus VOC-102-ADOPT-01.
      This bookkeeping revision records adoption and repository implementation
      authority effective once the adopted package is on develop. It grants only the
      declared two-file repository implementation and no settings, secret,
      Cloudflare, dispatch, deployment, migration, traffic, DNS, spending,
      production, learner-data, or launch action.
  - id: VOC-102-D01
    statement: >-
      requestJson must recognize a native or Fetch-compatible response by response
      capability and shape, including inherited accessors, rather than requiring ok
      to be an own property. A successful JSON response must be status-checked,
      content-type-checked, awaited through json(), and passed to environment
      protection validation only after decoding.
  - id: VOC-102-D02
    statement: >-
      Response-like non-2xx, non-JSON-content-type, and malformed-JSON results must
      fail closed through the existing sanitized live-readback failure path. They
      must never become an eligible delivery decision or expose token/header/body
      values in reasons or evidence.
  - id: VOC-102-D03
    statement: >-
      Preserve the deliberate injected decoded-object fixture path only for an
      explicit plain record that does not present Fetch-response capabilities.
      Response-like objects must not bypass status, content type, or JSON decoding.
  - id: VOC-102-D04
    statement: >-
      Add focused tests using real native Response instances for successful
      environment and branch-policy decoding, exact eligible credential-check
      projection, non-2xx failure, non-JSON failure, malformed JSON failure, and
      retained plain decoded-object behavior.
  - id: VOC-102-D05
    statement: >-
      Preserve every event, actor, ref, SHA, confirmation, same-run check,
      environment-protection, reviewer, branch-policy, cost, secret-isolation,
      staging, and production control outside the response-decoding defect. Do not
      edit workflows, manifests, runbooks, settings truth, application code, or any
      historical change package.
  - id: VOC-102-D06
    statement: >-
      Use one minimum-sufficient task and one coherent implementation pull request.
      Plan and implementation each require applicable deterministic checks, fresh
      exact-revision Cloudflare/CI-security specialist review, independent R3
      verification by distinct non-author actors, and merge by a separate non-author
      actor. No risk label creates standing founder or technical-steward approval.

