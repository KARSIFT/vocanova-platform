    target/meaning data from the P1 `canonical_words`/`word_meanings`/ `word_examples`/`usage_notes`
    tables and learner level from `user_onboarding_profiles` for A2/B1 prompt behavior.
- id: VOC-028-DEP-02
  status: 'resolved-at-adoption 2026-07-25: production provider chosen (VOC-028-D02)
    - the founder''s own OpenCode Go account, model opencode-go/deepseek-v4-pro,
    integrated via opencode serve (a real headless HTTP server). Formal privacy/retention
    verification (training-data use, retention, processing regions, subprocessors,
    deletion) remains a pre-production legal-review gate, not resolved by this adoption
    - see specification.md D02/D04.'
- id: VOC-028-DEP-03
  status: "open-before-mission-completion; the daily-mission / streak / Confidence-Point\
