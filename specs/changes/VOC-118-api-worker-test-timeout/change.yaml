title: Bound the stale-reconciliation integration test timeout
type: required-verifier-timeout-correction
status: draft
risk: R3
planned_implementation_risk_floor: >-
  R3 because the sole implementation path has an automated R1 floor but verifies
  migration, stale-checkpoint, reconciliation, and D1 correctness. An overbroad
  timeout or weakened assertion could conceal a required-control defect. The change
  is finite, test-local, repository-only, reversible, and has no R4 consequence.
