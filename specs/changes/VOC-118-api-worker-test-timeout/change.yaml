  review-approval-merge-settings-dispatch-deployment-or-live-system-authority
implementation_pull_request_count: 1
implementation_pull_request: pending-after-adoption
multiple_pull_request_rationale: >-
  One test-file PR keeps measurement, timeout, semantic preservation, validation,
  rollback, and evidence in one required-verifier boundary. Splitting adds review,
  branch, timing, and bookkeeping overhead with no releasable intermediate state.
automatic_merge_allowed: true
production_impact: none-repository-test-only
rollback_required: true

objective: >-
  Preserve the complete stale-reconciliation correctness proof while giving exactly
  that integration-heavy test finite hosted scheduling headroom, only after repeated
  baseline measurement supports contention rather than a semantic defect.

requirements:
  - id: VOC-118-D00
    statement: >-
      Bind allocator evidence that VOC-116 is on develop, VOC-117 is reserved by open
      plan PR #222, and no package, issue title, local/remote branch, or ref uses
      VOC-118. Treat issue #223, PR #215, head
      ad9edd7c9caa912d36d3885acd62d90e80bd2a84, run 33513868763, job 99876022617,
      82/83 result, exact 5,000-ms timeout, focused 1.01-s/2.96-s evidence, and file
      20/20 with 552-ms named/5.74-s tests as intake and measurement only; they grant
      no implementation authority.
  - id: VOC-118-D01
    statement: >-
      Preserve the planning measurements on exact base 1f535aacc48e199b222ce8f91e1f82c597666c5f:
      three complete-file 20/20 passes with named durations 558/747/842 ms and three
      complete-worker 99/99 passes with 749/839/813 ms. Record that contention is a
      supported hypothesis, not a proven internal root cause.
  - id: VOC-118-D02
    statement: >-
      Before implementation editing, sequentially repeat at least three verbose
      complete-file and three complete-worker runs on the exact parent, capturing
      named, aggregate, Vitest, and wall durations and all failure/skip/timeout state.
  - id: VOC-118-D03
    statement: >-
      Stop without adding timeout headroom if measurement shows an assertion, D1,
      reconciliation-lock, setup, deterministic-phase, or unrelated suite failure,
      or requires a source/config/setup path outside the exact inventory.
  - id: VOC-118-D04
    statement: >-
      Only after the measurement gate passes, attach one literal 10,000-ms timeout
      to exactly the test named reruns a completed reconciliation instead of returning
      a stale pass. Keep every other test at the existing default and add no global,
      file-wide, describe, hook, worker, environment-derived, or config timeout.
  - id: VOC-118-D05
    statement: >-
      Preserve the exact test body and causal evidence: full conversion/import,
      initial pass reconciliation and release, post-checkpoint D1 mutation, restarted
      pending state, final failing reconciliation, and final release. Preserve every
      other test, fixture, helper bound, migration, and runtime source.
  - id: VOC-118-D06
    statement: >-
      Add no retry, repeat-on-failure, catch-ignore, fake clock, skip/conditional,
      fixture/chunk/page reduction, expected-status change, lock relaxation, extra
      serialization, assertion weakening, or conversion/reconciliation behavior edit.
  - id: VOC-118-D07
    statement: >-
      Use one task, one future implementation PR, and exactly
      apps/api-worker/test/data-conversion.test.ts. Preserve Vitest config/setup,
      package/lock/workflow/docs, data-conversion source/fixtures, and migrations.
  - id: VOC-118-D08
    statement: >-
      Require repeated named, complete-file, complete-worker, ci:worker-api, workspace,
      governance/risk/format/diff, exact path/preservation, rollback, and hosted checks.
      Any final-SHA timeout or semantic failure blocks merge and never authorizes an
      automatic increase beyond 10,000 ms.
  - id: VOC-118-D09
    statement: >-
      Require exact-SHA independent cross-model R3 review by a distinct non-author,
      separate non-author merge, complete revert capability, exact merge-SHA monitoring,
      and new evidence after every edit. No EHR or founder/steward layer is inferred.
  - id: VOC-118-D10
    statement: >-
      Keep the plan and implementation synthetic, credential-free, network-free, and
      repository-only. Do not query or mutate settings, dispatch, deploy, access
      Cloudflare/remote D1/production/learner data, change DNS/traffic, spend, release,
      promote main, launch, or claim issue closure.

