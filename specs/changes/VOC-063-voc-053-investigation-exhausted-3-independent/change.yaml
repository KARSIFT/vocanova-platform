requirement_source: "GitHub issue #473 (\"VOC-053 investigation exhausted (3 independent\
  \ passes, all candidates ruled out): close/supersede with a test-hardening scope\"\
  ), opened 2026-08-10 as a plan-from-issue request to move forward after VOC-053's\
  \ three independent root-cause investigation passes \u2014 two prior implementer\
  \ attempts (VOC-053-T00 attempts 1 and 2) plus a third pass with live staging/production\
  \ access \u2014 individually ruled out all three of issue #450's original candidates:\
  \ (a) Next.js/CDN caching (live cf-cache-status consistently DYNAMIC across multiple\
  \ edge colos; no Cache-Control/proxy_cache in nginx or Go API), (b) backend timezone/local-date\
  \ computation bug (two independent full handler \u2192 service \u2192 repository\
  \ traces found no code path that can decrement reviews_completed or flip local_date\
  \ between requests seconds apart), and (c) cross-run deploy-staging.yml concurrency\
  \ (the overlapping-run evidence from T00 attempt 2 was a false positive \u2014 job-level\
  \ inspection shows deploy-staging.yml's concurrency: {group: staging-deploy} lock\
  \ serializes runs cleanly). A real staging deploy + full core-loop E2E run on 2026-08-10\
  \ (workflow run 31371614353) passed cleanly, including the exact step-7 assertion\
  \ that failed originally. VOC-053-T01 is explicitly gated on T00 naming a specific\
  \ evidence-backed cause and explicitly forbids touching step 7; with all named candidates\
  \ exhausted and no fourth cause identified, T01 cannot proceed as scoped. The issue\
  \ requests VOC-053 be closed/superseded and a successor package scoped to harden\
  \ tests/staging-e2e/core-loop.staging.spec.ts step 7 (retry-and-reverify for possible\
  \ transient reads) and remove the temporary VOC-053-DEP-00 diagnostic (recordHomeResponseDiagnostic).\
  \ Issue #450 remains open for the original symptom; this package does not re-litigate\
  \ it.\n"
requirement_approval_status: Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, confirmed explicitly this
  same session) adopted this draft package on 2026-08-10, mirroring the established
  convention of flipping adoption fields before merge so adopt.yml succeeds. This
  explicitly includes accepting VOC-063-DEP-01 (superseding VOC-053's adopted "no
  retry/poll on step 7" non-goal) - the founder-delegate reviewed the package's own
  stated rationale (three independent investigation passes exhausted all named root
  causes; VOC-053-T01 cannot proceed as scoped) and accepts the scope change.
