- id: VOC-074-DEP-00
  status: 'unresolved at drafting time. Which exact cause prevents IncrementReviewsCompleted from committing
    after VOC-065-T01''s wiring fix is not settled — T00 must confirm with direct evidence. Drafting-time
    candidates (see specification.md): (1) runtime P4 guard still false or applyP4ReviewWiring error-swallowed
    path; (2) IncrementReviewsCompleted SQL or EnsureTodaySnapshot touching updated_at without incrementing
    reviews_completed; (3) (user_id, local_date) write-key mismatch between write and read/diagnostic
    dump; (4) synthetic-account queue exhaustion making reviewedCards=0 (test limitation, not the original
    bug). The diagnostic dump alone cannot distinguish (1)–(3) from (4) without also capturing reviewedCards
    from a run with a guaranteed-non-empty queue.

    '
