planned_implementation_risk_floor: 'Measured during drafting by running scripts/governance/classify-change-risk.sh
  --files-from against the expected task-scoped file list (apps/api/app/api/production.go, apps/api/business/reviews/postgres.go,
  apps/api/business/missions/repository.go, apps/web/tests/staging-e2e/core-loop.staging.spec.ts): the
  detected path floor is R1. This package proposes R3 for the change as a whole (not R1) because the symptom
  is a core-loop product correctness failure — daily_mission_snapshots.reviews_completed still does not
  advance after real review submissions on staging despite VOC-065-T01''s wiring fix landing — plus the
  staging gate currently allows a vacuous E2E pass that masks the defect. If T00 confirms a cause that
  forces a migration under apps/api/migrations/, the path floor itself rises to R3 and must be re-declared.
  This is a draft proposal for the reviewing human at adoption time, not a determination.

  '
