risk: R2
planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R2 because the promotion
  task itself introduces no new code or behavior change - every commit in the batch
  is already merged into develop and (per the issue) already reviewed - but the batch
  includes the auto_release_enabled wiring commit itself, which docs/governance/change-risk-
  classification.md would treat as a governance/workflow-authority change (typically
  R3-or-higher on its own). This package does not re-review that commit's substance
  (that already happened in whichever PR merged it into develop); it only proposes
  the risk for the promotion action. This is a draft proposal for the reviewing human
  at adoption time, not a determination, and the human may reasonably set this higher
  given the governance-authority content riding along in the batch.
canonical_path: specs/changes/VOC-049-develop-has-17-unreleased-commits-from-direct
authority_model: a003-active
requirement_source: 'GitHub issue #375 ("develop has 17 unreleased commits from direct
  governance/infra-cleanup PRs - needs promotion to main"). The issue states develop
  was, at filing time, 17 commits ahead of main (https://github.com/KARSIFT/vocanova-platform-sandbox/compare/main...develop),
  none of which reached main through release.yml''s normal check-and-open/auto- promote
  flow, because none originated from an adopted change package with a .karsift/tasks.json
  task roster - they were direct governance/infra-cleanup PRs (docs reconciliation,
  duplicate-ID/invalid-YAML fixes, stale package- status syncs, the auto_release_enabled
  wiring itself, and a branch-ruleset verification commit). Since release.yml only
  fires on a tracked task issue closing, this content had no natural trigger to reach
  main on its own. The issue requests this batch be promoted from develop to main
  through the normal governed loop, and separately notes that once this promotion
  completes, auto_release_enabled should be live for future packages going forward.'
requirement_approval_status: 'Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox, confirmed explicitly this same
  session) merged this draft package''s own plan PR (#376) on 2026-08-08, adopting it.
  This follow-up commit records that decision, mirroring VOC-044/045/046''s convention -
  merging the plan PR only merges the draft content and does not itself flip these
  fields.

  Resolves VOC-049-DEP-00 (the stale "1 commit" drafting-time finding): re-checked
  origin/main...origin/develop at adoption time and confirmed the gap is genuinely 17
  commits, matching issue #375''s original count, not the planner''s drafting-time
  finding. The drafting-time finding was itself stale/transient (likely a GitHub API
  compare-endpoint consistency lag), not evidence anything had already promoted.
  VOC-049-T00 still re-verifies independently at implementation time per its own design
  regardless of this note.

  Resolves VOC-049-DEP-01 (whether the auto_release_enabled wiring commit riding along
  in this batch needs separate elevated review before promotion): no separate review is
  required. That commit was already explicitly authorized by the founder directly
  (asked what "no need to approval for deployment" meant, given the full consequences,
  and confirmed twice) before it merged into develop - see AGENTS.md''s "Release and
  deployment authority" section for the record. This package''s promotion action makes
  that already-authorized content reachable on main; it does not re-authorize it.

  Mechanism selected from specification.md''s open question 1: option (a) - this
  package''s own task issue closing gives release.yml''s normal check-and-open/
  auto-promote jobs a real trigger, the same governed path any other package''s release
  uses. No manual promotion PR.'
drafting_time_note: 'At drafting time (2026-08-08), origin/main and origin/develop
  were compared directly: develop was found to be only 1 commit ahead of main (0914ea7,
  "Merge pull request #374 from KARSIFT/test/ruleset-verification"), not 17. This
  means most of the batch the issue describes has already reached main by some path
  between the issue being filed and this package being drafted - plausibly the release.yml
  auto-promote path the batch itself enabled, or a separate manual promotion. This
  package does not assume the issue''s "17 commits" figure is still accurate; tasks.md''s
  T00 requires the implementer to re-run the same compare at implementation time and
  treat whatever the actual remaining gap is (which may be small, or even zero) as
  authoritative over the issue''s original count. If T00 finds the gap is already
  zero, this package''s remaining tasks close as not-needed with that finding recorded
  as evidence, rather than promoting nothing to manufacture busywork.'
