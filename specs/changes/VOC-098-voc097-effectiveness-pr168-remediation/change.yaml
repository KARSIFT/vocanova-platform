requirements:
  - id: VOC-098-D00
    statement: >-
      Issue 169 and the PR 168 FAILs are evidence only. Implementation resumes only
      after exact plan review, adoption, truthful bookkeeping, fresh bookkeeping
      review, genuine eligibility, normal non-author plan merge, and postmerge checks.
  - id: VOC-098-D01
    statement: >-
      Resume the same PR 168 branch and /tmp/vocanova-voc094-pr1 worktree. Preserve
      its commits/open PR, dirty VOC-090, all worktrees, branches, recovery refs, and
      source-head evidence without reset, discard, recreation, force-push, or deletion.
  - id: VOC-098-D02
    statement: >-
      Reconcile all nine VOC-097 files with exact PR 167 bookkeeping head/review,
      eligible true and empty reasons, merge SHA, successful CI/Security/Governance,
      and lifecycle comment. Make repository authority effective and task status
      truthful while preserving candidate/adoption history and every external hold.
  - id: VOC-098-D03
    statement: >-
      Add only the nine VOC-097 package files to the prior 38-path union, producing 47
      authorized paths and 46 expected actual diffs because the web generated type is
      byte-identical. A 48th path, missing required path, or fabricated diff is drift.
  - id: VOC-098-D04
    statement: >-
      The first secret-bearing workflow step captures runner UTC and compares it with
      both integrity-bound ACT-04 and effective token expiries before its first secret
      read. Equality/lateness fails closed and deterministic delay/boundary tests pass.
  - id: VOC-098-D05
    statement: >-
      Enforce an independent five-second connection deadline and a fifteen-second
      deadline through complete response-body consumption, with delayed-connect and
      stalled-body negatives and no retry or fixture fallback.
  - id: VOC-098-D06
    statement: >-
      Recursively reject lone high/low UTF-16 surrogates in strict JSON/JCS keys and
      values while accepting valid pairs; add deterministic key/value/nesting tests.
  - id: VOC-098-D07
    statement: >-
      Reconcile the four identified operative VOC-094 27-file claims to 29 core and
      38 total while preserving explicit history. Make the package-text negative scan
      both VOC-094 and VOC-096 so stale operative counts cannot false-pass.
  - id: VOC-098-D08
    statement: >-
      Preserve cde0f665 and comments 5443876203, 5443893558, and 5443923705 as
      immutable FAIL evidence. Require fresh complete checks and all three reviews on
      the new exact candidate; no evidence or authority transfers.
  - id: VOC-098-D09
    statement: >-
      Preserve every prepared-binder, exact-SHA/ref/URL/ID/run/suite/job, replay,
      budget, expiry, resource, baseline, schema, migration, smoke, Wrangler type,
      Free-zero-cost, Basic-LB, secret, rollback, production-sentinel, and hold gate.
  - id: VOC-098-D10
    statement: >-
      Run the complete PR 168 validation matrix, hosted checks, secret scans,
      production comparisons, both type checks, and all four Wrangler dry runs on the
      fresh corrected SHA.
  - id: VOC-098-D11
    statement: >-
      Obtain fresh separate Cloudflare/Wrangler, security/settings, and independent R4
      exact-SHA PASS reviews. A distinct non-author merges only after genuine
      eligibility and records postmerge/source-head/ref evidence.
  - id: VOC-098-D12
    statement: >-
      Authorize repository correction only. Settings, secrets, credentials,
      Cloudflare, DNS, D1, dispatch, deployment, migration, traffic, spending,
      production, data, launch, and main actions remain prohibited and held.

