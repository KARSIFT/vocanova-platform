schema_version: 1
id: VOC-065
slug: real-backend-write-path-bug-reviews-completed
title: Fix Real Backend Write Path So reviews_completed Increments On Review Submission
type: bugfix
status: adopted
risk: R3
planned_implementation_risk_floor: "Measured during drafting by running scripts/governance/classify-change-risk.sh\
  \ --files-from against the expected task-scoped file list (apps/api/app/api/production.go,\
  \ apps/api/business/reviews/postgres.go, apps/web/tests/staging-e2e/core-loop.staging.spec.ts\
  \ as a read/verify target): the detected path floor is R1. This package proposes\
  \ R3 for the change as a whole (not R1) because the drafting-time primary candidate\
  \ is a composition-root wiring gap in production.go that would cause daily_mission_snapshots.reviews_completed\
  \ never to increment for any real staging/production user after a successful review\
  \ submission — a production user-facing correctness failure on the core learning\
  \ loop, not a test-only defect. If T00 confirms a different cause that forces a\
  \ migration under apps/api/migrations/, the path floor itself rises to R3 and must\
  \ be re-declared. This is a draft proposal for the reviewing human at adoption time,\
  \ not a determination.\n"
canonical_path: specs/changes/VOC-065-real-backend-write-path-bug-reviews-completed
authority_model: a003-active
requirement_source: "GitHub issue #482 (\"Real backend write-path bug: reviews_completed\
  \ never increments during real staging E2E review submissions (distinct from VOC-053's\
  \ original symptom)\"), opened 2026-08-10 after deploy-staging.yml run 31429774964\
  \ (~20:38 UTC) failed tests/staging-e2e/core-loop.staging.spec.ts step 7 under VOC-063-T01's\
  \ newly-merged bounded retry hardening. The hardened step correctly failed rather\
  \ than masking: reviewedBefore=0, reviewedCards=2, minimumExpected=2, observed=[0,\
  \ 0, 0, 0] across 4 fresh page.goto(\"/home\") + API reads. The same job's VOC-050-T02\
  \ diagnostic DB dump shows today's daily_mission_snapshots row still at reviews_completed=0\
  \ with updated_at=2026-08-10 00:13:45+00 — hours before the ~20:38 test run\
  \ — so the row was never touched despite the UI reporting two successful reviews.\
  \ Issue #482 explicitly distinguishes this from VOC-053/issue #450's original decrease\
  \ symptom (reviewedBefore=1 then reviewedAfter=0) and asks that it be planned as\
  \ its own package, not folded into VOC-063 (test-hardening only, already merged\
  \ and working) or reopened under VOC-053 (investigation closed under a different,\
  \ now-superseded theory). Issue #450 stays open for the original symptom.\n"
requirement_approval_status: Approved. Founder-delegate (acting under the standing
  founder-gate delegation for vocanova-platform-sandbox) adopted this draft package
  on 2026-08-11. R3 classification accepted as proposed. VOC-065-DEP-01 accepted as
  proposed (forward-fix only; no historical daily_mission_snapshots backfill in this
  package's scope). This package does not close issue #450 and does not reopen VOC-053,
  per VOC-065-DEP-02.
