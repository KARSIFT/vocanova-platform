automatic_merge_allowed: false
production_impact: "likely yes if the drafting-time primary candidate is confirmed.\
  \ A missing P4 missions/gamification wire-up on the live reviews repository would\
  \ mean every successful review submission in staging and production inserts review_attempts\
  \ / updates user_words but never increments daily_mission_snapshots.reviews_completed\
  \ — so Home's \"words reviewed today\" counter stays at 0 for all users. Confirming\
  \ and fixing that wiring would change production user-visible mission progress going\
  \ forward. No schema migration is anticipated for the primary candidate; historical\
  \ under-counts (rows left at 0) are an open question for the adopting human, not\
  \ assumed in scope.\n"
