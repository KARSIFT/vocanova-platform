dependencies:
- id: VOC-065-DEP-00
  status: "unresolved at drafting time. Which exact cause prevents IncrementReviewsCompleted\
    \ from committing for the failing run is not settled by this package — T00\
    \ must confirm with direct evidence. Drafting-time primary candidate (see specification.md):\
    \ apps/api/app/api/production.go constructs reviews.NewPostgreSQLRepository(db,\
    \ clk) without WithGamificationService / WithMissionsService, so SubmitReview's\
    \ P4 guard (gamification != nil && missions != nil) skips applyP4ReviewWiring\
    \ entirely while RegisterMissions still serves reads. Secondary candidates from\
    \ issue #482 (UI/test short-circuit; (user_id, local_date) key mismatch on the\
    \ write path; synthetic-account queue race) remain in scope for T00 until ruled\
    \ out.\n"
- id: VOC-065-DEP-01
  status: "unresolved at drafting time. Whether any historical daily_mission_snapshots\
    \ rows (staging synthetic account and/or real production users) should be backfilled\
    \ after the forward fix lands is an adopting-human decision. Default proposed\
    \ scope is forward-fix only — no corrective migration — unless adoption\
    \ explicitly expands it. See specification.md open question 2.\n"
- id: VOC-065-DEP-02
  status: 'resolved at drafting time by issue #482''s scope note. This package is
    distinct from VOC-063 (test hardening, already merged) and from VOC-053 (closed
    investigation of a different decrease symptom). Issue #450 remains open for the
    original symptom and is not closed or re-litigated here.

    '
