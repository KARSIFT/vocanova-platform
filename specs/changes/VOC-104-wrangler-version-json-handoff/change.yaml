objective: >-
  Make each locked Wrangler version-list command finish writing a complete JSON
  document before the separate exact-tag resolver starts, preventing the observed
  post-upload pipe failure without weakening migration, promotion, smoke, rollback,
  secret-isolation, or production controls.

requirements:
  - id: VOC-104-D00
    statement: >-
      Issue 186 and run 33372680216 are defect intake and evidence only. Repository
      implementation requires this exact package to receive independent review and
      adoption on develop. Adoption grants only the declared three-file repository
      implementation and no settings, secret, Cloudflare, workflow-dispatch,
      deployment, migration, traffic, DNS, spending, production, learner-data, or
      launch action.
  - id: VOC-104-D01
    statement: >-
      In the immutable-version upload step, each locked wrangler versions list
      --json command must write stdout to its own securely created runner-local
      temporary file and exit successfully before the corresponding resolver process
      starts. The workflow must not directly pipe, use process substitution, or use
      another concurrent producer-consumer handoff between versions list and
      --resolve-version-tag. Temporary paths and JSON bodies must not be logged,
      exported, persisted as artifacts, or committed, and cleanup must run on both
      success and failure without masking the primary failure.
  - id: VOC-104-D02
    statement: >-
      The existing tag sha-<12>-run-<run-id>-attempt-<attempt> remains exact. Each
      resolver must read only its matching complete API or web JSON file, require
      exactly one entry with that exact tag and a valid version UUID, and publish
      only the validated UUID to the existing step output. No earlier unpromoted
      version, ambiguous match, truncated JSON, command failure, or invalid UUID may
      reach promotion.
  - id: VOC-104-D03
    statement: >-
      Preserve the ordered boundary: exact current 100%-traffic rollback discovery,
      compatible D1 migrations, both immutable uploads, complete file-backed version
      listing and exact resolution, exact UUID promotion, bounded smoke, and
      rollback after promotion failure. A list, capture, parse, or resolution failure
      must stop before promotion and smoke, leave traffic unchanged, and not trigger
      the promotion rollback because promotion did not begin. Once promotion begins,
      the existing independent dual-Worker rollback guard remains unchanged.
  - id: VOC-104-D04
    statement: >-
      Treat the observed staging state as a safe pre-promotion partial state: the
      ordered D1 migration ledger was applied and immutable unpromoted API and web
      versions exist, but traffic was not promoted. A later separately authorized
      run must rediscover the current serving rollback targets, reapply only pending
      entries through the same ordered compatible migration command, upload newly
      run/attempt-tagged versions, and ignore earlier unpromoted versions through
      exact tag matching. Do not record the existing unpromoted version UUIDs in any
      repository file, issue, comment, artifact, test fixture, or plan evidence.
  - id: VOC-104-D05
    statement: >-
      Extend inspectDeliveryWorkflow and its focused tests to require the complete
      file-backed handoff and reject the current direct versions-list-to-resolver
      pipe, missing or shared captures, mismatched resolver input, resolver-before-
      list completion, missing cleanup, and any promotion path that can consume an
      unresolved value. Add an isolated no-network child-process regression proving
      that the resolver receives and parses a complete synthetic JSON document and
      that truncated JSON or an ambiguous exact tag fails closed.
  - id: VOC-104-D06
    statement: >-
      Preserve locked Wrangler/config selection, exact tag and UUID validation,
      no-secret output, approval-history-first ordering, account and rollback
      readback, compatible migration ordering, immutable uploads, exact promotion,
      bounded smoke, independent dual-Worker rollback, environment-only secret
      references, cost/resource gates, and VOC-080-HOLD-01/VOC-080-HOLD-02. Do not
      edit manifests, runbooks, settings truth, application code, resolver semantics,
      dependency versions, or historical change packages.
  - id: VOC-104-D07
    statement: >-
      Use one minimum-sufficient task and one coherent implementation pull request.
      Plan and implementation each require applicable deterministic checks, fresh
      exact-revision Cloudflare/CI-security specialist review, independent R3
      verification by distinct non-author actors, and merge by a separate non-author
      actor. No risk label creates standing founder or technical-steward approval.

