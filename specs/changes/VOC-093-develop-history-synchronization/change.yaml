action_specific_authority:
  required: true
  authorization_status: >-
    adopted-exact-candidate-binds-only-the-limited-short-lived-source-head-auto-
    deletion-scope-but-remains-ineffective-until-this-bookkeeping-revision-exact-
    review-populated-binder-genuine-eligible-true-reasons-empty-normal-pr-156-merge-
    and-applicable-postmerge-checks
  source: >-
    The live repository setting `delete_branch_on_merge=true` was independently
    observed on 2026-08-24 UTC during VOC-092. A normal merge of this plan PR and of
    the later short-lived implementation PR is therefore expected to let GitHub
    automatically delete only the merged source branch head after the merge completes.
    This package does not authorize any manual branch deletion, any worktree removal,
    or any deletion target other than the merged short-lived plan/implementation
    source heads.
  actions:
    - id: VOC-093-AUTH-BRANCH-HEAD-00
      action: >-
        allow only GitHub's automatic post-merge deletion of a merged short-lived
        plan or implementation source branch while `delete_branch_on_merge=true`
      accountable_role: separate-authorized-non-author-merge-actor
      required_evidence: >-
        exact source-branch name, exact pre-merge tip SHA, proof that the branch is
        a short-lived non-permanent plan or implementation head rather than `main`
        or `develop`, post-merge branch-list readback, and exact recreate command
        or push syntax from the recorded SHA
      completion_condition: >-
        post-merge evidence shows `main` and `develop` still present, no manual
        branch-delete action was performed, and only the merged short-lived source
        head was removed automatically if GitHub applied the setting
      expiry_condition: >-
        expires on source-branch rename, pre-merge SHA drift, setting drift away
        from true, merge-target drift away from `develop`, operator withdrawal, or
        any proposed deletion target beyond the merged short-lived source head

