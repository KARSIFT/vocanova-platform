planned_implementation_risk_floor: 'Not yet computed by running scripts/governance/classify-change-risk.sh

  against a real file set, because this package''s own tasks (T00-T08 below)

  do not yet have an approved, task-scoped file list to classify -- each

  task''s own PR must run the classifier against its own actual diff at

  implementation time. This package proposes R3 for the milestone as a

  whole because its known likely areas (production secrets/credential

  management, production infrastructure/hosting decisions, launch

  kill-switches, and legal/privacy prerequisites) squarely match

  docs/governance/change-risk-classification.md''s R3 row, and at least one

  task (T00, the production hosting/deploy-target decision) plus the legal/

  privacy prerequisite task (T02) plausibly reach R4 under that same

  document''s classification-test question 1 (material product direction,

  user-trust posture, and DOC-12''s own explicit founder-decision requirement

  for go/no-go). This is a draft proposal for a human to review at adoption

  time, not a determination, and does not bind any individual task''s own

  later, path-based classifier run.'
