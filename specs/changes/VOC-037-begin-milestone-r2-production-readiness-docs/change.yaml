requirement_source: 'Free-text founder request recorded in this package''s own drafting
  run (2026-08-01), grounded against docs/product/12-mvp-implementation-plan.md (DOC-12)
  section 5''s R2 objective and gate, and against specs/changes/VOC-032-begin-milestone-r1-staging-readiness-docs-product/staging-evidence.md''s
  final R1-closure record (R1 closed 2026-08-01, founder-accepted per issue #256,
  with four explicitly tracked follow-ups: the DOC-09 section 23 AI-evaluation-threshold
  miss, the T14/T15 live email/Google-OAuth evidence blocked on VOC-032-DEP-07 credentials,
  and the T11/T13 documentation rewrites). This package does not fold those four follow-ups
  into R2 scope, per the request''s own explicit instruction, except where a new R2
  task naturally depends on one of them (see specification.md''s dependency notes).
  This package is also grounded against docs/operations/11-devops-and-ci-cd.md (DOC-11,
  as amended by VOC-032-section-1-amendment) for the current staging-tier infrastructure
  shape, and against a repository-wide search for existing privacy-policy, terms-of-service,
  or data-handling-disclosure documents, which found none under docs/ (see specification.md
  for the exact search and its result). No GitHub issue exists yet for this request;
  the calling workflow is expected to open or link one at adoption. This package does
  not authorize its own adoption -- see approval_status below.'
