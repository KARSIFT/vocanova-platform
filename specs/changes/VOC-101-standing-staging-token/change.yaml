objective: >-
  Define the staging credential as a standing token valid until revoked, without
  broadening its account, permissions, placement, use, or any staging or production
  authority.

requirements:
  - id: VOC-101-D00
    statement: >-
      Candidate 7a9558ba9f71605fac477455c19c5ef41433e6cd received exact
      Cloudflare, security/governance, and independent R4 PASS reviews plus
      VOC-101-ADOPT-01. This bookkeeping revision truthfully records adoption and
      repository-only implementation authority effective once the adopted package
      is on develop. It grants no GitHub settings, secret, Cloudflare, dispatch,
      deployment, DNS, spending, data, production, or launch authority.
  - id: VOC-101-D01
    statement: >-
      Future living policy describes the staging credential only as an
      operator-revoked standing token valid until revoked. Token changes remain
      accountable operator actions.
  - id: VOC-101-D02
    statement: >-
      Preserve account 0a9eda28b96d77c24dcde74f3e074d47, exactly Workers Scripts
      Edit and D1 Edit, environment-only CLOUDFLARE_ACCOUNT_ID and
      CLOUDFLARE_API_TOKEN, broader-scope secret-name absence, redaction, and the
      prohibition on DNS, billing, user, organization, Access, Pages, R2, AI,
      production-data, token-management, and unrelated-product permissions.
  - id: VOC-101-D03
    statement: >-
      Require immediate revocation on suspected disclosure, account or permission
      drift, shared-identity fabrication, loss of operator control, or explicit
      operator revocation request; staging then remains disabled unless and until a
      replacement passes dashboard policy readback, local status/account verification
      without logging, environment-secret installation, and the protected no-write
      credential check. Only a voluntary replacement with no mandatory trigger may
      retain the prior token through those checks and revoke it afterward. If that
      voluntary replacement fails, restore the prior environment secret, pass the
      protected no-write check, and revoke the failed replacement. If a replacement
      after a mandatory trigger fails, revoke and remove the failed replacement and
      keep staging disabled. If any required revocation cannot be confirmed, remove
      the GitHub environment API-token secret, reject new approvals, cancel in-flight
      staging runs, record an incident, retry revocation, and verify the affected token
      is inactive without logging it. Staging cannot resume until that verification
      succeeds and a valid credential passes the protected check. Revocation or
      replacement is not coupled to a deployment, plan, or pull request.
  - id: VOC-101-D04
    statement: >-
      Reconcile every inventoried living workflow, settings, governance, and
      operations surface plus deterministic validators/tests. Preserve VOC-100 and
      VOC-094 through VOC-099 as immutable historical records.
  - id: VOC-101-D05
    statement: >-
      Preserve manual develop-only SHA/attempt-bound staging review, environment
      protection, shared-identity residual acceptance, synthetic-only staging,
      Free/$0 ceiling, exact D1/Worker safety, and every production hold. Credential
      lifecycle never grants dispatch or review judgment.
  - id: VOC-101-D06
    statement: >-
      Plan and implementation each receive fresh exact-revision Cloudflare,
      security/governance, and independent R4 PASS evidence from distinct non-author
      actors, hosted checks, and a merge by a separate non-author actor.
  - id: VOC-101-D07
    statement: >-
      Use one minimum-sufficient task and one coherent implementation pull request.
      An ordinary dispatch, revocation, or replacement performed under the adopted
      stable policy requires neither a change package nor a pull request. Any later
      meaningful policy or behavior change still follows the normal governed intake
      and adoption workflow.

