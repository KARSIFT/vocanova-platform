title: Both nginx Containers (Staging and Production) Report Unhealthy Permanently Because Docker HEALTHCHECK
  Targets the Wrong Vhost
type: fix
status: adopted
risk: R3
planned_implementation_risk_floor: 'Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real task-scoped file list. This package proposes R3 for the change as a whole because every
  expected in-scope path sits under infra/ (docker-compose.yml, docker-compose.production.yml, and, if
  the recommended catch-all /healthz approach is chosen, nginx/conf.d/05-default.conf and nginx-production/conf.d/05-default.conf).
  scripts/governance/classify-change-risk.sh floors infra/* at R3, and docs/governance/change-risk-classification.md
  names "production infrastructure" explicitly as an R3-floor category regardless of diff size. The semantic
  consequence is restoring a truthful Docker health signal for both staging and production nginx without
  weakening the intentional 444 catch-all hardening for unrecognized Host headers — still an R3-protected
  infrastructure change, not a higher class (no schema, secrets, auth logic, or governance authority change).
  This is a draft proposal for the reviewing human at adoption time, not a determination.

  '
canonical_path: specs/changes/VOC-066-both-nginx-containers-staging-and-production
authority_model: a003-active
requirement_source: 'GitHub issue #484 ("Both nginx containers (staging and production) report unhealthy
  permanently - Docker HEALTHCHECK targets the wrong vhost"), opened 2026-08-11 after live observation
  on the shared host during a production-outage investigation. The issue body (the full request at drafting
  time) documents both containers reporting unhealthy for their entire uptime while correctly serving
  traffic, docker inspect ExitCode 1 with "wget: error getting response", nginx access logs showing healthcheck
  probes receiving 444 from the default catch-all vhost, successful curls with the correct Host header
  / https://staging.vocanova.site/, the identical HEALTHCHECK in infra/docker-compose.yml and infra/docker-compose.production.yml
  (wget to http://127.0.0.1/ with no Host header), and the root cause that 05-default.conf (and its production
  counterpart) deliberately return 444 for unrecognized Host — so the probe can never pass by construction.
  The issue requires the fix land in both compose files in the same change and offers two non-prescriptive
  directions (Host-qualified wget, or a dedicated /healthz on the catch-all). A companion issue about
  unifying the two nginx containers is referenced but is independent and out of this package''s scope.

  '
requirement_approval_status: 'Approved. Founder-delegate (acting under the standing founder-gate delegation
  for vocanova-platform-sandbox) adopted this draft package on 2026-08-11. R3 classification accepted
  as proposed. VOC-066-DEP-01 resolution: the recommended default approach is authorized (a dedicated
  /healthz-style location on the default catch-all vhost, preserving the intentional 444 for every other
  unrecognized Host). VOC-066-DEP-02 resolution: no interim manual recreate is required; the next normal
  deploy-staging.yml/deploy-production.yml recreate picking up the fixed HEALTHCHECK is acceptable. VOC-066-DEP-03
  confirmed out of scope (nginx consolidation is tracked separately as VOC-067).'
