dependencies:
- id: VOC-066-DEP-00
  status: 'unresolved at drafting time. Depends on issue #484''s reported reproduction remaining accurate
    at implementation time — both nginx containers still unhealthy for the same 444-on-bare-Host reason,
    with the same HEALTHCHECK strings in both compose files. If a later comment reports a different or
    additional cause, VOC-066-T00 must be re-scoped before implementation.

    '
- id: VOC-066-DEP-01
  status: 'unresolved at drafting time. Approach choice for the healthcheck fix — recommended default
    is a dedicated /healthz (or equivalent) location on the default catch-all vhost that returns 200 while
    preserving 444 for all other unrecognized-Host traffic; alternative is a Host-qualified wget against
    a real vhost. Adoption must record which approach is authorized. See specification.md open question
    1; Host-header approach carries a documented port-80 → 301 HTTPS redirect hazard.

    '
- id: VOC-066-DEP-02
  status: 'unresolved at drafting time. Whether the currently-running staging and/or production nginx
    containers need an interim manual recreate after the compose/conf change lands, or whether waiting
    for the next normal deploy-staging.yml / deploy-production.yml recreate is acceptable. A compose/conf
    edit alone does not change an already-running container''s HEALTHCHECK or mounted conf until recreate.
    See specification.md open question 2.

    '
- id: VOC-066-DEP-03
  status: 'out of scope / informational. Issue #484 references a companion issue on unifying the two nginx
    containers. That work is independent of restoring a truthful health signal and must not expand this
    package. File or track that separately; do not merge scopes.

    '
