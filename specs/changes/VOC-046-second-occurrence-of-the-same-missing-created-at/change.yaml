planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real, task-scoped file list. This package proposes R3 because the confirmed
  defect fully blocks every new user from reaching /home in production (a hard outage
  of the core post-onboarding path, the same class of outage VOC-045 fixed for user_settings),
  and its systemic-audit task (VOC-046-T02) may touch a currently-unknown number of
  INSERT call sites across many files, none of which are known at drafting time to
  require a schema migration. This is a draft proposal for the reviewing human at
  adoption time, not a determination. If the audit in T02 surfaces a call site requiring
  a migration or touching a materially more sensitive table, the reviewing human and
  independent verifier should re-examine whether R3 still holds for that specific
  task.
authority_model: a003-active
requirement_source: 'GitHub issue #352 ("Second occurrence of the same missing created_at/updated_at
  bug class: daily_mission_snapshots INSERT crashes GET /api/v1/daily-mission for
  every user with no mission yet today"), including its full body (the only content
  on the issue at drafting time - no comments existed yet). The issue documents a
  live production reproduction during VOC-038-T03''s core-loop validation (2026-08-07),
  immediately after VOC-045 fixed the user_settings occurrence of this same bug class:
  a real user who just completed onboarding lands on /home and receives a generic
  500 ("Something went wrong / We couldn''t load your home data"), with nginx and
  web-container log evidence (GET /api/v1/daily-mission -> 500, masked by the API''s
  generic 500 handler rather than surfacing the underlying Postgres error the way
  VOC-045''s user_settings occurrence happened to). It identifies the confirmed root
  cause (apps/api/business/missions/repository.go''s CreateDailyMissionSnapshot omits
  created_at/updated_at from its INSERT column list against daily_mission_snapshots,
  which apps/api/migrations/20260725130001_voc030_p4_mission_tables.sql declares NOT
  NULL with no DEFAULT), documents that this NOT-NULL-no-DEFAULT convention is deliberate
  and repeats across all 13 migration files (explicit application-level timestamp
  control via the injected clock.Clock abstraction, not DB-level defaults), and names
  thirteen files containing INSERT INTO statements against application tables that
  should be audited for the same omission. It proposes an immediate fix for the confirmed
  crash plus a systemic audit, regression coverage per call site, and a schema-scanning
  check to prevent a third undetected occurrence.'
requirement_approval_status: 'Approved. Founder merged PR #353 (this draft package''s
  own plan PR) on 2026-08-07T12:34:39Z, adopting it. This follow-up commit records
  that decision in change.yaml, mirroring VOC-039 through VOC-045''s convention. Open
  question 1 (audit scope) is resolved by tasks.md''s own boundary already (thirteen
  named files, record-not-silently-skip); open question 2 (schema-scanning check)
  is resolved IN SCOPE - T03 stays in this package, worth preventing a third occurrence;
  open question 3 (generic 500 masking real errors) is resolved OUT of scope - real
  but tangential, file a follow-up if desired. T00 is P0 and should be dispatched
  first, ahead of T01-T03.'
