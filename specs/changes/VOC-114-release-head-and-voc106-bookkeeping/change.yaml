objective: >-
  Correct VOC-106 and every living release instruction so promotion uses an exact,
  short-lived copy of freshly frozen develop as the PR head, never permanent develop;
  reconcile stale VOC-106 adoption/task fields; and preserve all existing review,
  merge, synchronization, rollback, and external-action boundaries.

requirements:
  - id: VOC-114-D00
    statement: >-
      Record issue #213 as intake and the observed contradiction: hosted
      delete_branch_on_merge is true, while adopted VOC-106 directs permanent develop
      to be the release PR head and only says to stop if its deletion risk cannot be
      disproved. Do not execute release, settings, or branch mutation from the draft.
  - id: VOC-114-D01
    statement: >-
      Replace the release source with one short-lived
      release/voc-106-<frozen-develop-short-sha> branch created at the exact freshly
      fetched origin/develop SHA. Before review and merge, prove its SHA and tree equal
      the frozen develop SHA and tree, its base is exact current main, and the aggregate
      compare contains no commit or tree beyond the frozen develop candidate.
  - id: VOC-114-D02
    statement: >-
      Any movement of origin/develop, origin/main, the release head, PR base/head,
      merge base, tree, compare, required check, policy evidence, or reviewed revision
      invalidates the complete release binder. Refresh the same short-lived head to a
      new exact develop freeze only with force-with-lease or close without merge; then
      rerun all checks and obtain fresh exact-revision reviews.
  - id: VOC-114-D03
    statement: >-
      The release PR targets main and uses an identifiable merge commit. Before merge,
      record the short-lived release head name, exact SHA, and nonexecuted recreation
      command. Existing automatic deletion may remove only that merged short-lived
      release head and the later merged short-lived synchronization head. Permanent
      develop and main must remain present and unchanged by source deletion.
  - id: VOC-114-D04
    statement: >-
      Preserve VOC-106's separately reviewed post-promotion synchronization from a
      short-lived current-develop branch, final main-ancestor-of-develop and zero-behind
      proofs, complete R4 evidence, distinct non-author reviewers, and separate
      authorized non-author merger for each exact protected-history PR.
  - id: VOC-114-D05
    statement: >-
      Reconcile all nine VOC-106 package artifacts: retain its adopted candidate,
      review, approval, and implementation authorization evidence; remove only stale
      pending-adoption/bookkeeping blockers; mark T00 authorized and pending fresh
      release freeze; leave T01 pending the release merge; and make every release-head,
      test, evidence, contingency, and rollback statement consistent with D01-D04.
  - id: VOC-114-D06
    statement: >-
      Update AGENTS.md, CONTRIBUTING.md, DOC-15 current release sections, DOC-16,
      repository-settings.md, and the development-workflow guide in the same PR.
      Preserve explicitly historical text and immutable earlier packages, but ensure
      every living current-behavior statement names the disposable exact release head.
  - id: VOC-114-D07
    statement: >-
      Implementation changes exactly the 15 declared existing files, contains no
      application/workflow/settings state mutation, and passes governance validation,
      changed-path risk classification, whitespace/link/reference checks, focused
      semantic positive/negative audits, hosted required checks, and exact-diff review.
  - id: VOC-114-D08
    statement: >-
      Require an exact-revision release-governance/git-history specialist PASS and a
      different independent R4 reviewer PASS with zero blockers. A separate non-author
      merge actor may merge the correction only after adoption and all current evidence.
  - id: VOC-114-D09
    statement: >-
      Under DOC-15 section 24.18, the adoption-recorded owner monitors from correction
      merge through exact-merge-SHA hosted/readback checks and the first corrected
      VOC-106 promotion/synchronization evidence. Failure or permanent-head exposure
      stops release/closure and routes a governed correction or reviewed revert.
  - id: VOC-114-D10
    statement: >-
      Prohibit repository-settings query or mutation, manual branch deletion, workflow
      dispatch, deployment, Cloudflare/DNS/resource action, secret or production/data
      access, migration, traffic, spending, launch, force-push of a permanent branch,
      self-review, self-approval, and self-merge.

