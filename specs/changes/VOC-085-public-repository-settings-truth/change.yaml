dependencies:
  - id: VOC-085-DEP-00
    status: satisfied-exact-plan-review-and-adoption-decision-pr-126-merge-pending
    description: >-
      The plan candidate must receive a different-actor exact-SHA independent PASS,
      and an accountable adoption decision must bind that PASS before implementation.
  - id: VOC-085-DEP-01
    status: required
    description: >-
      VOC-080's private-repository snapshot in
      docs/operations/voc-080-transition-record.{json,md} remains immutable history;
      state current as observed at 2026-08-24 must be recorded separately and never
      overwrite it.
  - id: VOC-085-DEP-02
    status: required
    description: >-
      Future rulesets, security features, and other mature protections are desired
      and held only. This package and its implementation must not mutate GitHub or
      any environment setting.
  - id: VOC-085-DEP-03
    status: required
    description: >-
      Issue #119 may close only after the final implementation revision merges into
      develop and applicable post-merge checks pass; drafting or plan adoption does
      not close the issue.
  - id: VOC-085-DEP-04
    status: required
    description: >-
      Dependency/vulnerability alerts must be recorded separately from Dependabot
      security updates and secret-scanning controls. If the read-only vulnerability-
      alerts endpoint reports enabled at implementation time, active guidance must
      treat that as observed current state, not as a prospective held target.

