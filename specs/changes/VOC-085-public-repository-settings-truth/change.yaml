    candidate_sha: d9a8280d3da7f1c1564cf912e00e099bcc27a183
    evidence: https://github.com/KARSIFT/vocanova-platform/pull/126#issuecomment-5389072261
    evidence_contract: >-
      Exact source/API schema and endpoint interpretation, availability-versus-enabled
      distinction, dependency/vulnerability-alert versus Dependabot-security-update
      interpretation, point-in-time and staleness semantics, no-mutation boundary, and
      exact-SHA final specialist review. The final exact revision received a distinct
      non-author specialist PASS with zero blocking findings.
action_specific_holds:
  - id: VOC-085-HOLD-00
    status: held
    scope: >-
      Future mutation of GitHub repository settings, including rulesets, branch
      protection, merge-method policy, security toggles, or related hosted enforcement.
    accountable_role: explicitly assigned GitHub repository-settings operator
    required_authority: >-
      Separate explicit authority for the exact settings action from the accountable
      settings decision owner; risk class, public visibility, package adoption, and
      independent review do not satisfy it.
    required_evidence:
      - exact pre-state read-only snapshot and observation time
      - exact intended settings payload and API/UI operation
      - reversible rollback procedure and accountable rollback owner
      - immediate governed documentation follow-up plan
      - post-state read-back and exact evidence record
    completion_condition: >-
      The specifically authorized settings mutation is completed, post-state read-back
      matches the approved payload, rollback evidence is retained, and the immediate
      governed documentation follow-up is merged.
    expiry_condition: >-
      Expires without action when the explicit authorization expires or is withdrawn;
      any later settings action requires a new exact hold/evidence record.
    merge_effect: >-
      Does not block repository-only VOC-085 planning, implementation, review, or merge;
      it blocks only the external settings mutation described above.
inherited_holds:
  - id: VOC-080-HOLD-00
    status: held
    action: create-or-mutate-cloudflare-staging-resources-and-secrets
  - id: VOC-080-HOLD-01
    status: held
    action: deploy-or-route-production-traffic-or-apply-production-d1-migrations
  - id: VOC-080-HOLD-02
    status: held
    action: access-export-transform-or-delete-production-learner-data

