planned_implementation_risk_floor: >-
  R4 because the implementation updates DOC-16 and protected repository-governance
  guidance while reconciling a hosted settings boundary. It changes no setting or
  external system, but a false hosted-enforcement claim could misroute review,
  security, or release decisions.
