requirement_source: >-
  GitHub issue https://github.com/KARSIFT/vocanova-platform/issues/119, created
  2026-08-23, which reports that the repository became public while active guidance
  still described private GitHub Free limitations and the VOC-080 settings snapshot
  was being treated as current. The point-in-time read-only state was reverified
  through the GitHub REST API on 2026-08-24 before this revision was drafted.
