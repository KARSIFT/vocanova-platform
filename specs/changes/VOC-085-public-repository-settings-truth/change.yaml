schema_version: 1

id: VOC-085
slug: public-repository-settings-truth
title: Reconcile public repository settings and active guidance

type: governance-evidence-reconciliation
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 because the implementation updates DOC-16 and protected repository-governance
  guidance while reconciling a hosted settings boundary. It changes no setting or
  external system, but a false hosted-enforcement claim could misroute review,
  security, or release decisions.
canonical_path: specs/changes/VOC-085-public-repository-settings-truth
base_branch: develop
base_sha: e629693669e7c5f56c2a9d6719b66532df0f95f2
target_branch: develop
requirement_source: >-
  GitHub issue https://github.com/KARSIFT/vocanova-platform/issues/119, created
  2026-08-23, which reports that the repository became public while active guidance
  still described private GitHub Free limitations and the VOC-080 settings snapshot
  was being treated as current. The current read-only state was verified through the
  GitHub REST API before this package was drafted.
requirement_approval_status: not-approved-plan-only

authority_model: voc-079-approval-neutral-active
owners:
  decision: accountable-decision-owner-after-independent-plan-review
  package_preparation: separate planner role
  implementation: separate builders after adoption
  independent_verification: different non-author reviewer for each exact revision
  merge: separate non-author merge actor

approvals:
  requirement_direction:
    status: recorded-for-planning
    evidence: https://github.com/KARSIFT/vocanova-platform/issues/119
  package_independent_verification:
    status: pending
    candidate_sha: null
    evidence: null
  adoption_decision:
    status: pending
    candidate_sha: null
    evidence: null

approval_status: draft
implementation_authorized: false
automatic_merge_allowed: true
production_impact: none-repository-documentation-and-evidence-only
rollback_required: true
action_specific_holds: []
inherited_holds:
  - id: VOC-080-HOLD-00
    status: held
    action: create-or-mutate-cloudflare-staging-resources-and-secrets
  - id: VOC-080-HOLD-01
    status: held
    action: deploy-or-route-production-traffic-or-apply-production-d1-migrations
  - id: VOC-080-HOLD-02
    status: held
    action: access-export-transform-or-delete-production-learner-data

scope_boundary:
  settings_mutation: prohibited
  environment_mutation: prohibited
  deployment: prohibited
  cloudflare: prohibited
  sentry: prohibited
  dns: prohibited
  server_or_ssh: prohibited
  secrets_or_production_data: prohibited
  main_promotion: prohibited
  branch_deletion: prohibited
  issue_119_closure: post-merge-only

artifacts:
  readme: README.md
  specification: specification.md
  acceptance_criteria: acceptance-criteria.md
  impact_analysis: impact-analysis.md
  implementation_plan: implementation-plan.md
  tasks: tasks.md
  test_plan: test-plan.md
  release_plan: release-plan.md

dependencies:
  - id: VOC-085-DEP-00
    status: required-before-adoption
    description: >-
      The plan candidate must receive a different-actor exact-SHA independent PASS,
      and an accountable adoption decision must bind that PASS before implementation.
  - id: VOC-085-DEP-01
    status: required
    description: >-
      VOC-080's private-repository snapshot in
      docs/operations/voc-080-transition-record.{json,md} remains immutable history;
      current public state must be recorded separately and never overwrite it.
  - id: VOC-085-DEP-02
    status: required
    description: >-
      Future rulesets, security features, and other mature protections are desired
      and held only. This package and its implementation must not mutate GitHub or
      any environment setting.
  - id: VOC-085-DEP-03
    status: required
    description: >-
      Issue #119 may close only after the final implementation revision merges into
      develop and applicable post-merge checks pass; drafting or plan adoption does
      not close the issue.
