schema_version: 1

id: VOC-119
slug: foundation-f3-mutation-headroom
title: Restore foundation F3 mutation-test headroom without reducing coverage
type: required-foundation-test-performance-correction
status: draft
risk: R3
planned_implementation_risk_floor: >-
  R3 because the planned implementation changes a required foundation CI verifier.
  The automated path floor is R1, but a mistaken optimization could silently weaken
  detection of protected governance/delivery wording drift across current-truth
  surfaces. The change is intended to be one-file, repository-only, reversible, and
  coverage-preserving, with no R4 consequence if it stays within the declared
  boundary.
canonical_path: specs/changes/VOC-119-foundation-f3-mutation-headroom
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/228
