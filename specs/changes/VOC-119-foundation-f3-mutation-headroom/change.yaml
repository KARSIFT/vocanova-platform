multiple_pull_request_rationale: >-
  One implementation PR keeps the measured hotspot diagnosis, immutable test-local
  setup, semantic-preservation proof, rollback point, and exact headroom evidence in
  one required-verifier boundary. Splitting would add coordination, repeated-check,
  exact-review, and bookkeeping overhead without a releasable or rollback-safe
  intermediate state.
automatic_merge_allowed: true
production_impact: none-repository-test-only
rollback_required: true

objective: >-
  Recover reliable hosted foundation headroom by removing repeated full-aggregate
  VOC-105 evidence scans from the highest-cardinality mutation tests only where an
  immutable test-local baseline and the already exported surface-local policy checks
  preserve identical semantic coverage, diagnostics, wildcard discovery, and timeout
  boundaries.

requirements:
  - id: VOC-119-D00
    statement: >-
      Bind allocator and intake evidence on 2026-09-01. VOC-116 exists on develop as
      the current 20-minute foundation-cap policy, VOC-118 is already consumed by
      merged plan PR #224 and implementation PR #227, and no package, local/remote
      branch, or default-branch content uses VOC-119. Treat issue #228, PR #215 head
      476ac55bb5ade513916fa3aacadd8c1a2742430b, run 33527039103, job 99920414097,
      253/253 result, 1,050,570-ms validation duration, and about 69 seconds of
      hosted job headroom as defect intake only; they grant no implementation,
      review, merge, settings, dispatch, deployment, release, or live-system
      authority.
  - id: VOC-119-D01
    statement: >-
      Preserve the planning diagnosis on exact base
      e1379508621ee228ae06c88ebcad3b1b018ef4cc. Read-only profiling must remain
      truthful: a representative full mutation path averaged 56.882 ms over 20 runs,
      with inspectF3Evidence() itself averaging 55.215 ms; fixture creation,
      snapshot, mutation, and changed-path bookkeeping together averaged 1.668 ms.
      A direct inspectF3Surface() pass on a representative mutated surface averaged
      6.071 ms over 200 runs, and the `later authority claim grammar fails across
      every surface` matrix contains 6,462 mutation assertions. The inferred costs
      are about 356.8 s for repeated inspectF3Evidence() alone, 367.6 s for the
      representative full mutation path, and 39.2 s for the surface-local path.
      Those comparisons are inferences from the local averages and loop cardinality;
      do not restate them as measured post-change results.
  - id: VOC-119-D02
    statement: >-
      The planning measurements disprove "fixture copy, temp-tree creation, or test
      runner startup is the dominant cause" as the leading optimization target for
      the named hotspots. The planned implementation must therefore focus on repeated
      full-validator work inside scripts/foundation/voc105-f3-evidence-policy.test.mjs,
      not on timeout growth, workflow changes, or broad test-runner behavior.
  - id: VOC-119-D03
    statement: >-
      After this reviewed plan merges, future implementation must branch from the
      then-current exact origin/develop, record that implementation parent SHA and
      tree before editing, and may change exactly one repository path:
      scripts/foundation/voc105-f3-evidence-policy.test.mjs. Preserve
      scripts/foundation/voc105-f3-evidence-policy.mjs, package.json,
      docs/development.md, .github/workflows/ci.yml, pnpm-lock.yaml, and every other
      scripts/foundation/*.test.mjs file byte-for-byte. Use the recorded
      implementation parent, not this plan candidate SHA, for before measurements,
      path diffs, and rollback. If implementation requires a second path, a policy
      export change, a package-script change, or a workflow or timeout edit, stop
      and return to governed planning.
  - id: VOC-119-D04
    statement: >-
      Replace repeated fresh fixture-plus-inspectF3Evidence() use only in the
      high-cardinality designated-surface mutation helpers with an immutable
      canonical-source baseline and the already exported policy functions needed for
      the mutated surface. The helper must preserve the same mutation members,
      surface coverage, regex diagnostics, and fail-closed semantics. Full
      inspectF3Evidence() must remain in place wherever the assertion truly depends
      on aggregate designated-surface existence, record-level JSON structure, package
      script wiring, or cross-file invariants rather than one mutated surface.
  - id: VOC-119-D05
    statement: >-
      Preserve every current positive and negative case in the five issue-named slow
      tests and in the complete file. No mutation member, surface loop, safe clause,
      diagnostic regex, assertion count, wildcard discovery pattern, or aggregate
      test count may be removed, skipped, conditionally bypassed, or reduced. Do not
      shard the matrix across files or processes, and do not replace semantic checks
      with snapshots or hard-coded expected counts detached from the parent file.
  - id: VOC-119-D06
    statement: >-
      Preserve VOC-116's exact 20-minute hosted foundation cap and the unchanged
      pnpm run ci:foundation contract. Do not increase any timeout, add retry/repeat,
      alter node --test discovery, change CI jobs or aggregates, relax diagnostics,
      weaken regexes, add caching that can persist mutated residue across assertions,
      or broaden authority. The correction must recover headroom by reducing repeated
      immutable work only.
  - id: VOC-119-D07
    statement: >-
      Before and after implementation, capture exact named durations for the five
      issue-listed slow tests, the complete VOC-105 file result and wall duration,
      the complete foundation suite result and wall duration, and hosted foundation
      validation/job headroom on the final exact SHA. Any regression in counts,
      skipped tests, timeout growth, semantic failures, or renewed near-cap hosted
      behavior blocks merge and issue closure.
  - id: VOC-119-D08
    statement: >-
      Require exact path/preservation proof, git diff --check, governance/risk
      validation, focused VOC-105 foundation tests, the full ci:foundation command,
      and hosted required checks. Evidence must show that the changed file remains
      auto-discovered by the exact node --test scripts/foundation/*.test.mjs command
      inside ci:foundation and that no workflow or package-script edit was needed.
  - id: VOC-119-D09
    statement: >-
      Require exact-SHA independent cross-model R3 review for both the plan and the
      future implementation by a different non-author actor using a model distinct
      from the exact revision's builder. Any material edit invalidates prior review.
      A separate non-author actor performs merge. No risk label creates founder or
      standing-steward approval, and no verdict satisfies external-effect authority.
  - id: VOC-119-D10
    statement: >-
      Keep the plan and future implementation credential-free, network-free except
      for ordinary GitHub repository operations needed for the PR itself, and
      repository-only. Do not query or mutate repository settings, dispatch,
      deploy, access Cloudflare or production/learner data, change DNS or traffic,
      spend money, promote main, launch publicly, or claim issue closure before the
      final exact-SHA hosted evidence is attached.

