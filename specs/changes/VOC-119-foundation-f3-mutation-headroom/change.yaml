failing_run: https://github.com/KARSIFT/vocanova-platform/actions/runs/33527039103
failing_job: https://github.com/KARSIFT/vocanova-platform/actions/runs/33527039103/job/99920414097
failing_head_sha: 476ac55bb5ade513916fa3aacadd8c1a2742430b
base_branch: develop
base_sha: e1379508621ee228ae06c88ebcad3b1b018ef4cc
plan_branch: plan/voc-119-foundation-f3-mutation-headroom
target_branch: develop
