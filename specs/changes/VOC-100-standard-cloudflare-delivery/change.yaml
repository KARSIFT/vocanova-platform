base_sha: 2b946024cae036a494494665cd08f5243911e529
plan_branch: plan/voc-100-simplify-cloudflare-delivery
target_branch: develop
approved_candidate_sha: e5f908c88d15c41bae0f1b1306708f0df7751ae5
approval_status: adopted
implementation_authorized: true
implementation_authority_status: >-
  authorized-by-the-three-exact-candidate-reviews-and-VOC-100-ADOPT-01-for-the-
  declared-repository-only-two-PR-implementation; usable-once-this-adopted-package-
  is-on-develop-without-a-future-self-effectiveness-package; fresh-exact-bookkeeping-
  review-eligibility-and-normal-non-author-plan-merge-remain-required-process; all-
  external-actions-remain-separately-held
implementation_pull_request_count: 2
multiple_pull_request_rationale: >-
  A hard GitHub-settings action-authority and truth boundary requires the repository
  delivery-control PR to merge before the external environment/secret mutation, while
  current AGENTS.md requires an immediate documentation-only PR after that mutation.
  Both PRs remain one adopted package and task. This costs one extra branch, exact
  review, hosted-check cycle, merge, and lifecycle record once; it avoids false
  preclaims and replaces the recurring ACT-03/PR2/five-comment/token-expiry cycle for
  every later dispatch. It adds one-time elapsed time for PR2 authoring, exact review,
  hosted CI, merge queue, and lifecycle readback; that delay is accepted because the
  settings post-state cannot truthfully exist before the external action. Token/
  context, coordination, repeated-check, exact-review, bookkeeping, and elapsed-time
  overhead are lower after activation because ordinary dispatch and token rotation
  require no repository PR or plan.
automatic_merge_allowed: true
production_impact: prohibited-and-held
rollback_required: true

objective: >-
  Replace the custom five-comment Cloudflare dispatch binder with environment-scoped
  credentials, branch-bound manual dispatch, normal required checks, a small
  deterministic delivery policy, and independent credential rotation, while
  preserving staging safety and every production hold.

requirements:
  - id: VOC-100-D00
    statement: >-
      Issue 173 and chat alone granted no repository implementation. Exact candidate
      e5f908c88d15c41bae0f1b1306708f0df7751ae5 received three zero-blocker reviews
      and VOC-100-ADOPT-01. This bookkeeping revision truthfully records status
      adopted and implementation.authorized true. It does not encode authority_effective
      false, a future self-referential bookkeeping dependency, or a follow-up plan
      requirement. Fresh exact-bookkeeping review, eligibility, and normal non-author
      merge remain required process and grant no external authority.
  - id: VOC-100-D01
    statement: >-
      Preserve the merged PR-168 staging resources, hostnames, D1 identity and eeur
      placement, service binding, Free plan and zero-paid-spend ceiling, synthetic-
      only data, privacy-safe logs, ordered compatible migrations, immutable version
      upload and exact promotion, health/config/contract/web smoke, and forward-only
      D1 recovery. Preserve all production sentinels and HOLD-01/HOLD-02.
  - id: VOC-100-D02
    statement: >-
      Configure staging delivery around GitHub environment cloudflare-staging. Only
      jobs explicitly referencing that environment may read exactly environment
      secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN. Neither value may be a
      repository or organization Actions secret. The account ID is a non-sensitive
      canonical identifier and may appear in repository/evidence; its environment-
      secret name is retained only for the Wrangler interface. The API token value is
      secret and may never appear in a repository file, workflow input/output, log,
      comment, artifact, Ruflo record, or agent message. Secret-bearing preflight must
      require the account ID to equal 0a9eda28b96d77c24dcde74f3e074d47.
  - id: VOC-100-D03
    statement: >-
      The staging token is reusable across ordinary dispatches, scoped only to the
      selected account, and has exactly Workers Scripts Edit and D1 Edit. A separately
      authorized account owner creates it through the Cloudflare dashboard with an
      expiry no later than 90 days and records sanitized token-policy details proving
      the one-account resource scope, exact two permission groups, status, and expiry;
      the deployment token itself receives no API Tokens permission. The verify
      endpoint proves only status/expiry and Wrangler account readback proves only the
      selected account, so neither is misclaimed as permission-policy evidence. It has no
      DNS, billing, user, organization, Access, Pages, R2, AI, production-data, or
      unrelated-product permission. Rotation order is create, dashboard-verify,
      locally verify status/account without logging, install, run the environment-
      reviewed no-write credential check, then revoke the prior token. Roll back at
      any failure by retaining/reinstalling the prior unrevoked token and revoking the
      failed replacement. Rotate at most every 90 days and immediately on exposure,
      operator change, or scope drift. Rotation is not coupled to a PR or deployment.
  - id: VOC-100-D04
    statement: >-
      Keep workflow_dispatch as the only live delivery trigger. Staging must require
      github.actor m-e-h-r-d-a-a-d, github.ref_name develop, environment
      cloudflare-staging, the exact event SHA, successful required validation in the
      same run, cost ceiling zero, exact staging manifest/resources, and confirmation
      DEPLOY staging followed by that exact 40-character event SHA. The environment
      requires GitHub reviewer identity m-e-h-r-d-a-a-d, allows self-review because
      GitHub cannot represent the separately instantiated AI participant, and disables
      admin bypass. Only a fresh non-author AI deployment-review subagent may make the
      review decision. Its structured receipt records participant/task/model and
      coordinator-model provenance, exact run ID/attempt/SHA/environment ID and name,
      checks, PASS verdict, and no-Cloudflare-secret boundary. For agent-mediated
      dispatch its model must differ from the coordinating agent model; human-only
      dispatch records coordinator_model human-not-applicable. The reviewer receives
      no authenticated approval credential. A separately authorized approval proxy
      must post the receipt bytes unchanged as the pending-deployment approval comment
      using the operator's authenticated GitHub session and may exercise no review
      judgment. Model provenance supports attribution but grants no authority. Remove
      action-authority, ACT-03, PR2-review, binder-review, raw-body digest, nonce,
      reviewed-SHA, estimated-cost, and operator-supplied rollback-version inputs.
  - id: VOC-100-D05
    statement: >-
      Before any environment job, use the read-only GitHub token to fail unless the
      live cloudflare-staging environment exists with sole reviewer identity
      m-e-h-r-d-a-a-d, self-review allowed, admin bypass disabled, and exactly one
      custom deployment branch policy for develop. Before the first Cloudflare write,
      the first environment-job step must use only an actions-read GitHub token to GET
      the current run approval history and require exactly one matching approved
      record whose user login/numeric ID, environment ID/name, and comment exactly
      validate the AI receipt schema and current run ID/attempt/event SHA. Reject
      malformed, stale, extra, or conflicting records. Static validation must prove no
      job-level environment, expression, condition, or earlier step references either
      Cloudflare secret. Only after that receipt gate may bounded steps evaluate the
      secrets, record sanitized current API and web deployment version IDs as rollback
      targets, verify non-empty values and exact account ID, and fail on drift. Each
      Worker must have exactly one deployed UUID at 100% traffic.
      A credential-free no-help parser harness must execute the exact locked-Wrangler
      migration, deployment-status, version-promotion, and rollback argv shapes in an
      isolated CI process with outbound network denied: valid argv reaches only the
      expected missing-auth boundary, while a deliberate unknown-option control fails
      at argument parsing. Pass credentials only to the minimum individual Wrangler
      steps. Builds, tests, policy evaluation, and smoke run without credential
      exposure where possible.
  - id: VOC-100-D06
    statement: >-
      Simplify cloudflare-delivery-policy.mjs and its tests to deterministic event,
      actor, branch, environment-protection readback, confirmation, manifest,
      resource, production-hold, and zero-cost validation. No pull_request,
      pull_request_target, push, reusable-workflow, validation, build, test, smoke, or
      summary job may evaluate either Cloudflare secret or enter a secret-bearing job.
      Remove GitHub comment fetching, RFC-8785 binder
      canonicalization, URL/identity/run-suite cross-record checks, expiry coupling,
      digest validation, nonce replay state, and secret-step deadline checks that
      exist only for the superseded protocol.
  - id: VOC-100-D07
    statement: >-
      After the delivery-control PR merges, configure cloudflare-staging once under
      separately recorded settings/secret authority. Require sole reviewer identity
      m-e-h-r-d-a-a-d, allow self-review at GitHub's identity layer, disable admin
      bypass, enable custom deployment branches with exactly one branch policy named
      develop, and enter exactly the two environment secrets. The setting does not
      make the human dispatcher an authorized review decision-maker. The separate
      standing action delegation grants review judgment only to a fresh non-author AI
      subagent and grants a named approval proxy only mechanical submission of the
      exact receipt. Because the shared account can forge a syntactically valid receipt,
      that R4 action record must explicitly accept or reject this procedural-control
      residual; rejection keeps staging disabled. Sanitized pre-state, payload,
      rollback, post-state,
      reviewer/protection/branch policy, environment secret names, and absence of the
      same names from repository and organization Actions secrets must be recorded in
      one immediate documentation-only settings-truth PR authorized by this package.
      This one-time PR is not required for dispatches or token rotations.
  - id: VOC-100-D08
    statement: >-
      Retain cloudflare-production as a separate main-only environment and separate
      credential boundary. This package may document and test that design but must
      not create the environment, enter production secrets, enable the production
      manifest, dispatch production, migrate production D1, change traffic, access
      learner data, or release HOLD-01/HOLD-02.
  - id: VOC-100-D09
    statement: >-
      Update all living workflow, policy, test, manifest, settings-truth, and
      operations documents that describe the superseded protocol in the one
      ordered two-PR implementation. Preserve VOC-094 through VOC-099 and point-in-
      time VOC-080 records as immutable history; this package supplies the explicit
      prospective supersession rule.
  - id: VOC-100-D10
    statement: >-
      Obtain fresh exact-revision Cloudflare/Wrangler, security/settings, and
      independent R4 reviews for plan and implementation. Require normal hosted
      checks and a different non-author merge actor. Reviews and merge eligibility
      never authorize settings, secrets, Cloudflare, dispatch, or production.
  - id: VOC-100-D11
    statement: >-
      One task maps to exactly two ordered PRs for the recorded action/truth boundary:
      delivery control first and immediate documentation-only settings truth second.
      No package, plan, or PR is created per dispatch or token rotation. Any further
      split requires a new written hard-boundary rationale; component count, review
      convenience, token lifetime, and ordinary bookkeeping do not justify it.

