id: VOC-100
slug: standard-cloudflare-delivery
title: Standard Cloudflare Environment Delivery
type: cloudflare-delivery-control-simplification
status: adopted
risk: R4
planned_implementation_risk_floor: >-
  R4 because implementation changes the first secret-bearing Cloudflare delivery
  workflow, GitHub environment and credential policy, D1 migration and Worker
  promotion gates, production holds, canonical operations guidance, and their
  deterministic validators. Risk class creates no approval or external authority.
