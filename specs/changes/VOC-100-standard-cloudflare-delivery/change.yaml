objective: >-
  Replace the custom five-comment Cloudflare dispatch binder with environment-scoped
  credentials, branch-bound manual dispatch, normal required checks, a small
  deterministic delivery policy, and independent credential rotation, while
  preserving staging safety and every production hold.

requirements:
  - id: VOC-100-D00
    statement: >-
      Issue 173 and chat grant no repository implementation. While draft,
      implementation is prohibited. Before plan merge, exact candidate reviews and
      accountable adoption must record status adopted and implementation.authorized
      true. The adopted package must not encode authority_effective false, a future
      self-referential bookkeeping dependency, or a follow-up plan requirement.
  - id: VOC-100-D01
    statement: >-
      Preserve the merged PR-168 staging resources, hostnames, D1 identity and eeur
      placement, service binding, Free plan and zero-paid-spend ceiling, synthetic-
      only data, privacy-safe logs, ordered compatible migrations, immutable version
      upload and exact promotion, health/config/contract/web smoke, and forward-only
      D1 recovery. Preserve all production sentinels and HOLD-01/HOLD-02.
  - id: VOC-100-D02
    statement: >-
      Configure staging delivery around GitHub environment cloudflare-staging. Only
      jobs explicitly referencing that environment may read exactly environment
      secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN. Neither value may be a
      repository secret, repository file, workflow input, output, log, comment,
      artifact, Ruflo record, or agent message. The account ID must equal
      0a9eda28b96d77c24dcde74f3e074d47 at secret-bearing preflight.
  - id: VOC-100-D03
    statement: >-
      The staging token is reusable across ordinary dispatches, scoped only to the
      selected account, and has exactly Workers Scripts Edit and D1 Edit. It has no
      DNS, billing, user, organization, Access, Pages, R2, AI, production-data, or
      unrelated-product permission. Rotate at most every 90 days and immediately on
      exposure, operator change, or scope drift by entering the replacement secret
      before revoking the prior token. Token rotation is not coupled to a PR, review,
      dispatch nonce, or deployment window.
  - id: VOC-100-D04
    statement: >-
      Keep workflow_dispatch as the only live delivery trigger. Staging must require
      github.ref_name develop, environment cloudflare-staging, the exact event SHA,
      successful required validation in the same run, cost ceiling zero, exact
      staging manifest/resources, and an explicit DEPLOY staging confirmation. Remove
      action-authority, ACT-03, PR2-review, binder-review, raw-body digest, nonce,
      reviewed-SHA, estimated-cost, and operator-supplied rollback-version inputs.
  - id: VOC-100-D05
    statement: >-
      Before the first secret-bearing write, read and record sanitized current API
      and web deployment version IDs as rollback targets, verify both secrets are
      non-empty and the account ID is exact, and fail before mutation on drift. Pass
      credentials only to the minimum individual Wrangler steps. Builds, tests,
      policy evaluation, and smoke run without credential exposure where possible.
  - id: VOC-100-D06
    statement: >-
      Simplify cloudflare-delivery-policy.mjs and its tests to deterministic event,
      branch, environment, confirmation, manifest, resource, production-hold, and
      zero-cost validation. Remove GitHub comment fetching, RFC-8785 binder
      canonicalization, URL/identity/run-suite cross-record checks, expiry coupling,
      digest validation, nonce replay state, and secret-step deadline checks that
      exist only for the superseded protocol.
  - id: VOC-100-D07
    statement: >-
      Configure cloudflare-staging once, under separately recorded settings and
      secret authority, before the implementation PR's final exact-revision review.
      Restrict selected deployment branches to develop, enter exactly the two
      environment secret names, and record sanitized pre-state, payload, rollback,
      post-state, branch policy, and secret names in the same implementation PR. No
      PR2 or per-dispatch settings documentation is allowed.
  - id: VOC-100-D08
    statement: >-
      Retain cloudflare-production as a separate main-only environment and separate
      credential boundary. This package may document and test that design but must
      not create the environment, enter production secrets, enable the production
      manifest, dispatch production, migrate production D1, change traffic, access
      learner data, or release HOLD-01/HOLD-02.
  - id: VOC-100-D09
    statement: >-
      Update all living workflow, policy, test, manifest, settings-truth, and
      operations documents that describe the superseded protocol in the one
      implementation PR. Preserve VOC-094 through VOC-099 as immutable historical
      records; this package supplies the explicit prospective supersession rule.
  - id: VOC-100-D10
    statement: >-
      Obtain fresh exact-revision Cloudflare/Wrangler, security/settings, and
      independent R4 reviews for plan and implementation. Require normal hosted
      checks and a different non-author merge actor. Reviews and merge eligibility
      never authorize settings, secrets, Cloudflare, dispatch, or production.
  - id: VOC-100-D11
    statement: >-
      One implementation PR and one task contain workflow, validator, tests, living
      docs, sanitized settings readback, and rollback evidence. Any proposed split
      requires a new written hard-boundary rationale; component count, review
      convenience, token lifetime, and post-state bookkeeping do not justify it.

