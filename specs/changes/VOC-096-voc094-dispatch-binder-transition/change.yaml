  cross_record_rules:
    - >-
      Validate each fetched API envelope, raw-body contract, and selected body schema
      independently. Body schema IDs must be pairwise the four constants above.
    - >-
      Require API created_at == updated_at for every comment. Require ACT03.created_at
      < PR2.merged_at < PR2-review.created_at < authority.created_at <
      binder-review.created_at < current-run.created_at. Equality fails closed.
    - >-
      Authority API created_at is the sole issuance time. The authority body contains
      no issued_at. Require authority.created_at < authority.body.expires_at <=
      authority.created_at + 30 minutes. Require both live-check server Date values
      and their captured local completion instants strictly before expires_at.
    - >-
      Compare every later record_reference URL/digest to the already-fetched earlier
      envelope html_url/raw_body_sha256. Compare PR2, executable_digests,
      tuple_binding, and staging_assertions for deep exact equality across every body
      where present and to independently fetched repository/Cloudflare evidence.
    - >-
      Require the four actor IDs and four actor.provenance.session_reference values to
      be pairwise distinct, each role to match its record schema, each assignment
      revision to equal the reviewed PR1 or PR2 SHA applicable to that role, and every
      non-authorship flag to be true. GitHub publisher equality authenticates only the
      relay account and never satisfies actor separation.
    - >-
      hosted_checks must be sorted ascending by name using Unicode code-point order,
      have unique names, equal the required-check set fetched for PR2 merge SHA, and
      all conclude success. Any missing, duplicate, extra, pending, or stale check
      fails closed.
    - >-
      All four dispatch URL/digest inputs must equal their fetched envelopes. The
      nonce input must equal authority.body.nonce. No API envelope metadata or digest
      may be taken from a body, and no body-selected timestamp may extend authority.
  live_http_contract:
    authentication: none-no-GITHUB_TOKEN-no-Authorization-header
    redirect: error
    connect_timeout_seconds: 5
    request_timeout_seconds: 15
    response_maximum_bytes: 1000000
    per_page: 100
    run_scan_maximum_pages_per_check: 10
    checks_per_dispatch: 2
    maximum_requests_per_check: 18
    maximum_requests_per_dispatch: 36
    request_allocation_per_check:
      rate_limit_preflight: 1
      four_comment_gets: 4
      pr_metadata_get: 1
      pr_files_get_pages: 1
      current_run_get: 1
      prior_run_scan_pages: 10
    remaining_budget_rule: >-
      Before the first pass, X-RateLimit-Remaining must be at least 36; immediately
      before the second pass, it must be at least 18. Every response's GitHub Date and
      rate-limit headers must parse consistently. A missing header, lower remaining
      value, 403/429, extra page need, 1,000-result boundary, or any request beyond the
      allocation blocks before secrets. No retry occurs inside either pass.
  authority_construction_rule:
    preflight_source: unauthenticated-GitHub-API-Date-header
    body_expires_at: preflight-Date-plus-exactly-25-minutes
    maximum_preflight_to-comment_created_at_seconds: 60
    post_count: 1
    edit_count: 0
    readback: immediate
    acceptance: >-
      Fetch a successful canonical GitHub API response immediately before building the
      authority body. Set body expires_at to that response's server Date plus exactly
      25 minutes and start the one create-comment request within the same bounded
      script. After creation, fetch the comment and require preflight Date <= API
      created_at <= preflight Date + 60 seconds and created_at < expires_at <=
      created_at + 30 minutes. Any failure consumes no dispatch authority; do not edit
      the comment. Reissue requires the unchanged ACT-04 actor to create a new body
      only after current drift checks, not a new Cloudflare token by default.

