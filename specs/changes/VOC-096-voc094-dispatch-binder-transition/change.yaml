runtime_record_contract:
  api_publisher_equality: publisher_trust_root.permitted_issue_comment_publisher
  actor_provenance: >-
    Each record has a distinct governance actor ID, role, non-authorship declaration,
    and canonical provenance URL. The gate compares required distinct IDs/URLs and the
    binder reviewer attests to separation; GitHub publisher equality alone is never
    reported as proof of actor independence.
  act03:
    schema: vocanova-voc094-act03-settings-v1
    required: >-
      exact canonical URL/raw-body SHA-256, trusted API publisher, actor/provenance,
      VOC-085-HOLD-00 authority URL, PR1 merge SHA/ref, exact cloudflare-staging pre-
      and post-state, exactly CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN secret names
      with no values, token scope/expiry metadata, rollback, no production/cost drift,
      created_at=updated_at, and strict JSON with no unknown or duplicate keys
  pr2_exact_review:
    schema: vocanova-voc096-pr2-merged-sha-review-v1
    required: >-
      exact canonical URL/raw-body SHA-256, trusted API publisher, different reviewer
      actor/provenance/non-authorship, PASS/zero blockers, exact PR2 number/head/merge
      SHA/base/ref/five-file set, ACT-03 URL/digest, hosted checks, created_at=updated_at,
      and strict JSON with no unknown or duplicate keys
  act04_authority:
    schema: vocanova-voc094-act04-authority-v1
    required: >-
      exact ACT-03 and PR2-review URLs/digests, full prepared tuple, exact artifact
      hashes, one-use nonce, maximum_dispatches=1, issued_at exactly equal to the live
      authority comment created_at, expires_at no later than created_at plus 30 minutes,
      created_at=updated_at, and strict JSON with no unknown or duplicate keys
  binder_review:
    schema: vocanova-voc096-act04-binder-review-v1
    required: >-
      exact ACT-03, PR2-review, and authority URLs/digests; full prepared tuple and
      artifact hash equality; different reviewer actor/provenance/non-authorship;
      PASS/zero blockers; created_at=updated_at; and strict JSON with no unknown or
      duplicate keys

