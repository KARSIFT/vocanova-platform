runtime_record_contract:
  bundle_id: vocanova-voc096-runtime-record-contract
  bundle_version: 1
  schema_dialect: JSON-Schema-2020-12
  prepared_staging_tuple_binding:
    canonicalization: RFC-8785-JCS-of-change-yaml-prepared_staging_tuple
    sha256: 25ac2748678adb7d41c8a525bf05443154ba8ac1678ce6647a75e6ceeca45871
  manifest_binding:
    required_fields:
      - bundle_id
      - bundle_version
      - shared_definitions_sha256
      - api_envelope_schema_sha256
      - act03_body_schema_sha256
      - pr2_exact_review_body_schema_sha256
      - act04_authority_body_schema_sha256
      - binder_review_body_schema_sha256
    digest_rule: >-
      Each digest is lowercase SHA-256 of RFC-8785 JCS for the named mapping after
      removing only that mapping's schema_sha256 field. PR1 must commit the calculated
      values in both this package reconciliation and the delivery manifest; runtime
      verification recomputes and equality-checks them. No schema digest is supplied
      by workflow input or a comment body.
    executable_chain: >-
      The six contract digests are shared definitions, API envelope, and four body
      schemas. Every body schema resolves its #/$defs references from the exact shared
      definitions mapping. The PR2-review, authority, and binder-review bodies bind the
      exact delivery manifest through executable_digests.manifest_sha256; that manifest
      carries all six values. Runtime recomputes all six before body validation, then
      compares the body-bound manifest hash. No leaf schema embeds its own digest.
    shared_definitions_sha256: 3a8a53234a70ef3f36a3257f9211c804d12b6d74e21e0f662250d1e5d1e2d637
    api_envelope_schema_sha256: 5a4b65c711329b64f0c25bfdba9ea4d2fcae148b24b8b53a10ba6d7cc5c77e18
    act03_body_schema_sha256: a159b12f43941e0368fcb4a512ee9b372a7f8d078e4341c9e1957e87f5ad6923
    pr2_exact_review_body_schema_sha256: 190e752db9779a41c728747ae84e539fd1e8989e802cf819a1e6c595b6170f09
    act04_authority_body_schema_sha256: ac2815ef550b26ce23ff25ad75e310cfbc22713c14ce8f2595e7e27267c0f372
    binder_review_body_schema_sha256: c70ae327b0e547d6e46df2ebaedcf7e30ce08b10575915fe8df9bf8503be1597
  raw_body_contract:
    encoding: UTF-8-without-BOM
    minimum_bytes: 2
    maximum_bytes: 60000
    serialization: RFC-8785-JCS
    exactness: >-
      The API body string must byte-equal RFC-8785 JCS of the parsed object. Leading or
      trailing whitespace, a final newline, Unicode normalization, or any other byte
      transformation is forbidden. SHA-256 is calculated over the exact UTF-8 bytes
      returned in the fetched API body field after the response is received.
    parsing: >-
      A duplicate-key-detecting UTF-8 JSON parser must reject duplicate object member
      names before ordinary JSON parsing. Non-finite numbers, invalid Unicode/control
      characters, unknown keys, and values outside the closed schemas fail closed.
    self_reference_rule: >-
      No record body contains its own comment ID, URL, raw-body digest, created_at,
      updated_at, publisher, or author_association. Those values exist only in the API
      envelope after creation. A body may reference only already-created earlier
      records by URL and raw-body digest.
  shared_definitions:
    schema_sha256: 3a8a53234a70ef3f36a3257f9211c804d12b6d74e21e0f662250d1e5d1e2d637
    sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    git_sha:
      type: string
      pattern: "^[0-9a-f]{40}$"
    uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    rfc3339_utc_second:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$"
    canonical_comment_url:
      type: string
      pattern: "^https://github\\.com/KARSIFT/vocanova-platform/issues/158#issuecomment-[1-9][0-9]{0,19}$"
      minLength: 80
      maxLength: 120
    github_details_url:
      type: string
      pattern: "^https://github\\.com/KARSIFT/vocanova-platform/(actions/runs|pull)/[1-9][0-9]{0,19}(/job/[1-9][0-9]{0,19})?(#.*)?$"
      minLength: 55
      maxLength: 180
    record_reference:
      type: object
      additionalProperties: false
      required: [url, raw_body_sha256]
      properties:
        url:
          $ref: "#/$defs/canonical_comment_url"
        raw_body_sha256:
          $ref: "#/$defs/sha256"
    actor:
      type: object
      additionalProperties: false
      required: [actor_id, role, provenance]
      properties:
        actor_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:-]{2,127}$"
          minLength: 3
          maxLength: 128
        role:
          type: string
          enum:
            - github-settings-operator
            - merged-pr2-exact-reviewer
            - act04-accountable-actor
            - act04-binder-reviewer
        provenance:
          type: object
          additionalProperties: false
          required:
            - schema
            - participant_kind
            - assignment_scope
            - assignment_revision
            - session_reference
            - provider
            - model
            - non_authorship_of_reviewed_revision
          properties:
            schema:
              const: vocanova-voc096-actor-provenance-v1
            participant_kind:
              enum: [human, separately-instantiated-ai]
            assignment_scope:
              const: KARSIFT/vocanova-platform#158/VOC-096
            assignment_revision:
              $ref: "#/$defs/git_sha"
            session_reference:
              type: string
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{7,127}$"
