multiple_pull_request_rationale: >-
  Preserve VOC-094's hard external-settings/truth boundary. PR1 makes the repository
  prepared but dispatch-ineligible before ACT-03. ACT-03 then changes only the held
  GitHub environment/two-secret setting, and PR2 immediately reconciles exactly five
  settings documents without changing executable eligibility. Combining them would
  preclaim external post-state; moving executable binders into PR2 would violate the
  documentation-only boundary. The post-merge runtime binder supplies unknowable
  values without a third PR. The extra PR retains VOC-094's accepted coordination,
  review, elapsed-time, rollback, and truthful-state tradeoff.
automatic_merge_allowed: true
production_impact: prohibited
rollback_required: true

