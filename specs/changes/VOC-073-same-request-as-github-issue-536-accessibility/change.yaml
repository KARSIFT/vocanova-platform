planned_implementation_risk_floor: "Measured during drafting by running scripts/governance/classify-change-risk.sh\
  \ --files-from against the expected task-scoped file list (four new *-accessibility.spec.ts\
  \ files, apps/web/tests/e2e/README.md, apps/web/tests/e2e/settings-accessibility.spec.ts\
  \ after extraction, and the page/component files most likely to receive a11y fixes:\
  \ apps/web/src/app/signin/page.tsx, apps/web/src/app/page.tsx, apps/web/src/app/auth/magic/page.tsx,\
  \ apps/web/src/app/auth/magic/_components/magic-link-page-content.tsx, apps/web/src/app/(app)/settings/account/page.tsx\
  \ and its _components/): the detected path floor is R3, established by apps/web/src/app/auth/magic/page.tsx\
  \ and apps/web/src/app/auth/magic/_components/magic-link-page-content.tsx. This\
  \ package proposes R2 for the change as a whole because the work is automated accessibility\
  \ test coverage plus narrowly scoped markup/CSS/ARIA fixes for real axe-core findings\
  \ \u2014 not authentication logic, session handling, API contracts, or OAuth behavior\
  \ changes. If implementation must touch auth business logic or expands beyond a11y\
  \ remediation, the independent verifier must raise the class. This is a draft proposal\
  \ for the reviewing human at adoption time, not a determination.\n"
canonical_path: specs/changes/VOC-073-same-request-as-github-issue-536-accessibility
authority_model: a003-active
requirement_source: "GitHub issue #536 (\"Accessibility test coverage gap\"), filed\
  \ to close the gap left after VOC-031-T07b: apps/web/tests/e2e/ has dedicated axe-core\
  \ accessibility specs for discover, home, home-mobile, onboarding, progress, reviews,\
  \ and settings (top-level) but not for /signin (the highest-traffic entry page),\
  \ the root landing page (apps/web/src/app/page.tsx), /auth/magic (apps/web/src/app/auth/magic/page.tsx),\
  \ or /settings/account as its own spec file. Issue #536 requires adding signin-accessibility.spec.ts,\
  \ landing-accessibility.spec.ts, auth-magic-accessibility.spec.ts, and settings-account-accessibility.spec.ts\
  \ following the same axe-core pattern as home-accessibility.spec.ts and sibling\
  \ T07b specs (scanForAxeViolations with WCAG 2.2 AA, zero critical/serious bar,\
  \ plus assertKeyboardReachable and assertNonColorOnlyFeedback where applicable),\
  \ running them, and fixing any real findings \u2014 not assuming the pages are clean.\
  \ Note: /settings/account is already scanned inside settings-accessibility.spec.ts\
  \ from VOC-031-T07b; this package extracts that coverage into a dedicated file per\
  \ issue #536 rather than leaving it only as a second test in the settings spec.\n"
