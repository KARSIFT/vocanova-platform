objective: >-
  Make the credential-free Cloudflare delivery gate count only required-reviewer
  rules when enforcing the sole-reviewer contract, while preserving independent
  exact deployment branch-policy validation and every other fail-closed boundary.

requirements:
  - id: VOC-103-D00
    statement: >-
      Candidate e66d7a8f02fce685da5d9336d2076b2fcf0b2f2c received exact
      Cloudflare/CI-security and independent R3 PASS reviews plus VOC-103-ADOPT-01.
      This bookkeeping revision records adoption and repository implementation
      authority effective once the adopted package is on develop. It grants only the
      declared two-file repository implementation and no settings, secret,
      Cloudflare, dispatch, deployment, migration, traffic, DNS, spending,
      production, learner-data, or launch action.
  - id: VOC-103-D01
    statement: >-
      validateEnvironmentProtection must require protection_rules to be an array,
      filter it by type equal to required_reviewers, and require exactly one matching
      rule. One exact reviewer rule plus unrelated GitHub protection-rule types must
      not fail merely because the complete array contains more than one entry.
  - id: VOC-103-D02
    statement: >-
      Zero or multiple required_reviewers rules must fail closed with the existing
      sole-reviewer-rule diagnostic. The one matching rule must continue to require
      prevent_self_review false and the existing sole exact User reviewer identity.
  - id: VOC-103-D03
    statement: >-
      Preserve deployment branch-policy validation as an independent control:
      protected_branches must remain false, custom_branch_policies true, and the
      separately decoded branch-policies response must continue to contain exactly
      one develop policy under the existing validator contract. Do not add, remove,
      or infer branch-policy criteria from protection-rule counting.
  - id: VOC-103-D04
    statement: >-
      Add focused tests for the live response shape containing one exact reviewer
      rule plus one branch_policy rule, unrelated-rule tolerance, zero and multiple
      reviewer rules, retained exact reviewer validation, and independently failing
      branch-policy configuration. Tests must exercise the exported evaluator rather
      than duplicate its implementation.
  - id: VOC-103-D05
    statement: >-
      Preserve every response-decoding, event, actor, ref, SHA, confirmation,
      same-run check, environment identity, reviewer identity, branch-policy, cost,
      secret-isolation, staging, and production control outside this rule-counting
      defect. Do not edit workflows, manifests, runbooks, settings truth, application
      code, or any historical change package.
  - id: VOC-103-D06
    statement: >-
      Use one minimum-sufficient task and one coherent implementation pull request.
      Plan and implementation each require applicable deterministic checks, fresh
      exact-revision Cloudflare/CI-security specialist review, independent R3
      verification by distinct non-author actors, and merge by a separate non-author
      actor. No risk label creates standing founder or technical-steward approval.

