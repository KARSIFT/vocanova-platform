  launch, and VOC-080-HOLD-01/HOLD-02 boundaries.

requirements:
  - id: VOC-105-D00
    statement: >-
      Add a current structured F3 evidence record that keeps milestone-gate decision
      separate from the successful delivery event and marks F3 complete-effective only
      after validating every DOC-12 gate item; otherwise it remains partial/pending with
      a missing-evidence reason.
  - id: VOC-105-D01
    statement: >-
      Reconcile docs/README.md, docs/product/README.md,
      docs/product/12-mvp-implementation-plan.md, docs/operations/README.md,
      docs/operations/voc-081-f2-evidence.md and .json, and
      docs/operations/cloudflare-delivery.md with the current evidence-bound F3 state.
      Preserve A1/P1+, production, launch, learner-data, and inherited hold boundaries;
      defer A1 intake to a separate future package.
  - id: VOC-105-D02
    statement: >-
      Preserve VOC-094 through VOC-104 packages and historical evidence unchanged.
      Explain that later exact evidence supersedes prospective pending language without
      rewriting historical snapshots or exposing secrets or immutable Worker IDs.
  - id: VOC-105-D03
    statement: >-
      Add a network-free voc105 F3 evidence validator and focused positive/negative
      tests, and include its command exactly once in ci:foundation. Fail closed on
      wrong or missing identifiers, failed/skipped required evidence, stale active
      wording, later-milestone claims, hold release, or prohibited disclosure.
  - id: VOC-105-D04
    statement: >-
      Use one minimum-sufficient task and one coherent repository-only implementation
      PR. Do not dispatch, deploy, query or mutate Cloudflare/GitHub settings, handle
      secret values, change DNS/traffic, access production or learner data, spend,
      promote main, or claim to satisfy or close issue #189; the issue's separate A1
      planning outcome remains outside this package.
  - id: VOC-105-D05
    statement: >-
      Obtain distinct canonical-documentation/milestone-evidence specialist and
      independent exact-SHA R4 PASS reviews from non-authors, resolve blockers with
      fresh checks, and merge only through a separate non-author actor. No risk label
      creates standing founder or technical-steward approval.

