title: Restore foundation CI timeout headroom
type: ci-reliability-correction
status: adopted
risk: R3
planned_implementation_risk_floor: >-
  R3 because .github/workflows/ci.yml is protected CI/CD behavior and the correction
  changes how long a required job may run. The change is bounded, repository-only,
  credential-free, and preserves every validation and fail-closed aggregate.
