implementation_pull_request_count: 1
implementation_pull_request: pending-after-adoption
multiple_pull_request_rationale: >-
  One implementation PR is the minimum coherent boundary. The workflow value,
  validator, focused regression tests, and three living descriptions must agree in one
  revision. Splitting them creates an unenforced or falsely documented intermediate
  state and adds coordination, repeated-check, exact-review, and bookkeeping overhead.
automatic_merge_allowed: true
production_impact: none-repository-ci-only
rollback_required: true

objective: >-
  Give the complete current 204-test foundation suite a measured, exact, bounded
  20-minute hosted job budget without changing its work or weakening the fail-closed
  required aggregate.

requirements:
  - id: VOC-116-D00
    statement: >-
      Treat issue #218 and its exact PR, merge, local, and hosted-run evidence as defect
      intake only. Preserve superseded candidate cdc3d58/tree d689d09, its specialist
      PASS, and independent FAIL as nontransferable history. The issue, runs, prior
      verdicts, and draft package grant no implementation, approval, merge, settings,
      dispatch, deployment, release, or live authority.
  - id: VOC-116-D01
    statement: >-
      Change only the CI foundation job timeout from exactly 15 to exactly 20 minutes.
      Twenty minutes is a hard upper bound, not a target duration: five minutes and
      33.3 percent above the old budget, 5m27s above the observed completed 14m33s job,
      and 4m44s above the canceled job's 15m16s lifecycle. No other job timeout changes.
  - id: VOC-116-D02
    statement: >-
      Preserve the exact pnpm run ci:foundation command, its ordered fail-fast chain,
      wildcard discovery of all scripts/foundation/*.test.mjs tests, the current 204-test
      corpus, frozen setup/install behavior, triggers, permissions, concurrency, and all
      other CI job semantics. Do not skip, shard, parallelize, retry, reorder, or weaken
      a command, test, assertion, failure, or cancellation.
  - id: VOC-116-D03
    statement: >-
      Extend the existing network-free workflow policy so ci.yml passes only when the
      uniquely named foundation job has timeout-minutes integer 20. Reject the former
      15, any lower or higher value including 19, 21, and 30, missing/duplicate
      foundation jobs, duplicate timeout keys, noninteger/string/expression values,
      and placement of 20 on a different job.
  - id: VOC-116-D04
    statement: >-
      Preserve ci required with if always(), its dependency on foundation and every
      current subsystem, and require-successful-jobs.sh semantics: foundation success
      may pass, while failure, cancelled, skipped, or missing/unknown never passes.
  - id: VOC-116-D05
    statement: >-
      Update exactly .github/README.md, docs/operations/11-devops-and-ci-cd.md, and
      docs/development.md to state the exact 20-minute foundation cap, measured reason,
      full-suite/no-weakening boundary, aggregate behavior, reproduction, and bounded
      troubleshooting. Do not change any other living or historical document.
  - id: VOC-116-D06
    statement: >-
      Implement in exactly six paths: .github/workflows/ci.yml, the workflow-policy
      validator/test, and the three named living documents. The foundation test glob
      already discovers the focused test; package.json and dependency files remain
      unchanged. Any disproved inventory assumption stops implementation for planning.
  - id: VOC-116-D07
    statement: >-
      Require focused positive/negative validator fixtures, aggregate negatives for
      failure/cancelled/skipped/missing, the complete 204-test foundation run, full
      pnpm validate, governance/risk/diff/format checks, hosted CI/Governance/Security,
      exact path/SHA evidence, and independent exact-revision cross-model R3 PASS by a
      distinct non-author actor whose recorded model is distinct from the implementation
      builder's recorded model. This plan candidate independently requires the same
      distinct-actor/distinct-model exact-revision PASS before adoption; neither review
      transfers across candidates or from plan to implementation.
  - id: VOC-116-D08
    statement: >-
      Roll back by reverting the one coherent implementation commit/PR to restore the
      prior exact six-path state and 15-minute cap; do not weaken tests to make rollback
      green. A recurrence at the restored cap is expected and must remain visible.
  - id: VOC-116-D09
    statement: >-
      Under DOC-15 section 24.18, the adoption-recorded owner monitors the implementation
      PR and exact merge-SHA push run. Success requires foundation and ci required PASS,
      all 204 tests reported, job lifecycle below 20 minutes, unchanged six-path scope,
      and no timeout cancellation. Failure stops issue closure and routes a new bug or
      governed correction; do not repeatedly raise the cap without new measurements.
  - id: VOC-116-D10
    statement: >-
      Perform no application/runtime/product/API/database behavior, dependency, GitHub
      settings, secret, environment, Cloudflare, dispatch/deployment, migration,
      production/data, DNS/traffic, spending, release, main-promotion, or launch action.
  - id: VOC-116-D11
    statement: >-
      Apply DOC-16 self-modification safety. The sole privilege expansion is bounded to
      at most five additional minutes of GitHub-hosted foundation runner execution and
      corresponding validation-feedback delay, from 15 to 20 minutes. No permission,
      trigger, event, secret, credential, write, checkout, cache, action, runner class,
      concurrency, artifact, environment, deploy, dispatch, merge, release, or live
      authority expands. Any broader diff stops implementation and returns to planning.
  - id: VOC-116-D12
    statement: >-
      Preserve every pre-existing workflow-policy protection until the additive exact
      20-minute invariant is proven. Inventory the parent validator errors and focused
      tests; run each existing positive/negative protection unchanged in effect against
      the proposed workflow, then prove the new timeout matrix. Never delete, bypass,
      relax, reorder out, or temporarily disable an existing protection. The final
      implementation revision atomically contains preserved protections, the new
      invariant, its tests, and the workflow value; replacement must not authorize itself
      through a weakened intermediate state.

