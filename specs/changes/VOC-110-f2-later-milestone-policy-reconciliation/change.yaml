id: VOC-110
slug: f2-later-milestone-policy-reconciliation
title: Separate immutable F2 evidence from current later-milestone pointers
type: foundation-policy-defect-remediation
status: draft
risk: R3
planned_implementation_risk_floor: >-
  R3 because the change modifies a fail-closed foundation validator that protects
  accepted F2 evidence and current milestone boundaries. It does not decide or record
  F3, weaken VOC-105's separate R4 evidence validator, change workflow or merge
  authority, or authorize a live action, so R4 is not triggered.
canonical_path: specs/changes/VOC-110-f2-later-milestone-policy-reconciliation
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/203
related_adopted_packages:
  - VOC-105
  - VOC-109
base_branch: develop
base_sha: 309f1058baa041f7915fb334148d7d5b3d9b3c14
plan_branch: plan/voc-110-f2-later-milestone-policy-reconciliation
target_branch: develop
approval_status: not-approved
implementation_authorized: false
implementation_authority_status: >-
  not-authorized-until-this-exact-package-receives-distinct-foundation-policy-
  specialist-review-independent-cross-model-R3-review-accountable-adoption-and-
  normal-non-author-plan-merge; issue-203-and-adopted-VOC-105-or-VOC-109-do-not-
  authorize-these-validator-edits
implementation_pull_request_count: 1
multiple_pull_request_rationale: >-
  One repository-only validator correction keeps immutable-F2 protection, the exact
  pre-F3 and VOC-105 current-state profiles, all negative fixtures, regression checks,
  and one rollback point atomic. Splitting the validator from its focused proof would
  expose an unproved fail-open or fail-closed state and duplicate branch, review,
  exact-SHA, coordination, elapsed-time, repeated-check, and bookkeeping overhead.
automatic_merge_allowed: true
production_impact: prohibited-and-held
rollback_required: true

objective: >-
  Reconcile the active VOC-081 validator so immutable F2 facts and historical
  candidate evidence remain exact while living later-milestone pointers may move
  atomically from the current pre-F3 profile to the exact adopted VOC-105 F3
  complete-effective, A1/P1+-pending, HOLD-01/HOLD-02-held profile.

requirements:
  - id: VOC-110-D00
    statement: >-
      Treat issue #203 as defect intake and reproduction evidence only. Bind exact
      develop SHA 309f1058baa041f7915fb334148d7d5b3d9b3c14, the passing current
      validator/focused tests, and the preserved VOC-105 candidate's nonempty
      rejection. No implementation begins until this package is independently
      reviewed, adopted, and merged to develop.
  - id: VOC-110-D01
    statement: >-
      Preserve every immutable VOC-081 F2 record fact and historical candidate fact:
      schema and dates; package, task, revision, PR, review, hosted and rollback
      identifiers; workflow inventory; local contract; exact task sequence; validated
      commands; repository integration and rollback evidence; external-effects false
      fields; F2 complete-effective status; and candidate-era pending history. Preserve
      all false-F2, history-as-current, missing-surface, malformed-record, and external-
      effect negatives.
  - id: VOC-110-D02
    statement: >-
      Separate immutable F2 assertions from current later-milestone assertions and
      accept exactly two atomic repository profiles during the dependency transition:
      the exact current pre-VOC-105 profile, or the exact adopted VOC-105 profile.
      The latter requires f3_staging complete-effective-under-voc-105-evidence,
      f3_current_evidence docs/operations/voc-105-f3-evidence.json, A1 and P1+
      unresolved, production held, live activation unresolved-held, exactly
      VOC-080-HOLD-01 and VOC-080-HOLD-02, and matching exact current markers across
      every existing designated F2 surface. It must not treat the F2 record itself as
      F3 decision evidence or duplicate VOC-105's separate R4 validator.
  - id: VOC-110-D03
    statement: >-
      Fail closed one invariant at a time on mixed pre-F3/F3 profiles; missing, extra,
      or wrong current-state keys and values; missing or wrong VOC-105
      evidence pointer; an unbounded/generic F3 or staging claim; false A1, P1-P5, R1,
      R2, L1, product, production-readiness/traffic, learner-data, public-launch,
      deployment, or live-activation claims; release or omission of HOLD-01 or HOLD-02;
      stale F2-pending text outside history; current/history conflation; malformed JSON;
      missing designated surfaces; or any F2 external-effect field changed from false.
      Diagnostics must identify the violated profile or invariant without shell or
      network execution.
  - id: VOC-110-D04
    statement: >-
      Preserve the complete adopted-and-implemented VOC-109 foundation-chain contract
      and focused matrix unchanged in effect: exact eight-segment prefix, exact F2
      command and entry point, sole extension slot, exact terminal test, zero/one/two
      extension positives including the exact VOC-105 pair, and every omission,
      duplication, order, name, entry-point, alias, collision, placement, malformed-
      input, and shell-control negative.
  - id: VOC-110-D05
    statement: >-
      Implement one minimum-sufficient repository-only PR changing exactly
      scripts/foundation/voc081-f2-evidence-policy.mjs and
      scripts/foundation/voc081-f2-evidence-policy.test.mjs. Do not edit package.json,
      documentation, F2/F3 evidence, change-package history, workflows, application or
      runtime code, settings/secrets, resources, dispatch/deployment, D1, traffic/DNS,
      production or learner data, spending, or launch state.
  - id: VOC-110-D06
    statement: >-
      Require deterministic focused/foundation/workspace/governance evidence, exact-SHA
      foundation-policy/CI-integrity specialist review, and separate independent
      cross-model R3 verification by distinct non-authors. Resolve every blocker on a
      new SHA with fresh checks and review; require a separate non-author merge actor.
  - id: VOC-110-D07
    statement: >-
      Completion only removes the active F2-validator prerequisite for unchanged
      adopted VOC-105. A different VOC-105 builder must refresh the preserved
      candidate on corrected develop and obtain VOC-105's own R4 validator, evidence,
      specialist, independent-review, merge, and closure proof. VOC-110 does not
      implement, amend, adopt, review, merge, or close VOC-105.
  - id: VOC-110-D08
    statement: >-
      The accountable VOC-110 repository change owner recorded at adoption owns a
      bounded observation period from implementation merge through the first refreshed
      real VOC-105 candidate's focused VOC-081 and VOC-105 validators, ci:foundation,
      and hosted required-check results, or through a recorded governed VOC-105
      abandonment or supersession. Exact-profile rejection, hybrid/false-profile
      acceptance, F2 regression, or VOC-109 extension regression stops VOC-105 merge
      and VOC-110 closure and requires linked failure evidence plus separately governed
      remediation or dependency-ordered revert.

