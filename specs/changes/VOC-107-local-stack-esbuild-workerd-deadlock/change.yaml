multiple_pull_request_rationale: >-
  One diagnosis-to-remediation task and one implementation PR keep the observed
  lifecycle evidence, any minimal source/dependency change, regression coverage,
  validation, and rollback point atomic. Splitting diagnosis from remediation would
  leave a known flaky required gate without its proven correction and add an extra
  branch, review, exact-SHA, coordination, elapsed-time, repeated-check, and
  bookkeeping cycle without a releasable or rollback-safe boundary.
automatic_merge_allowed: true
production_impact: prohibited-and-held
rollback_required: true

objective: >-
  Reproduce and diagnose the intermittent local-only esbuild/workerd deadlock seen
  in the required local-stack job, then make the smallest evidence-supported,
  deterministic repository-only remediation with regression coverage while retaining
  fail-closed diagnostics and every local-stack safety boundary.

requirements:
  - id: VOC-107-D00
    statement: >-
      Treat issue #194 and CI run 33406243445 as symptom evidence only. Preserve the
      exact event SHA, runner/toolchain facts, second-cycle timing, API-process log,
      and passing sibling jobs, but do not assert an upstream, application, shutdown,
      port, service-binding, or dependency root cause until reproducible evidence
      distinguishes it.
  - id: VOC-107-D01
    statement: >-
      Before editing runtime behavior, inventory the exact local-stack command graph,
      process ownership and shutdown/stdio order, pinned Wrangler/esbuild/OpenNext
      dependency chain, configuration/arguments, and relevant current tests. Run
      bounded, credential-free diagnosis attempts against a clean checkout and record
      redacted command, revision, Node/pnpm/Wrangler versions, attempt/cycle/stage,
      exit/signal, timing, and bounded diagnostic classification. Do not commit raw
      transient logs, secrets, local state, or generated build output.
  - id: VOC-107-D02
    statement: >-
      Select a remediation only after the inventory produces a causal or tightly
      bounded triggering condition. It may alter only the proven causal source,
      lifecycle/test harness, and—if a pinned tool defect is demonstrated—the minimal
      package manifests and lockfile needed to pin a verified compatible version.
      It must not solve the failure by ignoring, allowlisting, retrying, or converting
      unexpected esbuild/workerd fatal diagnostics into success.
  - id: VOC-107-D03
    statement: >-
      Preserve the disposable OS-temporary D1 root, loopback-only fixed topology,
      credential stripping/no remote mode, exact service-binding probe, two-cycle
      persistence proof, bounded readiness/preparation/migration/cleanup, process and
      stdio settlement, repository-tree cleanliness, and fail-closed workerd output
      classification. Existing exact bind-collision retry limits remain unchanged
      unless the diagnosis proves a narrower lifecycle correction is required.
  - id: VOC-107-D04
    statement: >-
      Add deterministic regression coverage for the proven causal condition and the
      observed fatal-deadlock diagnostic. The regression must fail before the chosen
      remediation and pass afterwards without masking a child failure. If the hosted
      race cannot be made deterministic, retain a deterministic harness for the
      identified lifecycle/diagnostic invariant and require bounded repeated real
      local-stack runs plus hosted CI evidence; do not claim root-cause remediation
      until that evidence is available.
  - id: VOC-107-D05
    statement: >-
      Keep the implementation to one minimum-sufficient repository-only PR. Do not
      change workflow definitions, GitHub settings/secrets, Cloudflare configuration
      or APIs, dispatch/deploy, D1 migration, traffic/DNS, production or learner
      data, spending, launch state, product behavior, or historical packages. Do not
      close issue #194 until the merged exact implementation has its required
      validation and hosted evidence.
  - id: VOC-107-D06
    statement: >-
      Plan and implementation require applicable deterministic checks, an exact-SHA
      CI/local-runtime specialist review, independent R3 verification by distinct
      non-author actors, resolved blockers, and merge by a separate non-author actor.
      No risk label creates standing founder or technical-steward approval.

