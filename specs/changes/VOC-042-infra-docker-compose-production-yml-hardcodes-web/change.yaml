planned_implementation_risk_floor: Not yet computed by running scripts/governance/classify-change-risk.sh
  against a real file set - each task (T00-T01 below) needs its own approved, task-scoped
  file list before the classifier means anything, consistent with how VOC-039/VOC-040/VOC-041
  handled this field. This package proposes R3 for the change as a whole because it
  directly touches infra/docker-compose.production.yml, production infrastructure
  configuration that sets the server-side value apps/web/src/middleware.ts depends
  on for every protected route's auth check - docs/governance/change-risk-classification.md
