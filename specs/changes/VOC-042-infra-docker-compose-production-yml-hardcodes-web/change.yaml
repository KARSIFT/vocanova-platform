  web''s API_BASE_URL without the required :8443 port, still breaking real Google
  sign-in after VOC-041"), including its full body (the only content on the issue
  at drafting time - no comments existed yet). The issue documents a direct live reproduction
  against the production host (a direct SSH docker exec confirming the running container''s
  actual environment, nginx access logs from a real sign-in attempt, and a read of
  apps/web/src/lib/env.ts''s getApiBaseURL()) and names its own suggested fix (append
  :8443 to API_BASE_URL in the web service, matching VOC-041''s correction to the
  API service''s own env values).'
