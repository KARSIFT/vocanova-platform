dependencies:
- id: VOC-033-DEP-00
  status: resolved at draft time (2026-07-30, confirmed by direct repository inspection
    at base_sha) -- VOC-032-T06's Atlas tooling (apps/api/atlas.hcl, apps/api/scripts/migrate.sh,
    apps/api/migrations/atlas.sum, apps/api/migrations/atlas_tooling_test.go) is already
    merged to develop. This package amends only the *.sql content the tooling applies
    and the atlas.sum hash the tooling checks, never the tooling itself.
- id: VOC-033-DEP-01
  status: open for VOC-033-T02 only, not for VOC-033-T00/T01 -- the disposable-PostgreSQL
    integration test needs Docker and outbound network access to release.ariga.io
    to fetch the pinned Atlas v1.2.0 binary in whatever environment runs it. Both
    were confirmed present in this planning environment and used to verify the fix
    end to end before this package was drafted (see impact-analysis.md), but neither
    is guaranteed on every future CI runner tier, since no workflow file in this package's
    scope installs Atlas or provisions a Postgres service container. The implementer
    runs T02 locally (or on any runner with Docker) as evidence; the test is import-tag-gated
    so its absence from a bare runner never fails the ordinary `go test ./...` path.
- id: VOC-033-DEP-02
  status: resolved at adoption (2026-07-30) -- founder-gate inspection of authenticated
    run 30555539008 confirms the deploy reached Atlas on the real staging host and
    failed specifically on unknown txmode "transaction" in
    20260724210000_identity_foundation.sql. VOC-032-DEP-00 is resolved: the dedicated
    Actions SSH credentials work and the private PostgreSQL container is healthy.
    VOC-032-DEP-01 is also resolved: both staging DNS records are proxied through
    Cloudflare and the matching Cloudflare Origin Certificate is installed. The
    remaining 521 response is expected until this migration repair permits the
    application and nginx services to start.
