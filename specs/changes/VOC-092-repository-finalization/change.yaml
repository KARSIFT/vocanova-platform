action_specific_authority:
  required: true
  authorization_status: >-
    directly-directed-by-repository-owner-operator-and-bound-by-exact-adoption-decision-
    pending-plan-bookkeeping-review-eligible-merge-postmerge-and-fresh-action-evidence
  source: >-
    Repository owner/operator @m-e-h-r-d-a-a-d directly instructed completion of
    promotion and stale-branch cleanup in the operator session on 2026-08-25
    Asia/Tehran (2026-08-24 UTC GitHub record). Issue #151 canonicalizes that direction
    for repository planning/evidence but does not itself create action authority. The
    exact plan adoption decision must explicitly bind each action below; package review
    and R4 classification do not replace the direct operator authority.
  actions:
    - id: VOC-092-AUTH-SETTINGS-00
      action: PATCH repository delete_branch_on_merge from false to true
      accountable_role: GitHub-repository-settings-operator-m-e-h-r-d-a-a-d
      required_evidence: >-
        adopted exact plan, pre-state read, intended one-field payload, rollback
        payload, immediate governed documentation reconciliation, and post-state read
      completion_condition: >-
        live API read returns true and the exact settings-record implementation
        revision is independently reviewed and merged through normal pull requests
      expiry_condition: >-
        expires at issue #151 closure, operator withdrawal, intended payload drift, or
        any scope expansion; any later settings action needs fresh exact authority
    - id: VOC-092-AUTH-REMOTE-CLEANUP-00
      action: delete exact freshly frozen merged-only non-permanent remote branch refs
      accountable_role: repository-owner-operator-m-e-h-r-d-a-a-d
      required_evidence: >-
        canonical manifest mapping every branch to exact tip and merged pull request,
        no open pull request, reachability or merged-PR recovery proof, and explicit
        exclusion of main and develop
      completion_condition: >-
        post-action read shows only permanent or demonstrably active/recovery remote
        branches and every deleted ref remains recreatable from its recorded SHA
      expiry_condition: >-
        manifest expires on any target ref movement, new open PR, protection/default
        change, operator withdrawal, or issue #151 closure
    - id: VOC-092-AUTH-LOCAL-CLEANUP-00
      action: remove exact clean disposable auxiliary local worktrees and merged branches
      accountable_role: repository-owner-operator-m-e-h-r-d-a-a-d
      required_evidence: >-
        immediately preceding clean-status read, no unique unpreserved commit or
        staged/untracked content, exact path/ref list, and preserved recovery record
      completion_condition: >-
        post-action audit lists only primary or explicitly retained dirty/unique local
        state; no force removal is used for a dirty worktree
      expiry_condition: >-
        each target's proof expires on status, HEAD, worktree registration, process,
        or ownership drift and must be refreshed immediately before removal

