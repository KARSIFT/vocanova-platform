dependencies:
  - id: VOC-079-DEP-00
    status: >-
      Open. The exact transition revision needs the one final founder approval required
      by the governance effective before it. That authority is exhausted when this
      package lands and cannot approve later R4 work.
  - id: VOC-079-DEP-01
    status: >-
      Open. VOC-078 must retire the KARSIFT/karsift-ai-infra merge-gate invocation
      before VOC-079 activates. VOC-079-T01 then introduces the repository-owned,
      provider-neutral eligibility evaluator that replaces its policy-decision role.
      The evaluator is read-only and does not perform merges. This repository must not
      claim R4 is approval-neutral while an active called workflow still enforces the
      opposite.
  - id: VOC-079-DEP-02
    status: >-
      Open. Adoption must name the independent verifier and decide whether the
      implementation lands as one reconciliation PR or as ordered task PRs. Builder
      and verifier must remain different roles and exact revisions must be recorded.
