dependencies:
  - id: VOC-079-DEP-00
    status: >-
      Resolved for package adoption. Founder approval of exact candidate
      25a3e246b8f66dd4b92ea9726eb5367c16363018 is recorded on PR #75. The
      approval is limited to this package candidate, is exhausted when the transition
      lands, and cannot approve later R4 work or the eventual implementation revision.
  - id: VOC-079-DEP-01
    status: >-
      Open. VOC-078 must retire the KARSIFT/karsift-ai-infra merge-gate invocation
      before VOC-079 activates. VOC-079-T01 then introduces the repository-owned,
      provider-neutral eligibility evaluator that replaces its policy-decision role.
      The evaluator is read-only and does not perform merges. This repository must not
      claim R4 is approval-neutral while an active called workflow still enforces the
      opposite.
  - id: VOC-079-DEP-02
    status: >-
      Resolved at adoption. Codex is assigned as implementation coordinator, Claude
      Code is the independent exact-revision verifier, and T00 through T03 land as
      ordered, separately evidenced task changes. Builder and verifier remain different
      roles; any verifier-authored material correction requires fresh independent review.
