id: VOC-079
slug: r4-approval-neutral
title: Make R4 approval-neutral and verification-driven

type: governance-authority-transition
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 because this package changes consequential governance, approval boundaries,
  automatic-merge authority, and autonomous-system authority. It also touches paths
  with explicit R4 floors. The transition must be evaluated under the authority in
  force before it and cannot authorize its own adoption.
canonical_path: specs/changes/VOC-079-r4-approval-neutral
authority_model: a003-active-before-transition
requirement_source: >-
  GitHub issue #74 and the founder's 2026-08-19 request to stop asking for approval
  solely because a change is R4 and to make R4 operate like the other risk classes.
  The request is planning input until this exact package revision is adopted through
  the canonical GitHub record.
requirement_approval_status: pending-exact-revision-adoption
