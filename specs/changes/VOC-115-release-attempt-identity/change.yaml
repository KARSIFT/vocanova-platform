multiple_pull_request_rationale: >-
  One corrected revision of draft PR #215 is the minimum coherent boundary. Its seven
  living and nine VOC-106 paths, nine VOC-114 artifacts, and validator/test must agree.
  Splitting the 27 paths would publish contradictory or unenforced lifecycle rules and
  add coordination, context, repeated-check, exact-review, and bookkeeping overhead.
  The held ruleset is a separately authorized settings prerequisite, not a second
  implementation PR or authority granted by this package.
automatic_merge_allowed: true
production_impact: none-repository-policy-validation-and-release-preparation-only
rollback_required: true

objective: >-
  Replace unsafe SHA-only/comment/caller allocation with deterministic target-level
  claim coalescence, SHA-bound attempts, a protected one-shot submit award, a held
  server-enforced ref-immutability prerequisite, exact stable-state reconstruction,
  stale/cardinality/provenance semantics, actor/topology/rollback controls, and no
  implementation-time live action.

requirements:
  - id: VOC-115-D00
    statement: >-
      Treat issue #216, PR #215 specialist FAIL, and all ten exact PR #217 candidate
      FAIL reviews as intake. Preserve all five candidate SHAs/trees as superseded evidence
      with no transfer. PR #215 stays draft. None grants plan adoption, implementation,
      ref/settings, release, merge, deployment, or external authority.
  - id: VOC-115-D01
    statement: >-
      Use exactly release/voc-106-claim-genesis, release/voc-106-claim-after-pr-<prior-
      PR-number>, or release/voc-106-claim-after-conflict-<SHA256-of-sorted-matching-
      PR-numbers> as the deterministic current frontier; use the full-SHA attempt forms
      and allocation-digest submit form. Freeze every exact branch/full-ref length,
      accepting the 144/155-byte conflict attempt and rejecting max-plus-one without
      truncation. Define canonical numeric/digest/ASCII/ref domains and exhaustion.
  - id: VOC-115-D02
    statement: >-
      Hold VOC-106 until a separately authorized settings action installs and reads back
      an active GitHub ruleset matching only claim/attempt/submit patterns, allowing creation
      while denying update/non-fast-forward/force/deletion with empty bypass including
      administrators. Record exact ids/version/patterns/rules/enforcement/digest. VOC-115
      implementation neither queries nor changes settings; unavailable capability holds.
  - id: VOC-115-D03
    statement: >-
      Each contender POST-creates the same deterministic claim ref directly at frozen
      develop. Atomic creation selects a target, not caller. Same-target duplicate/
      replayed requests are one logical claim and claim/attempt operations coalesce;
      different target loses. Exact readback classifies state. Stable absence permits
      the same canonical claim/attempt request without a client retry counter; never
      mutate/delete.
  - id: VOC-115-D04
    statement: >-
      Immediately after accepted claim and before attempt ref, freshly validate protected
      main/develop SHA/tree and ruleset against frozen state. Exact equality proceeds.
      Any drift is permanent stale-protected-topology, creates no attempt/PR, derives no
      successor, and irrecoverably stops pending governed correction. Different-SHA
      contention does not promise a usable winner. Accepted-ref disappearance under
      authorized actions is excluded by the verified ruleset; unauthorized settings
      mutation/control-plane failure is explicitly outside the guarantee.
  - id: VOC-115-D05
    statement: >-
      Freeze exact lossless JSON primitive domains and own-key/type/null/event schemas
      for all-PR boundary, reserved-PR detail, timeline, ref, git-commit/tree, protected-
      ref, ruleset, page/object/scan capture, stable-state, and reconciliation objects.
      All-PR boundaries allow foreign/null head identity; filter only after exhaustive
      enumeration. Reserved detail requires exact nonnull canonical repository and
      label. A reserved-looking null repository is ambiguous and stops; label/timeline
      evidence cannot infer its former repository. Parse raw UTF-8 losslessly. Capture-
      specific values are not stable-state equality.
  - id: VOC-115-D06
    statement: >-
      Define exact complete-pass algorithm: exact all-state PR query and numbered short-
      page termination, complete reserved timelines, dual equal release-ref sets, ruleset
      and protected refs, full-repository PR boundary before local filtering, counts and
      high-watermarks. Construct timestamp-free voc-106-stable-state-v1 JCS. Require two
      byte-identical stable states, retry at most three pairs, then stop. Later actors
      reproduce stable-state digest when state is unchanged, not capture timestamps.
  - id: VOC-115-D07
    statement: >-
      Name the attempt ref with full frozen-develop SHA and frontier suffix, POST-create
      at exact frozen develop, and coalesce canonical state-idempotent calls. Create the
      protected allocation-digest submit marker. Only the exact invocation receiving
      and validating its 201 response receives a nontransferable award to send one exact
      reconstructible draft PR request with client retries zero and redirects disabled;
      binder excludes capture time and unrelated PR boundaries. A 422/timeout/readback,
      crash, lost award, or marker-present zero PR never authorizes POST/retry/successor
      and is an irrecoverable hold. One PR consumes the award; multiple enter cleanup.
      Freeze every claim/attempt/submit/PR/binder/closure crash outcome and never reopen.
  - id: VOC-115-D08
    statement: >-
      Map mutation actor /root exactly to GitHub login m-e-h-r-d-a-a-d, numeric id
      7955432, and node id MDQ6VXNlcjc5NTU0MzI=. Delegated agents/reviewers have no
      GitHub mutation authority. No current handoff exists. A future handoff requires
      separately adopted actor/login/id/node-id mapping, durable PR assignment by the
      current owner, and reconstructed receipts; it transfers preparation only.
  - id: VOC-115-D09
    statement: >-
      Same-develop retry requires the earlier closed-unmerged durable PR, the consumed
      one-shot submit award, and immutable protected claim/attempt/submit refs, then a
      new prior-PR claim/attempt and derived submit marker plus fresh PR/full binder/checks/reviews.
      The old identity has no authorized delayed PR request. Never rely on caller
      uniqueness, adjacent ordinals,
      comments, orphan adoption, timeout expiry, manual deletion, force, or branch reuse.
  - id: VOC-115-D10
    statement: >-
      Evaluate PR multiplicity before merged precedence. Close and read back every
      nonmerged duplicate before success. Exactly one valid merged plus only closed-
      unmerged duplicates may close allocation; multiple/conflicting merges or failed
      cleanup irrecoverably stop. With no merged PR, all closed duplicates advance to
      the conflict digest; a single closed PR advances by number. All refs remain protected.
  - id: VOC-115-D11
    statement: >-
      Preserve frozen main as merge base, zero main-only commits, exact head/develop
      SHA/tree, no extra compare content, prospective/actual merge-tree equality,
      separately reviewed promotion/sync merge-commit PRs, final ancestry/zero-behind,
      R4 evidence, distinct reviewers, and separate authorized non-author mergers.
  - id: VOC-115-D12
    statement: >-
      After adoption, amend draft PR #215 across exactly 27 listed paths: seven living
      release surfaces, all nine VOC-106 artifacts, all nine VOC-114 artifacts, and the
      repository validator/test. Preserve adopted evidence/history and change no other
      path. The existing foundation glob auto-discovers the test; if disproved, stop.
  - id: VOC-115-D13
    statement: >-
      Implement a network-free validator for ruleset, claim/attempt/submit/domains, exact JSON
      schemas including git commit and all-PR/reserved-PR split, raw projection/capture versus stable digests, pagination/filter/equality,
      state/frontier/cardinality, coalescence/stale outcome, actors/crashes, and surfaces.
      Fixtures cover exact max/+1 ref lengths, replay, same/different target, stale,
      one-shot 201/422/crash/unknown/delayed-submit exclusion, null provenance, ruleset
      drift, merged duplicate cleanup, time variation, hostile ids/JSON, incomplete
      scans, handoff, retry/topology.
  - id: VOC-115-D14
    statement: >-
      Require exact path/OID/diff evidence, governance/risk/diff/format/link checks,
      focused and foundation/hosted tests, rollback rehearsal, exact release-history
      specialist PASS, and different independent cross-model R4 PASS with zero blockers.
      A separate non-author may merge only the exact eligible correction.
  - id: VOC-115-D15
    statement: >-
      Monitor under DOC-15 section 24.18 through correction readback and first corrected
      VOC-106 finalization, including coalescence/different-target/stale, capture/stable,
      one-shot submit uncertainty, null provenance, ruleset drift, multiplicity cleanup,
      and same-D retry. Permit
      ordinary non-force updates only to PR #215's scoped head after adoption. This
      correction prohibits ref/settings/live actions; the separately authorized ruleset
      prerequisite remains held. Prohibit self-review/approval/merge.

