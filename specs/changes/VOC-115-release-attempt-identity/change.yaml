multiple_pull_request_rationale: >-
  One corrected revision of draft PR #215 is the minimum coherent boundary. Its
  seven living and nine VOC-106 paths implement adopted VOC-114 but are not on
  develop; the nine adopted VOC-114 artifacts on develop define the defective rule.
  A separate implementation PR would duplicate or split one naming, ownership,
  retry, review, and rollback invariant. One 25-path revision avoids a contradictory
  partial state and the extra coordination, elapsed-time, token/context, repeated-
  check, exact-review, and bookkeeping overhead.
automatic_merge_allowed: true
production_impact: none-repository-policy-and-release-preparation-only
rollback_required: true

objective: >-
  Correct the VOC-114/VOC-106 release-attempt contract so every immutable attempt is
  exactly bound to frozen develop yet a new collision-free identity remains available
  after invalidation at the same develop SHA, while preserving abandoned refs,
  protected-history proofs, actor separation, and every no-live-action boundary.

requirements:
  - id: VOC-115-D00
    statement: >-
      Treat issue #216 and the exact specialist FAIL on PR #215 head
      6e7a65aba933dee7701dfcd1481377f0a130374e, tree
      b1dd5a1feea589cd3b82f286623bf15dfd98e368, base
      dbe7bb5178e55939f1cdb359a7b70effa55fe8ce as intake. PR #215 stays draft and
      blocked. The issue and review grant no plan adoption, implementation, ref,
      settings, release, merge, deployment, or external-action authority.
  - id: VOC-115-D01
    statement: >-
      Define every new release head exactly as release/voc-106-<full-sha>-attempt-<n>,
      where <full-sha> is the 40-character lowercase hexadecimal frozen
      origin/develop commit and <n> is a canonical positive base-10 integer with no
      sign or leading zero. The complete head name, frozen SHA/tree, and binder must
      agree; shortened, ambiguous, malformed, or mismatched identities fail closed.
  - id: VOC-115-D02
    statement: >-
      Allocate <n> as one plus the greatest valid sequence ever observed across the
      freshly fetched remote release-head namespace, every open/closed/merged pull-
      request head name in the canonical repository, and valid append-only
      voc-106-release-attempt-v1 records attached to issue #191 or a VOC-106 release
      PR; use 1 only when that union is empty. Inventory is repository metadata, not a
      repository-settings query. Record the inventory inputs, maximum, chosen
      sequence, actor, timestamp, frozen refs/trees, and intended name before creation.
  - id: VOC-115-D03
    statement: >-
      Create a new attempt only with GitHub's atomic create-ref operation at the exact
      frozen develop SHA, never with an update or force-capable operation. Treat an
      already-existing name or atomic collision as reserved regardless of its SHA,
      owner, or PR state; do not adopt, overwrite, update, force, or delete it. Refresh
      the complete inventory and allocate a higher sequence. A failed allocation is
      recorded but is not an attempt because no new ref was created.
  - id: VOC-115-D04
    statement: >-
      On successful atomic creation, immediately read back and record one immutable
      ownership tuple: VOC-106, attempt sequence and head name, full frozen develop
      SHA/tree, frozen main SHA/tree, creating actor, creation receipt/time, and draft
      PR number/head/base when available. Continuation after interruption or an actor
      handoff requires exact tuple equality and recorded handoff; it must not recreate
      or update the ref. Missing, conflicting, or partial ownership evidence stops.
  - id: VOC-115-D05
    statement: >-
      Preserve one complete invalidation domain: protected refs/trees, attempt ref,
      ownership tuple, PR head/base/metadata, merge base/divergence/compare, checks,
      policy evidence, and reviewed revision. Drift closes the draft PR, records the
      reason, and abandons the attempt while retaining its ref unchanged. A retry,
      including with unchanged frozen develop, performs a fresh inventory/allocation,
      atomic creation, PR, checks, evidence, and exact reviews under a greater sequence.
  - id: VOC-115-D06
    statement: >-
      Keep abandoned refs immutable and ineligible for automatic or manual deletion.
      Existing automatic source deletion may remove only a successfully merged short-
      lived release or synchronization head after its exact identity and nonexecuted
      atomic recreation request are recorded. Unexpected absence or movement of an
      abandoned/active ref stops release and routes governed investigation; recreation
      is recovery, never a new attempt or permission to reuse a name.
  - id: VOC-115-D07
    statement: >-
      Preserve frozen main as merge base, zero main-only commits, exact attempt-head/
      develop SHA and tree equality, zero extra head content, aggregate compare,
      prospective and actual release-merge tree equality, two separately reviewed
      merge-commit PRs, synchronization, final ancestry/zero-behind proof, R4 evidence,
      distinct reviewers, and separate authorized non-author mergers.
  - id: VOC-115-D08
    statement: >-
      After adoption, amend draft PR #215 as one 25-path implementation: all seven
      living release surfaces, all nine VOC-106 artifacts, and all nine VOC-114
      artifacts listed in implementation_paths. Reconcile every naming, allocation,
      ownership, collision, invalidation, recreation, test, evidence, rollback, and
      monitoring statement and applicable living-document metadata/revision notes.
      Preserve adopted candidate/review/approval records and explicitly historical
      packages; no other path may change.
  - id: VOC-115-D09
    statement: >-
      Provide ref-free deterministic positive fixtures for first allocation, same-
      develop retry after invalidation, changed-develop next attempt, exact same-
      attempt continuation, and merge-tree/recreation evidence. Provide one-mutation-
      at-a-time negatives for malformed/mismatched identity, stale inventories,
      current/historical/foreign collisions, reuse/adoption/update/deletion, broken
      ownership or handoff, drift, topology/tree mismatch, and missing recovery proof.
  - id: VOC-115-D10
    statement: >-
      Require exact path/OID/diff evidence, governance and risk validation, formatting/
      link/reference checks, the complete synthetic topology matrix, hosted required
      checks, exact release-governance/git-history specialist PASS, and a different
      independent cross-model R4 PASS with zero blockers. A separate non-author merge
      actor may merge the exact correction only after all gates and authority pass.
  - id: VOC-115-D11
    statement: >-
      Under DOC-15 section 24.18, the adoption-recorded owner monitors from the
      correction merge through exact merge-SHA hosted/develop readback and the first
      corrected VOC-106 promotion/synchronization final readback. A real same-develop
      invalidation, if it occurs, must prove the greater-sequence retry; otherwise the
      deterministic same-develop fixture remains required. Any collision, mutation,
      disappearance, ambiguity, or check/evidence failure stops release/closure and
      routes a governed correction or reviewed integrated revert.
  - id: VOC-115-D12
    statement: >-
      Prohibit repository-settings query or mutation, ref creation/update/deletion by
      this correction implementation, manual branch deletion, force or force-with-
      lease, workflow dispatch, release/synchronization execution, Cloudflare/DNS/
      resource action, deployment, migration, secret or production/learner-data
      access, traffic, spending, launch, self-review, self-approval, and self-merge.

