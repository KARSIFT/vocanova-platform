multiple_pull_request_rationale: >-
  One corrected revision of draft PR #215 is the minimum coherent boundary. Its
  seven living and nine VOC-106 paths implement adopted VOC-114 but are not on
  develop; the nine VOC-114 artifacts on develop mandate the defective rule; the
  validator and test make the replacement executable. Splitting the 27 paths would
  publish contradictory lifecycle rules or leave them unenforced and add coordination,
  elapsed-time, token/context, repeated-check, exact-review, and bookkeeping overhead.
