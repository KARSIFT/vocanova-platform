schema_version: 1

id: VOC-115
slug: release-attempt-identity
title: Make release-attempt identity retry-safe
type: release-governance-and-adopted-package-correction
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 because the correction changes DOC-15, DOC-16, AGENTS, protected-history
  release rules, and two adopted R4 packages immediately before a main promotion.
  A wrong rule can dead-end recovery, mutate an immutable ref, or promote the wrong
  evidence set. Implementation remains repository-only and grants no release or
  external authority.
canonical_path: specs/changes/VOC-115-release-attempt-identity
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/216
blocking_review_evidence: https://github.com/KARSIFT/vocanova-platform/pull/215#issuecomment-5491674409
