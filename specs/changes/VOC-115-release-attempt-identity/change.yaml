objective: >-
  Replace SHA-only release attempts with a full-frozen-develop-SHA plus GitHub-server-
  assigned reservation-comment identifier, enforce one derived active attempt and an
  exact tamper-failing event lifecycle with crash recovery, and preserve immutable refs,
  release topology, actor separation, rollback, and every no-live-action boundary.

requirements:
  - id: VOC-115-D00
    statement: >-
      Treat issue #216, the PR #215 specialist FAIL, and both exact f7abcc8 PR #217
      plan FAIL reviews as intake. Preserve f7abcc8/tree 2859c7d as superseded evidence
      with no review transfer. PR #215 stays draft. None grants plan adoption,
      implementation, ref/settings, release, merge, deployment, or external authority.
  - id: VOC-115-D01
    statement: >-
      Define a new release head exactly as
      release/voc-106-<40-lowercase-hex-frozen-develop-sha>-attempt-<reservation-id>.
      reservation-id is the unique GitHub REST issue-comment id returned by creating
      that reservation record on issue #191, normalized losslessly as a canonical
      decimal string. It is not a client ordinal and need only be distinct from every
      other reservation; ids/ordinals may have unrelated values across frozen SHAs.
  - id: VOC-115-D02
    statement: >-
      Freeze voc-106-release-attempt-v1 as an issue-#191-only event format. Each event
      is exactly one marker containing compact lexicographically key-sorted JSON with
      LF framing, exact own-key set, NFC strings restricted by field grammar, and no
      extra prose. The GitHub envelope id is the event id; author/login, issue URL,
      created_at, updated_at, minimized state, API/html URLs, raw body bytes, and raw
      response digest are evidence. Require created_at = updated_at and not minimized.
      Editing, minimizing, deleting a referenced event, malformed bytes, duplicate or
      conflicting transitions, missing predecessor, or envelope/body mismatch makes
      the affected lineage invalid and never frees an id/name for reuse.
  - id: VOC-115-D03
    statement: >-
      Define exact events reserve, activate, reservation-disposition, ref-created,
      pr-created, binder-ready, handoff, invalidate, pr-closed, abandon, and merged;
      freeze their required/forbidden fields, enums, predecessor/linkage, actor and
      handoff authority, cardinality, lifecycle transition graph, and terminal-state
      precedence in specification.md. Every state scan fully paginates issue #191 at
      per_page=100 through the final page, rejects gaps/repeats/incomplete page
      evidence, validates all recognized markers, and proves a complete predecessor
      chain. Unrecognized ordinary issue comments are ignored; malformed v1 markers
      fail closed.
  - id: VOC-115-D04
    statement: >-
      Enforce globally at most one active VOC-106 release attempt. Reserve events are
      provisional, not attempts and not active. When no active chain exists, eligible
      reservations must name the exact latest terminal attempt frontier or null at
      genesis. After two complete stable paginated scans, the lowest numeric server
      comment id among eligible current-frontier reservations whose frozen develop
      still equals origin/develop is the deterministic winner; all other same/different-
      SHA concurrent reservations receive reservation-disposition. After activate is
      posted, repeat two full stable scans and allow only the sole valid winner to
      create a ref. A later reservation while active is dispositioned active-exists.
      A valid merged terminal permanently closes VOC-106 allocation; only an abandoned
      terminal advances to another retry frontier.
  - id: VOC-115-D05
    statement: >-
      Treat ids as decimal strings matching [1-9][0-9]{0,18}, compare them with BigInt,
      and require value <= 9223372036854775807. Values outside the policy domain,
      duplicate envelope ids, loss through Number conversion, or exhaustion stop for
      governed correction without fallback. With the 40-hex SHA and at most 19-digit
      id, require branch length <=84 and full ref length <=95, safe ASCII only, exact
      grammar, and git check-ref-format --branch success before any mutation.
  - id: VOC-115-D06
    statement: >-
      Create the active winner ref only through GitHub POST create-ref at exact frozen
      develop SHA after absence proof; PATCH/update-ref, git push, force, force-with-
      lease, and deletion are prohibited for release/sync/permanent/foreign refs. An
      exact-name preflight or 422/unknown receipt invalidates and abandons the active
      reservation without claiming the collided/orphan ref; a new distinct reservation
      is allowed only after that terminal event. Never adopt or mutate the collided ref.
      POST success, raw 201 response receipt, exact readback SHA/tree, and ref-created
      event are mandatory.
  - id: VOC-115-D07
    statement: >-
      Define crash recovery at every boundary. Before reserve response: fully rescan
      actor-authored matching reservations and arbitrate, never repost blindly. Before
      ref POST: the authorized active owner or valid handoff may resume if the ref is
      absent. After POST: recover only with preserved 201 response digest and exact
      readback; a 422/unknown receipt cannot be adopted and is dispositioned. Before/
      after PR POST: recover only zero or exactly one draft PR authored by the effective
      owner with exact reservation marker/head/base; duplicates/conflicts invalidate.
      Binder recovery requires exact body digest and a new binder-ready event. Drift
      requires invalidate, verified PR closure, pr-closed, then abandon with unchanged
      ref readback before any new reservation. No orphan is adopted by matching SHA.
  - id: VOC-115-D08
    statement: >-
      An active attempt begins only at a valid activate event and remains globally
      active through provisional/ref/PR/binder/invalidation/closure states until
      abandon or merged is valid. Handoff is valid only when authored by the effective
      owner, or by a separately authorized recovery actor whose exact evidence names
      owner unavailability and this bounded transfer. It names one new actor and
      extends the current predecessor; it transfers preparation continuation only,
      not review, merge, settings, or live authority. Invalid/competing handoffs stop.
      Same-develop retry uses a fresh server id strictly distinct from all earlier
      reservations; no literal adjacent ordinal or greater-than-prior promise applies.
  - id: VOC-115-D09
    statement: >-
      Keep active and abandoned refs immutable and ineligible for automatic/manual
      deletion. Existing automatic deletion may remove only a successfully merged
      short-lived release/sync head after exact identity and nonexecuted POST create-
      ref recovery request are recorded. Missing/moved active or abandoned refs stop;
      recreation is separately authorized recovery, never a new attempt/name reuse.
  - id: VOC-115-D10
    statement: >-
      Preserve frozen main as merge base, zero main-only commits, exact attempt-head/
      develop SHA/tree equality, no extra head/compare content, prospective/actual
      release-tree equality, two separately reviewed merge-commit PRs, synchronization,
      final ancestry/zero-behind, R4 evidence, distinct reviewers, and separate
      authorized non-author mergers.
  - id: VOC-115-D11
    statement: >-
      After adoption, amend draft PR #215 across exactly 27 paths: seven living release
      surfaces, all nine VOC-106 artifacts, all nine VOC-114 artifacts, and the new
      repository-owned validator/test listed in implementation_paths. Reconcile every
      current lifecycle/test/evidence/rollback/metadata statement, preserve adopted
      evidence and historical packages, and change no other path. The focused test is
      automatically discovered by scripts/foundation/*.test.mjs, so package.json is
      unchanged unless a later impact audit proves that assertion false and stops.
  - id: VOC-115-D12
    statement: >-
      The network-free validator must expose pure event parsing, canonicalization,
      pagination-completeness, state derivation, winner arbitration, identity/ref
      validation, crash recovery, and current-surface checks. One-at-a-time fixtures
      cover same/different-SHA concurrency, pre/post event races, every crash boundary,
      edits/deletions/minimization, missing/duplicate/conflicting links, actor/handoff,
      hostile input, BigInt bounds, ref length/format, collision, same-D retry, single-
      active state, immutable abandonment, topology/tree, and recovery.
  - id: VOC-115-D13
    statement: >-
      Require exact 27-path/OID/diff evidence, governance/risk/diff/format/link checks,
      focused validator tests, full foundation, hosted required checks, rollback
      rehearsal, exact release-history specialist PASS, and different independent
      cross-model R4 PASS with zero blockers. A separate non-author merge actor may
      merge only the exact eligible correction.
  - id: VOC-115-D14
    statement: >-
      Under DOC-15 section 24.18, monitor from correction merge through exact hosted/
      develop readback and first corrected VOC-106 promotion/sync final readback. The
      synthetic same-develop retry is mandatory; a real retry additionally proves the
      earlier ref unchanged and a distinct server id. Any concurrent active state,
      tamper/missing event, crash ambiguity, collision reuse, ref movement, ownership,
      topology, or check failure stops release/closure and routes governed remediation
      or reviewed integrated revert.
  - id: VOC-115-D15
    statement: >-
      Permit ordinary non-force updates only to scoped implementation branch
      impl/voc-114-release-head-bookkeeping and draft PR #215 while implementing this
      adopted correction. Prohibit force/force-with-lease/deletion and every release,
      sync, permanent, foreign, or unrelated ref mutation by the correction; prohibit
      settings query/mutation, release/sync execution, dispatch, deployment,
      Cloudflare/DNS/resources, secrets/data, migration, traffic, spending, launch,
      self-review, self-approval, and self-merge.

