requirement_source: 'GitHub issue #333 ("Server-rendered pages'' own /api/v1/me check
  fails with 401 immediately after middleware.ts''s identical check succeeds, blocking
  real onboarding after Google sign-in"), including its full body (the only content
  on the issue at drafting time - no comments existed yet). The issue documents a
  live reproduction against production (nginx access logs from three separate real
  sign-in attempts, all showing an identical 200, 200, 401 pattern for the three server-side
  /api/v1/me calls in one sign-in), what it explicitly ruled out (stale/duplicate
  cookies, IP rate limiting, port/CORS/reachability), and names its own likely area
  to investigate (apps/web/src/middleware.ts''s raw-header cookie forward succeeding
  twice, versus apps/web/src/lib/api-server.ts''s cookies()-based reconstruction failing
  once, for the same request) and suggested fix direction (unify the two cookie-forwarding
  implementations).'
requirement_approval_status: 'Approved. Founder merged PR #334 (this draft package''s
  own plan PR) on 2026-08-06T23:50:06Z, adopting it. This follow-up commit records
  that decision in change.yaml, since merging the plan PR only merges the draft
  content and does not itself flip these fields, mirroring VOC-039/040/041/042''s
  convention. This package was renamed from its originally-drafted VOC-043 to
  VOC-044 immediately after merge, to resolve an ID collision with PR #332''s
  own independently-drafted VOC-043 (both packages were drafted concurrently
  before either had merged, so both computed the same "next available ID").'
