slug: release-promotion-sync
title: Promote the current develop release and synchronize branch history
type: repository-release-promotion-and-history-finalization
status: draft
risk: R4
planned_implementation_risk_floor: >-
  R4 because the one repository-only outcome moves the protected canonical `main`
  ref and then intentionally merge-commits its ancestry back into protected `develop`.
  It carries the highest risk of the integrated release set and requires complete
  decision, impact, contingency, deterministic, specialist, and exact-revision
  independent-review evidence; no risk label supplies merge authority.
canonical_path: specs/changes/VOC-106-release-promotion-sync
authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/191
requirement_approval_status: issue-open-plan-review-and-adoption-pending
