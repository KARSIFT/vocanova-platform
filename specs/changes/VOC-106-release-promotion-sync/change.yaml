implementation_pull_request_count: 2
multiple_pull_request_rationale: >-
  The release promotion and the post-promotion synchronization are one coherent
  branch-finalization outcome, but DOC-16 requires two separately reviewed protected-
  branch PRs in a hard order: the promoted `main` result and exact ancestry do not
  exist until the release merge, and the synchronization head must be short-lived and
  based on current `develop`.
  The release is rollback-safe before synchronization, whereas synchronization cannot
  be prepared truthfully beforehand. This fixed protected-history/action boundary,
  not component count or convenience, justifies the second PR despite the added
  coordination, elapsed-time, repeated checks, exact-review, and evidence overhead.
automatic_merge_allowed: true
production_impact: none-repository-history-only
rollback_required: true

objective: >-
  Make the then-current independently verified integrated `develop` history canonical
  on `main` through a reviewed merge commit from an exact immutable short-lived alias,
  then close the required repository-history loop by merging that exact current
  `main` ancestry through a reviewed short-lived synchronization branch into
  `develop`, without any settings or live-system action.

requirements:
  - id: VOC-106-D00
    statement: >-
      Issue #191 is the canonical intake for a new release package because closed PR
      #190 correctly identified the source/base and validations but failed closed:
      its release body could not truthfully name one canonical change-package path.
      VOC-092/PR #154 is historical evidence for a different adopted release set and
      cannot authorize this later promotion.
  - id: VOC-106-D01
    statement: >-
      The initial plan observation is `origin/main`
      718ea9d9d5ff3476de9db9439414c2a6e07a6f4a and `origin/develop`
      03528a84988ebe664207c6a439e133070627c92a, with main as merge base and 0/84
      main-only/develop-only commits. It is only traceability evidence. After this
      plan is adopted and before release review, a new release preparer must fetch
      both refs and freeze their exact SHAs, tree IDs, merge base, divergence, and
      aggregate compare in the release PR. Frozen main must be the merge base with
      zero main-only commits.
  - id: VOC-106-D02
    statement: >-
      Create `release/voc-106-<frozen-develop-short-sha>` as a ref-only exact alias
      of the freshly frozen develop SHA and tree. Before review, prove name absence or
      same-attempt ownership, head/develop SHA and tree equality, zero extra head
      commits, and no aggregate-compare commit or tree beyond frozen develop. Its
      separately reviewed PR targets main and uses an identifiable merge commit whose
      prospective and actual tree equal frozen develop/head. Record exact checks,
      reviewer verdicts, R4 decision, impact, contingency, and rollback evidence.
  - id: VOC-106-D03
    statement: >-
      A release ref and draft PR are one immutable attempt. Any protected-ref, head,
      base, merge-base, tree, compare, PR metadata, required check, policy evidence,
      or reviewed-revision drift invalidates the complete binder. Close and abandon
      the draft PR/ref without deletion or mutation, then start a fresh SHA-named ref
      and PR with all-new evidence. A collision fails closed unless proved the
      untouched head of the same attempt; never adopt, overwrite, force-update, or
      delete another PR or actor's ref.
  - id: VOC-106-D04
    statement: >-
      Release finalization is incomplete until a short-lived branch from then-current
      develop merges then-current main ancestry and its separately reviewed PR
      merge-commits into develop. Permanent main is never the sync PR head. Its own
      fresh freeze and exact review are required; movement after release invalidates
      its synchronization evidence.
  - id: VOC-106-D05
    statement: >-
      Before closure, read back final refs and prove the actual release merge tree
      equals frozen develop/head, both permanent branches remain, main is an ancestor
      of develop, and develop is zero commits behind main. Record release head name,
      SHA, tree, release merge SHA, synchronization head/tip/tree and merge SHA,
      post-merge refs, checks, actors, and nonexecuted recreation commands. Existing
      automatic deletion may affect only successfully merged short-lived release and
      synchronization heads, never permanent develop or main.
  - id: VOC-106-D06
    statement: >-
      This package authorizes no repository-settings query or mutation, manual branch
      deletion, force-update of an attempt/permanent/foreign ref, Cloudflare or DNS
      action, workflow dispatch, deployment, production/data/secret access, migration,
      traffic change, spending, or launch. Plan, promotion, and synchronization each
      require different non-author exact-revision reviewers, resolution of every
      blocker, and a separately authorized non-author merger.
      The planner or PR builder cannot approve or merge its own revision.
      `automatic_merge_allowed: true` is read-only package policy metadata, never an
      executor or a substitute for these gates.

