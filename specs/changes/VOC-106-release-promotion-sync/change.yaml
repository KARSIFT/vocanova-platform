base_sha: 03528a84988ebe664207c6a439e133070627c92a
initial_release_base_branch: main
initial_release_base_sha: 718ea9d9d5ff3476de9db9439414c2a6e07a6f4a
initial_release_source_branch: develop
initial_release_source_sha: 03528a84988ebe664207c6a439e133070627c92a
initial_merge_base_sha: 718ea9d9d5ff3476de9db9439414c2a6e07a6f4a
initial_divergence: 0-main-only-84-develop-only-commits
initial_observation_status: >-
  observed-for-plan-traceability-only-on-2026-08-31; not-an-implementation-freeze,
  not-review-transferable, and superseded by the required fresh freeze after adoption
plan_branch: plan/voc-106-release-promotion-sync
target_branch: develop

approval_status: not-approved
implementation_authorized: false
implementation_authority_status: >-
  no-promotion-or-synchronization-authority-until-exact-plan-candidate-independent-
  review-adoption-bookkeeping-normal-plan-merge-and-fresh-implementation-evidence
implementation_pull_request_count: 2
multiple_pull_request_rationale: >-
  The release promotion and the post-promotion synchronization are one coherent
  branch-finalization outcome, but DOC-16 requires two separately reviewed protected-
  branch PRs in a hard order: current `main` does not exist until the release merge,
  and the synchronization head must be short-lived and based on current `develop`.
  The release is rollback-safe before synchronization, whereas synchronization cannot
  be prepared truthfully beforehand. This fixed protected-history/action boundary,
  not component count or convenience, justifies the second PR despite the added
  coordination, elapsed-time, repeated checks, exact-review, and evidence overhead.
automatic_merge_allowed: true
production_impact: none-repository-history-only
rollback_required: true

objective: >-
  Make the then-current independently verified integrated `develop` history canonical
  on `main` through a reviewed merge commit, then close the required repository-history
  loop by merging that exact current `main` ancestry through a reviewed short-lived
  synchronization branch into `develop`, without any settings or live-system action.

requirements:
  - id: VOC-106-D00
    statement: >-
      Issue #191 is the canonical intake for a new release package because closed PR
      #190 correctly identified the source/base and validations but failed closed:
      its release body could not truthfully name one canonical change-package path.
      VOC-092/PR #154 is historical evidence for a different adopted release set and
      cannot authorize this later promotion.
  - id: VOC-106-D01
    statement: >-
      The initial plan observation is `origin/main`
      718ea9d9d5ff3476de9db9439414c2a6e07a6f4a and `origin/develop`
      03528a84988ebe664207c6a439e133070627c92a, with main as merge base and 0/84
      main-only/develop-only commits. It is only traceability evidence. After this
      plan is adopted and before release review, a new release preparer must fetch
      both refs and freeze their exact SHAs, tree IDs, merge base, divergence, and
      aggregate compare in the release PR.
  - id: VOC-106-D02
    statement: >-
      A separately reviewed `develop` to `main` PR must use an identifiable merge
      commit. Its exact frozen source/base, checks, reviewer verdicts, R4 decision,
      impact, contingency, and rollback evidence must be recorded. Any movement of
      either protected ref, PR head/base, merge base, compared tree, or required
      governance/workflow evidence invalidates the freeze and every exact-SHA review;
      the release must return to a fresh freeze and fresh evidence.
  - id: VOC-106-D03
    statement: >-
      Release finalization is incomplete until a short-lived branch from the then-
      current `develop` merges the then-current `main` ancestry and its separately
      reviewed PR merge-commits into `develop`. Permanent `main` is never the PR
      head. Its own fresh freeze and exact review are required; movement after the
      release invalidates its synchronization evidence.
  - id: VOC-106-D04
    statement: >-
      Before closure, read back the final refs and prove `main` is an ancestor of
      `develop` and `develop` is zero commits behind `main`. Record the exact
      release merge SHA, synchronization branch tip, synchronization merge SHA,
      post-merge refs, validation/check results, distinct reviewer and merger actors,
      and the recreation command for an automatically deleted short-lived head.
  - id: VOC-106-D05
    statement: >-
      This package authorizes no repository-settings mutation, manual branch deletion,
      Cloudflare or DNS action, workflow dispatch, deployment, production/data/secret
      access, migration, traffic change, spending, or launch. If GitHub would delete
      permanent `develop` as a release PR head, the release is blocked; this package
      does not authorize a setting workaround. Existing automatic deletion may affect
      only an already-merged short-lived synchronization head with recorded recovery.
  - id: VOC-106-D06
    statement: >-
      Plan, promotion, and synchronization each require different non-author exact-
      revision reviewers, resolution of every blocker, and a separately authorized
      non-author merger. The planner or PR builder cannot approve or merge its own
      revision. `automatic_merge_allowed: true` is read-only package policy metadata,
      never an executor or a substitute for these gates.

