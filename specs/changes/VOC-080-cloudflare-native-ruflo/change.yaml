schema_version: 1

id: VOC-080
slug: cloudflare-native-ruflo
title: Cloudflare-native runtime, evidence-driven CI/CD, and external Ruflo orchestration

type: architecture-runtime-cicd-orchestration-migration
status: adopted
risk: R4
planned_implementation_risk_floor: >-
  R4 because this package changes CI/CD behavior, deployment authority, runtime language,
  database semantics, authentication and learner-data paths, production architecture, and
  external agent-orchestration authority. It touches paths with R3 and R4 floors and requires
  the strongest decision, impact, contingency, specialist, deterministic, migration, and
  exact-revision independent-review evidence.
canonical_path: specs/changes/VOC-080-cloudflare-native-ruflo
authority_model: voc-079-approval-neutral-active
requirement_source: >-
  GitHub issue #85 and the founder's 2026-08-22 request to correct CI/CD first, replace
  server hosting with Cloudflare staging and production, remove technical obstacles to
  Cloudflare, and adopt ruvnet/ruflo for continued VocaNova implementation.
requirement_approval_status: founder-direction-recorded-and-independent-plan-review-pass
base_branch: develop
base_sha: b0bb000e7dce9c3c3b4253d27767046bbc87302f
