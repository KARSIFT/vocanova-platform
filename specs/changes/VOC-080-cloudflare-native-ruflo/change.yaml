  test_plan: test-plan.md
  release_plan: release-plan.md
dependencies:
  - id: VOC-080-DEP-00
    status: >-
      Resolved for package adoption. The exact candidate
      6fb00a0b64e6f2d4adceb24a9caeffd9af98c779 received a PASS from a different-role
      independent reviewer with no blocking findings. The review covered architecture,
      governance, Cloudflare, security, data migration, CI/CD, Ruflo authority, rollback,
      and AC-00 through AC-11.
  - id: VOC-080-DEP-01
    status: >-
      Accepted platform constraint. GitHub Free does not expose branch protection or rulesets
      for this private repository. Workflows and documents must not claim unavailable hosted
      enforcement; supported repository settings are hardened and recorded separately.
  - id: VOC-080-DEP-02
    status: >-
      Open for activation only. A Cloudflare account, separate staging and production resources,
      least-privilege credentials, cost limits, and accountable external-effect authority are
      required before any live resource mutation or deployment. They are not prerequisites for
      repository-only implementation and local workerd/D1 validation.
  - id: VOC-080-DEP-03
    status: >-
      Open for data cutover only. Production PostgreSQL inventory, export, conversion, integrity
      reconciliation, privacy controls, and rollback evidence require separately authorized
      production-data access. Reconstruction uses only synthetic fixtures.
  - id: VOC-080-DEP-04
    status: >-
      Open for Ruflo activation. The exact Ruflo npm release and integrity must be pinned and
      audited. Its initializer must not overwrite AGENTS.md or install unreviewed repository
      hooks, and its GitHub/deployment tools remain outside the permission envelope.
action_specific_holds:
  - id: VOC-080-HOLD-00
    action: create-or-mutate-cloudflare-staging-resources-and-secrets
    accountable_role: cloudflare-account-owner-or-delegated-deployment-operator
    required_evidence: >-
      Adopted resource manifest, cost envelope, least-privilege credential scope, exact-revision
      task review, passing local and hosted checks, and explicit staging activation record.
    completion_or_expiry:
      completed once the named staging resources are provisioned and the
      evidence is recorded; expires if the resource manifest or reviewed revision changes.
  - id: VOC-080-HOLD-01
    action: deploy-or-route-production-traffic-or-apply-production-d1-migrations
    accountable_role: cloudflare-account-owner-or-delegated-production-operator
    required_evidence: >-
      Staging parity and soak evidence, migration reconciliation, rollback rehearsal, budget
      acceptance, exact immutable versions, applicable launch authority, and explicit production
      activation for the named revision and resources.
    completion_or_expiry:
      one activation only; expires on revision, schema, route, resource, or
      authority change.
  - id: VOC-080-HOLD-02
    action: access-export-transform-or-delete-production-learner-data
    accountable_role: production-data-owner-or-explicitly-delegated-data-migration-operator
    required_evidence: >-
      Data-minimization plan, access scope, protected execution environment, reconciliation
      queries, backup/restore readiness, audit trail, and explicit time-bounded authority.
    completion_or_expiry:
      expires at the recorded migration window or immediately after the
      authorized dataset and reconciliation are complete.
