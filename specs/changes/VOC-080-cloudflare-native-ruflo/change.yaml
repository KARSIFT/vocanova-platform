    status: recorded
    evidence: https://github.com/KARSIFT/vocanova-platform/issues/85
  package_independent_verification:
    status: pass-exact-revision
    candidate_sha: 6fb00a0b64e6f2d4adceb24a9caeffd9af98c779
    evidence: https://github.com/KARSIFT/vocanova-platform/pull/86#issuecomment-5379258747
approval_status: adopted
implementation_authorized: true
automatic_merge_allowed: true
production_impact: >-
  Repository changes prepare an eventual replacement of server-hosted staging and production
  with Cloudflare Workers and D1. Plan adoption, repository implementation, Cloudflare resource
  creation, staging activation, production activation, DNS changes, and retirement of any old
  runtime are distinct events. This package grants no live-system access by itself.
rollback_required: true
