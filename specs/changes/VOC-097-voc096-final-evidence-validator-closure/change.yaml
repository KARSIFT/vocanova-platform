objective: >-
  Through the preserved VOC-096 PR1, add exactly the two omitted VOC-080 final-
  evidence validator paths, fail-closed permit prepared staging only through the
  complete VOC-096 delivery validator, preserve legacy held evidence and every
  production hold, and reconcile exact scope/count across the operative VOC-096 and
  VOC-094 package surfaces without any live-system action.

defect:
  reproduction:
    command: node --test scripts/foundation/voc080-final-evidence-policy.test.mjs
    result: 5-of-6-pass-repository-positive-test-fails
    errors:
      - staging delivery manifest must remain held
      - delivery manifest status must remain held
  root_cause: >-
    The legacy VOC-080 closure validator hard-codes top-level and staging held state.
    Adopted VOC-096 requires the complete validated staging-only prepared state while
    remaining dispatch-ineligible, but omitted the legacy validator and paired test
    from its exact 27-path PR1 core.
  safe_state: >-
    The preserved VOC-096 PR1 worktree contains only its reviewed original scope; the
    two omitted paths are untouched; no implementation commit, push, or PR exists;
    no external action occurred; Phase-1/2 evidence and production holds remain valid.

requirements:
  - id: VOC-097-D00
    statement: >-
      Issue 166 is a bug report only. No implementation begins until exact plan review,
      adoption, effectiveness bookkeeping, genuine eligibility, normal non-author plan
      merge, and applicable post-merge checks pass.
  - id: VOC-097-D01
    statement: >-
      Resume the preserved VOC-096 PR1 branch/worktree without reset, recreation,
      destructive checkout, discard, or overwrite. Preserve dirty VOC-090 and every
      worktree, branch, and recovery ref.
  - id: VOC-097-D02
    statement: >-
      Expand the VOC-096 PR1 core from 27 to exactly 29 authorized paths by adding only
      scripts/foundation/voc080-final-evidence-policy.mjs and its paired test. Reconcile
      the nine VOC-096 package files in the same implementation PR, producing exactly
      38 authorized paths total. The nine VOC-094 files remain within the core. A 39th
      path or an omitted required reconciliation is blocking drift.
  - id: VOC-097-D03
    statement: >-
      Preserve legacy held transition evidence. Accept only held/held legacy state or
      prepared/prepared staging state; reject all other top-level/staging combinations.
  - id: VOC-097-D04
    statement: >-
      Accept prepared only by composing with the complete current Cloudflare delivery
      repository validator for the exact manifest, Wrangler configs, closed runtime
      contract, prepared tuple, schema bundle, eight binders, resources, baselines,
      cost, privacy, production, and dispatch-ineligible invariants. Do not create a
      partial duplicated exception.
  - id: VOC-097-D05
    statement: >-
      Production remains held; every production sentinel and VOC-080-HOLD-01/HOLD-02
      remains unchanged. Historical transition-record action holds remain held evidence.
  - id: VOC-097-D06
    statement: >-
      Reject committed authorized, active, or unknown state. Prepared state never
      supplies standing dispatch authority and remains ineligible without the later
      live five-record runtime binder.
  - id: VOC-097-D07
    statement: >-
      Add deterministic positives for exact prepared repository and legacy held fixture,
      plus negatives for malformed or mismatched prepared state, missing binder,
      tuple/schema/manifest/digest drift, production activation, hold weakening,
      generic URL fallback, self-asserted authority/envelope facts, and premature
      dispatch eligibility.
  - id: VOC-097-D08
    statement: >-
      Preserve every VOC-096 exact-SHA, URL/ID, body/envelope, replay, expiry, two-
      runtime JCS, request-budget, Free-zero-cost, Basic-Load-Balancing, secret,
      rollback, and production gate. Never weaken an existing delivery gate.
  - id: VOC-097-D09
    statement: >-
      Run complete VOC-096 PR1 local/hosted validation and obtain separate exact-SHA
      Cloudflare, security/settings, and independent R4 PASS reviews before a distinct
      non-author merge. Material edits require fresh checks and reviews.
  - id: VOC-097-D10
    statement: >-
      Authorize repository work only. Cloudflare, DNS, D1, GitHub settings/secrets,
      credentials, dispatch, deployment, migration, traffic, spending, production,
      data, main promotion, and launch remain prohibited by this package; unchanged
      VOC-094-ACT-03/04/05 and VOC-085-HOLD-00 remain separate.

