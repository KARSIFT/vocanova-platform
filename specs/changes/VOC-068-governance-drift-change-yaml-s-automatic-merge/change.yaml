requirement_source: "GitHub issue #488 (\"Governance drift: change.yaml's automatic_merge_allowed\
  \ defaults to false for every package, requiring founder approval on R1-R3 changes\
  \ that active-A-003 says should not need it\"). The issue reports that merge-gate.yml\
  \ correctly hard-blocks only R4, but also independently requires founder approval\
  \ whenever a package's own change.yaml sets automatic_merge_allowed: false \u2014\
  \ confirmed live on PR #480 and #481. specs/templates/change-package/change.yaml\
  \ defaults the field to false; recent packages (VOC-051 R3, VOC-052 R3, VOC-053\
  \ R3, VOC-063 R2, VOC-014 R1) leave it false independent of risk class; VOC-012\
  \ (R1) is the documented exception that deliberately set true to prove the mechanism\
  \ (cited in merge-gate.yml's header). AGENTS.md has no instruction connecting the\
  \ declared risk class to this field. Net effect: the founder is asked to comment\
  \ approved on essentially every task PR, defeating active-A-003's R0\u2013R3 posture.\
  \ Suggested (non-prescriptive) directions: add AGENTS.md planner guidance, reconsider\
  \ the template default, and require stated reasoning when a package deliberately\
  \ opts out despite qualifying for R0\u2013R2.\n"
