authority_model: voc-079-approval-neutral-active
requirement_source: https://github.com/KARSIFT/vocanova-platform/issues/221
failing_run: https://github.com/KARSIFT/vocanova-platform/actions/runs/33508619896
failing_job: https://github.com/KARSIFT/vocanova-platform/actions/runs/33508619896/job/99858760273
failing_event_sha: d464d7b2a07d8e43213ae89471c4a8b8461e7781
base_branch: develop
base_sha: b22a735fa5986023a7795c3f7cb89af7cf1cfccb
