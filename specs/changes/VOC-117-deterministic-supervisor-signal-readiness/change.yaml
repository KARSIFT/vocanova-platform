id: VOC-117
slug: deterministic-supervisor-signal-readiness
title: Replace fixed-delay supervisor signal tests with a bounded child-ready handshake
type: foundation-test-reliability-correction
status: draft
risk: R3
planned_implementation_risk_floor: >-
  R3 because the implementation changes a required foundation CI verifier for
  local-process lifecycle and signal cleanup. The changed test path has an
  automated R1 path floor, but a false pass could weaken evidence for a required
  shutdown control, so the semantic floor is R3. No runtime, workflow, authority,
  deployment, or live-system behavior is in scope and R4 is not triggered.
