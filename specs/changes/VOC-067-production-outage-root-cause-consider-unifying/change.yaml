requirement_source: "GitHub issue #485 (\"Production outage root cause: consider unifying\
  \ staging/production nginx into one shared-but-isolated instance\"), opened after\
  \ a live 2026-08-11 outage in which production.vocanova.site and api-production.vocanova.site\
  \ returned persistent Cloudflare-edge 502 Bad Gateway while all four production\
  \ containers were healthy and curling the host's public IP on :8443 with the correct\
  \ Host: header returned 200 from both on-box and external networks. Root cause:\
  \ production nginx publishes 8081:80 / 8443:443 because staging nginx already owns\
  \ host 80/443 on the shared 2 vCPU / 4 GB host (VOC-037-D00 Option A-modified);\
  \ production public hostnames depend on a Cloudflare-side :443 \u2192 origin :8443\
  \ remap, and that remap is what broke. Issue proposes replacing two independent\
  \ nginx containers + Cloudflare port-remap with one shared nginx on standard 80/443\
  \ doing Host-based (SNI/server_name) routing to each tier's upstreams while preserving\
  \ VOC-037-D00/D01 isolation of config, certs, secrets, deploy-user write access,\
  \ compose project, and directory trees. Issue also notes both nginx containers'\
  \ Docker HEALTHCHECK are permanently broken (unrelated root cause, found in the\
  \ same investigation) and worth fixing regardless of which edge design is adopted. "
requirement_approval_status: "Approved by the founder (m-e-h-r-d-a-a-d), 2026-08-11.\
  \ R4 classification accepted as proposed \u2014 this is a founder decision, not\
  \ a delegate one, matching active-A-003. Each open dependency resolved directly\
  \ by the founder: VOC-067-DEP-00 \u2014 shared nginx is the chosen direction (removes\
  \ the Cloudflare port-remap failure class that caused the 2026-08-11 outage); T02\u2013\
  \ T05 proceed as scoped, dual-nginx-hardening is not pursued. VOC-067-DEP-01 \u2014\
  \ this package's proposed lifecycle defaults (dedicated shared-edge compose; deploys\
  \ limited to nginx -t + reload; recreate rare/gated) are accepted as proposed. VOC-067-DEP-02\
  \ \u2014 the founder explicitly accepts this package superseding VOC-037-D00/D01's\
  \ \"separate nginx process per tier\" isolation clause, on the condition (unchanged\
  \ from the original decision and from this package's own scope) that config, TLS\
  \ certs, secrets, and deploy-user write access remain fully isolated per tier even\
  \ though the nginx process itself is shared. VOC-067-DEP-03 \u2014 the founder chose\
  \ repository-driven Cloudflare API execution (not a manual dashboard change) for\
  \ the origin-port-remap removal, in the proposed order: shared edge live and health-checked\
  \ on origin :443 first, then remove the remap via the Cloudflare API, then the T04\
  \ port-normalization deploy, with an explicit rollback that restores the remap if\
  \ edge checks fail."
