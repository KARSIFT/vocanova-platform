planned_implementation_risk_floor: "Not yet computed by running scripts/governance/classify-change-risk.sh\
  \ against a real task-scoped file list. Path floor for expected areas is R3: infra/*\
  \ and .github/workflows/* are R3 in scripts/governance/classify-change-risk.sh and\
