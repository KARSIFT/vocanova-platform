dependencies:
- id: VOC-067-DEP-00
  status: "unresolved at drafting time. Whether to adopt the shared-nginx design at\
    \ all, versus keeping dual nginx and hardening the Cloudflare origin-port override\
    \ instead. Issue #485 proposes shared nginx as the preferred direction but explicitly\
    \ marks it as a design decision for planning, not an implementation mandate. Adoption\
    \ must record which path is authorized; T02\u2013T05 assume shared nginx and are\
    \ cancelled/superseded if dual-nginx-hardening is chosen instead (T01 HEALTHCHECK\
    \ fix remains valuable either way).\n"
- id: VOC-067-DEP-01
  status: "unresolved at drafting time. Shared-nginx lifecycle ownership: which compose\
    \ project owns the shared container; which pipeline may recreate vs merely reload\
    \ it; how a bad config from one tier's deploy is prevented from taking the other\
    \ tier down. Issue #485 names this as the real tradeoff that needs an explicit\
    \ answer. This package proposes concrete defaults in specification.md (dedicated\
    \ shared-edge compose; deploys only nginx -t + reload; recreate is rare/gated)\
    \ for the reviewing human to accept, amend, or reject \u2014 not as a silent implementer\
    \ choice.\n"
- id: VOC-067-DEP-02
  status: 'unresolved at drafting time. Explicit founder acceptance that sharing the
    nginx *process* while keeping conf.d fragments, TLS certs, secrets trees, deploy-user
    write scopes, and upstream networks isolated is an acceptable supersession of
    VOC-037-D00/D01''s "separate ports / separate nginx" isolation clause. Config/cert/secrets
    isolation remains mandatory either way.

    '
- id: VOC-067-DEP-03
  status: "unresolved at drafting time. Cloudflare origin-port-override removal for\
    \ production.vocanova.site / api-production.vocanova.site is an out-of-repo edge\
    \ configuration change. Exact operator steps, who executes them, and the ordered\
    \ cutover relative to repository deploys must be recorded in T00's decision evidence\
    \ and executed/verified in T05 \u2014 this package cannot itself edit Cloudflare.\n"
- id: VOC-067-DEP-04
  status: "resolved at drafting time by reading the live files. Both infra/docker-compose.yml\
    \ and infra/docker-compose.production.yml nginx HEALTHCHECKs probe `wget ... http://127.0.0.1/`\
    \ with no Host header; infra/nginx/conf.d/05-default.conf (and the production\
    \ twin) listen as default_server and `return 444` for unmatched Host \u2014 so\
    \ the probe never sees a 2xx/3xx and the HEALTHCHECK is permanently unhealthy.\
    \ Confirmed independently during drafting, not merely assumed from issue #485.\n"
