production_impact: "expected. Shared-edge cutover changes how production and staging\
  \ reach the public internet; a failed cutover or bad reload can take both tiers\
  \ offline on this shared host. Removing the Cloudflare :443\u2192:8443 remap and\
  \ the repository's :8443 port-qualification workarounds (VOC-041, VOC-042 and related)\
  \ is part of the intended end state if shared nginx is adopted. Exact blast radius\
  \ depends on VOC-067-DEP-00 / DEP-01 resolution at adoption. "
