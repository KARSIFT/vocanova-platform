name: vocanova-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vocanova-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocanova
      POSTGRES_DB: vocanova
    env_file:
      - path: ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/postgres.env
        required: false
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocanova -d vocanova"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    cpus: 1.00
    networks:
      - vocanova-production-net
    logging: *default-logging

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: ghcr.io/karsift/vocanova-api:prod
    container_name: vocanova-production-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/api.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 768m
    cpus: 0.75
    networks:
      - vocanova-production-net
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PRODUCTION_NEXT_PUBLIC_API_BASE_URL:-https://api-production.vocanova.site}
    image: ghcr.io/karsift/vocanova-web:prod
    container_name: vocanova-production-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    networks:
      - vocanova-production-net
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: vocanova-production-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/nginx/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ${VOCANOVA_PRODUCTION_ROOT:-/opt/vocanova/production}/secrets/nginx/key.pem:/etc/nginx/certs/key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 0.50
    networks:
      - vocanova-production-net
    logging: *default-logging

volumes:
  production-postgres-data:
    name: vocanova-production-postgres-data

networks:
  vocanova-production-net:
    name: vocanova-production-net
    driver: bridge
