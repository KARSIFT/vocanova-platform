# VOC-066: exact-match /healthz is the Docker HEALTHCHECK probe on
# the default server; all other unrecognized-Host paths still 444.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 444;
    }
}
